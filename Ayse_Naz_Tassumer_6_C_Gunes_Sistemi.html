<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3B Güneş Sistemi</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040b;color:white;font-family:Arial,sans-serif}
canvas{display:block;touch-action:none}
#top{position:fixed;left:18px;top:15px;z-index:4;text-shadow:0 2px 8px #000}
#top h1{font-size:23px;margin:0 0 5px}#top div{font-size:12px;color:#b9c8e8}
#bar{position:fixed;z-index:5;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);
background:#0b1430dd;border:1px solid #344b7a;border-radius:15px;padding:9px 12px;display:flex;gap:9px;align-items:center;backdrop-filter:blur(8px)}
button{border:0;border-radius:9px;padding:9px 13px;background:#1673e8;color:#fff;font-weight:700}input{width:120px}
#info{position:fixed;z-index:6;right:15px;top:15px;width:300px;max-width:calc(100% - 30px);background:#091329ee;border:1px solid #3c568b;
border-radius:16px;padding:15px;display:none;box-shadow:0 15px 45px #0008}
#info img{width:100%;height:190px;object-fit:contain;background:#020713;border-radius:12px}
#info h2{margin:8px 0;color:#83bdff}#info h3{font-size:14px;margin:12px 0 5px;color:#ffd27c}#info p{font-size:13px;margin:6px 0;line-height:1.35}#layers{width:100%;height:155px;background:#030817;border-radius:12px;display:block}#layerText{font-size:11px;color:#c5d2e8;line-height:1.4;margin-top:6px}#x{float:right;background:#263753;padding:5px 9px}
@media(max-width:650px){#top h1{font-size:18px}#bar{width:96%;justify-content:center;flex-wrap:wrap}#info{top:70px;max-height:68vh;overflow:auto}}
</style>
</head>
<body>
<div id="top"><h1>☀️ 3 Boyutlu Güneş Sistemi</h1><div>Sürükle: 3B açı • İki parmak/tekerlek: yakınlaştır • Gezegene dokun</div></div>
<div id="info"><button id="x">✕</button><img id="pic"><h2 id="nm"></h2><div id="facts"></div><h3 id="layerTitle">İç Katmanları</h3><canvas id="layers" width="270" height="170"></canvas><div id="layerText"></div></div>
<div id="bar"><button id="play">⏸ Durdur</button><b>Hız</b><input id="speed" type="range" min="0" max="5" step=".1" value="1"><span id="sv">1.0×</span><button id="reset">Görünüm</button></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x02040b);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,2000);
camera.position.set(0,145,205);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=.82;
document.body.prepend(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=.055; controls.minDistance=80; controls.maxDistance=480;
controls.target.set(0,0,0); controls.saveState();

scene.add(new THREE.AmbientLight(0x3d4964,.92));
const sunLight=new THREE.PointLight(0xfff0cf,2200,700,1.25); scene.add(sunLight);

// Stars
const sg=new THREE.BufferGeometry(), arr=[];
for(let i=0;i<1800;i++){let r=300+Math.random()*550,t=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1);arr.push(r*Math.sin(p)*Math.cos(t),r*Math.cos(p),r*Math.sin(p)*Math.sin(t))}
sg.setAttribute('position',new THREE.Float32BufferAttribute(arr,3));
scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:.7,sizeAttenuation:true})));

// procedural texture canvas
function tex(kind,c1,c2){
 const c=document.createElement('canvas');c.width=512;c.height=256;const g=c.getContext('2d');
 let gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,c1);gr.addColorStop(1,c2);g.fillStyle=gr;g.fillRect(0,0,512,256);
 if(kind==='earth'){
   g.fillStyle='#4f8b52';
   [[78,68,52,27],[190,108,43,53],[304,72,58,30],[411,128,42,44]].forEach(a=>{g.beginPath();g.ellipse(...a,0,0,Math.PI*2);g.fill()});
   g.strokeStyle='#ffffff55';g.lineWidth=10;for(let y=30;y<240;y+=45){g.beginPath();g.moveTo(0,y);g.bezierCurveTo(150,y-20,330,y+25,512,y);g.stroke()}
 }
 if(kind==='bands'){
   for(let y=10;y<256;y+=25){g.fillStyle=(y/25)%2?'#ffffff22':'#5a260022';g.fillRect(0,y,512,10)}
 }
 if(kind==='crater'){
   for(let i=0;i<40;i++){let x=Math.random()*512,y=Math.random()*256,r=3+Math.random()*11;g.fillStyle='#20150d33';g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}
 }
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=THREE.RepeatWrapping;return t
}
const pdata=[
['Merkür',5,30,4.15,'#a9a39b','#514d48','crater','4.879 km','57,9 milyon km','88 gün','0'],
['Venüs',7.5,42,1.62,'#d8b36a','#8c6236','bands','12.104 km','108,2 milyon km','224,7 gün','0'],
['Dünya',8,55,1,'#1c78bd','#06366f','earth','12.756 km','149,6 milyon km','365,26 gün','1'],
['Mars',6.5,69,.53,'#b85b3b','#5e291e','crater','6.792 km','228,0 milyon km','687 gün','2'],
['Jüpiter',11.5,91,.084,'#cbb18f','#765746','bands','142.984 km','778,5 milyon km','11,86 yıl','95'],
['Satürn',9.8,116,.034,'#d1bd8e','#8e7958','bands','120.536 km','1,43 milyar km','29,45 yıl','274'],
['Uranüs',8.3,139,.012,'#8adce5','#252a30','bands','51.118 km','2,87 milyar km','84,0 yıl','28'],
['Neptün',8.1,160,.006,'#376fd5','#102c79','bands','49.528 km','4,50 milyar km','164,8 yıl','16']
];

const clickable=[], planets=[];
function sunTexture(){
 const c=document.createElement('canvas');c.width=1024;c.height=512;const g=c.getContext('2d');
 const img=g.createImageData(c.width,c.height),d=img.data;
 // multi-scale deterministic pseudo-noise for a mottled photosphere
 function n(x,y,k){return (Math.sin(x*.071*k+Math.sin(y*.039*k))*Math.cos(y*.083*k+Math.sin(x*.027*k))*.5+.5)}
 for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++){
   let q=.48*n(x,y,1)+.28*n(x,y,2.7)+.16*n(x,y,6.2)+.08*n(x,y,13);
   let i=(y*c.width+x)*4;
   d[i]=Math.min(255,235+q*20);       // red
   d[i+1]=Math.min(255,145+q*60);     // green
   d[i+2]=Math.min(255,18+q*18);       // blue
   d[i+3]=255;
 }
 g.putImageData(img,0,0);
 // subtle darker sunspot groups
 for(let j=0;j<18;j++){
   let x=(j*173+91)%1024,y=(j*97+63)%512,rx=3+(j%5)*2,ry=2+(j%4);
   let gr=g.createRadialGradient(x,y,1,x,y,rx*2.5);gr.addColorStop(0,'rgba(100,48,5,.60)');gr.addColorStop(.45,'rgba(135,65,8,.32)');gr.addColorStop(1,'rgba(145,72,10,0)');
   g.fillStyle=gr;g.beginPath();g.ellipse(x,y,rx*2.5,ry*2.5,0,0,Math.PI*2);g.fill();
 }
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=THREE.RepeatWrapping;return t;
}
const sun=new THREE.Mesh(new THREE.SphereGeometry(18,96,96),new THREE.MeshStandardMaterial({
 map:sunTexture(),color:0xffbd45,emissive:0xff8c16,emissiveMap:sunTexture(),
 emissiveIntensity:.92,roughness:1
}));
sun.userData={name:'Güneş'};scene.add(sun);clickable.push(sun);
const corona=new THREE.Mesh(new THREE.SphereGeometry(19.3,64,64),new THREE.MeshBasicMaterial({
 color:0xffb13b,transparent:true,opacity:.075,side:THREE.BackSide,blending:THREE.AdditiveBlending,depthWrite:false
}));
scene.add(corona);

pdata.forEach((p,i)=>{
 const [name,size,radius,vel,c1,c2,kind]=p;
 const curve=new THREE.EllipseCurve(0,0,radius,radius,0,Math.PI*2);
 const pts=curve.getPoints(160).map(q=>new THREE.Vector3(q.x,0,q.y));
 scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x31507c,transparent:true,opacity:.55})));
 const pivot=new THREE.Group();scene.add(pivot);
 const mat=new THREE.MeshStandardMaterial({map:tex(kind,c1,c2),roughness:.9,metalness:0});
 const mesh=new THREE.Mesh(new THREE.SphereGeometry(size,64,64),mat);
 mesh.position.x=radius;mesh.rotation.z=(i===2?23.4: i===5?26.7:8)*Math.PI/180;
 mesh.userData={index:i,name};pivot.add(mesh);clickable.push(mesh);
 if(name==='Satürn'){
   // Correct 3D annular ring: outside the sphere, with a real central gap.
   const ringMat=new THREE.MeshBasicMaterial({color:0xd8bd83,side:THREE.DoubleSide,transparent:true,opacity:.92,depthWrite:true});
   const ring=new THREE.Mesh(new THREE.RingGeometry(size*1.35,size*2.25,128),ringMat);
   ring.rotation.x=Math.PI/2; mesh.add(ring);
   const ring2=new THREE.Mesh(new THREE.RingGeometry(size*1.58,size*1.72,128),new THREE.MeshBasicMaterial({color:0xa68b61,side:THREE.DoubleSide,transparent:true,opacity:.58,depthWrite:true}));
   ring2.rotation.x=Math.PI/2;mesh.add(ring2);
 }
 if(name==='Dünya'){
   const mg=new THREE.Group();mesh.add(mg);const moon=new THREE.Mesh(new THREE.SphereGeometry(2.1,32,32),new THREE.MeshStandardMaterial({color:0xbcbcbc,roughness:1}));moon.position.x=14;mg.add(moon);mesh.userData.moonGroup=mg;
 }
 planets.push({mesh,pivot,vel,angle:Math.random()*Math.PI*2});
});


// Ana Asteroit Kuşağı — Mars ile Jüpiter arasında.
// Eğitimsel görünürlük için parçacık boyutları ve sayısı ölçeklendirilmiştir.
const asteroidBelt=new THREE.Group();
scene.add(asteroidBelt);
const asteroidGeo=new THREE.IcosahedronGeometry(.34,0);
const asteroidMat=new THREE.MeshStandardMaterial({color:0x81786d,roughness:1,metalness:0});
const asteroidCount=650;
const asteroidMesh=new THREE.InstancedMesh(asteroidGeo,asteroidMat,asteroidCount);
const dummy=new THREE.Object3D();
for(let i=0;i<asteroidCount;i++){
  const a=Math.random()*Math.PI*2;
  const r=74+Math.random()*12; // visually between Mars and Jupiter
  const y=(Math.random()-.5)*3.2;
  const sc=.35+Math.random()*1.6;
  dummy.position.set(Math.cos(a)*r,y,Math.sin(a)*r);
  dummy.rotation.set(Math.random()*Math.PI,Math.random()*Math.PI,Math.random()*Math.PI);
  dummy.scale.set(sc*(.7+Math.random()*.7),sc*(.6+Math.random()*.8),sc*(.7+Math.random()*.7));
  dummy.updateMatrix(); asteroidMesh.setMatrixAt(i,dummy.matrix);
}
asteroidBelt.add(asteroidMesh);

// labels as DOM overlay
const beltLabel=document.createElement('div');beltLabel.textContent='Ana Asteroit Kuşağı';beltLabel.style.cssText='position:fixed;z-index:3;font:10px Arial;color:#aaa;text-shadow:0 2px 4px #000;pointer-events:none';document.body.appendChild(beltLabel);
const labels=pdata.map(p=>{let e=document.createElement('div');e.textContent=p[0];e.style.cssText='position:fixed;z-index:3;font:11px Arial;color:white;text-shadow:0 2px 4px #000;pointer-events:none';document.body.appendChild(e);return e});


const layerInfo={
'Güneş':{layers:[['Çekirdek','#fff2a6',.25],['Işınım bölgesi','#ffc247',.55],['Taşınım bölgesi','#f28a18',.86],['Fotosfer','#e86608',1]],text:'Güneş’in merkezinde enerji üreten çekirdek bulunur. Çekirdeğin dışında ışınım bölgesi ve taşınım bölgesi yer alır. Görünen yüzeyine fotosfer denir. Fotosferin üzerinde kromosfer ve en dışta korona bulunur.'},
'Merkür':{layers:[['Katı iç çekirdek','#f6d16b',.28],['Sıvı dış çekirdek','#e8903b',.50],['Manto','#8f5a43',.76],['Kabuk','#8e8a82',1]],text:'Merkür büyük bir metalik çekirdeğe, kayalık mantoya ve ince bir kabuğa sahiptir.'},
'Venüs':{layers:[['Çekirdek','#f2b24f',.34],['Manto','#b8613f',.82],['Kabuk','#c99457',1]],text:'Venüs; çekirdek, sıcak kayalık manto ve katı kabuktan oluşur.'},
'Dünya':{layers:[['İç çekirdek','#fff0a0',.20],['Dış çekirdek','#f39b34',.42],['Manto','#b84e32',.88],['Kabuk','#537f55',1]],text:'Dünya’nın temel katmanları iç çekirdek, dış çekirdek, manto ve kabuktur.'},
'Mars':{layers:[['Çekirdek','#e0a64c',.42],['Manto','#9b4330',.88],['Kabuk','#a84d35',1]],text:'Mars’ın merkezinde metalik çekirdek, çevresinde kayalık manto ve dışta kabuk bulunur.'},
'Jüpiter':{layers:[['Yoğun çekirdek bölgesi','#d8a069',.24],['Metalik hidrojen','#b26b65',.55],['Sıvı hidrojen/helyum','#d2a77d',.80],['Gaz atmosfer','#d7bea0',1]],text:'Jüpiter katı bir yüzeye sahip değildir. Bilimsel modellere göre derinlere indikçe hidrojen çok yüksek basınç altında sıvı ve metalik özellik gösteren hâllere geçer.'},
'Satürn':{layers:[['Yoğun çekirdek bölgesi','#c99b63',.24],['Metalik hidrojen','#a97763',.48],['Sıvı hidrojen/helyum','#c9aa79',.78],['Gaz atmosfer','#d8c493',1]],text:'Satürn bir gaz devidir. Bilimsel modellere göre dıştaki atmosferin altında sıvı ve daha derinde metalik özellik gösteren hidrojen bölgeleri bulunur.'},
'Uranüs':{layers:[['Kayalık çekirdek','#9a795f',.25],['Su-amonyak-metan bakımından zengin manto','#4a91a6',.78],['Hidrojen-helyum atmosferi','#86d6df',1]],text:'Uranüs bir buz devidir. “Buz” adı, iç kısmındaki su, amonyak ve metan bakımından zengin sıcak yoğun maddeleri ifade eder.'},
'Neptün':{layers:[['Kayalık çekirdek','#8b6e5c',.25],['Su-amonyak-metan bakımından zengin manto','#315c9d',.78],['Hidrojen-helyum atmosferi','#376dcc',1]],text:'Neptün bir buz devidir; yoğun iç manto bölgesinin üzerinde hidrojen ve helyum ağırlıklı atmosfer bulunur.'}
};
function drawLayers(name){
 const cv=document.getElementById('layers'),g=cv.getContext('2d'),D=layerInfo[name];
 g.clearRect(0,0,cv.width,cv.height);
 if(!D){document.getElementById('layerText').textContent='';return}
 const cx=105,cy=85,R=70;
 // Full sphere shadow
 let bg=g.createRadialGradient(cx-20,cy-20,5,cx,cy,R);bg.addColorStop(0,'#ffffff22');bg.addColorStop(1,'#00000055');
 g.fillStyle='#26344d';g.beginPath();g.arc(cx,cy,R,0,Math.PI*2);g.fill();
 // Concentric layers, outer to inner
 [...D.layers].reverse().forEach(L=>{
   g.fillStyle=L[1];g.beginPath();g.arc(cx,cy,R*L[2],0,Math.PI*2);g.fill();
 });
 // Cut away upper-right quarter so nested layers are visibly "inside"
 g.save();g.globalCompositeOperation='destination-out';g.beginPath();g.moveTo(cx,cy);g.arc(cx,cy,R+2,-Math.PI/2,0);g.closePath();g.fill();g.restore();
 // Redraw exposed radial boundaries
 g.strokeStyle='#ffffff55';g.lineWidth=1;
 D.layers.forEach(L=>{g.beginPath();g.arc(cx,cy,R*L[2],-Math.PI/2,0);g.stroke()});
 // legend
 g.font='11px Arial';g.textBaseline='middle';
 D.layers.forEach((L,i)=>{let y=25+i*27;g.fillStyle=L[1];g.fillRect(190,y-6,10,10);g.fillStyle='#eaf1ff';g.fillText(L[0],205,y)});
 document.getElementById('layerText').textContent=D.text;
}

let running=true,speed=1,last=performance.now();
function loop(now){
 requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.05);last=now;
 if(running){
   planets.forEach((o,i)=>{o.angle+=o.vel*speed*dt*.16;o.pivot.rotation.y=o.angle;{
     const selfDir=(i===1)?-1:1; // Venüs saat yönünde; diğerleri saat yönünün tersine
     o.mesh.rotation.y+=selfDir*dt*.10*speed;
   }if(o.mesh.userData.moonGroup)o.mesh.userData.moonGroup.rotation.y+=dt*.65*speed});
   sun.rotation.y+=dt*.035*speed;corona.rotation.y-=dt*.012*speed;asteroidBelt.rotation.y+=dt*.012*speed;
 }
 controls.update();renderer.render(scene,camera);
 let bv=new THREE.Vector3(82,0,0).project(camera);beltLabel.style.left=((bv.x*.5+.5)*innerWidth+8)+'px';beltLabel.style.top=((-bv.y*.5+.5)*innerHeight+8)+'px';beltLabel.style.display=bv.z<1?'block':'none';
 planets.forEach((o,i)=>{let v=new THREE.Vector3();o.mesh.getWorldPosition(v);v.project(camera);labels[i].style.left=((v.x*.5+.5)*innerWidth+10)+'px';labels[i].style.top=((-v.y*.5+.5)*innerHeight-6)+'px';labels[i].style.display=v.z<1?'block':'none'});
}
requestAnimationFrame(loop);

const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
renderer.domElement.addEventListener('click',e=>{
 mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(mouse,camera);
 const hit=ray.intersectObjects(clickable,false)[0];if(!hit)return;
 let u=hit.object.userData;if(u.name==='Güneş'){showSun();return} show(u.index);
});
function snapshot(obj){
 const old=controls.enabled;controls.enabled=false;
 const box=new THREE.Box3().setFromObject(obj),center=box.getCenter(new THREE.Vector3()),sz=box.getSize(new THREE.Vector3()).length();
 const oldPos=camera.position.clone(),oldTarget=controls.target.clone();
 let dir=new THREE.Vector3(1,.45,1).normalize();camera.position.copy(center).add(dir.multiplyScalar(sz*2.2));controls.target.copy(center);camera.lookAt(center);
 renderer.render(scene,camera);let url=renderer.domElement.toDataURL('image/png');
 camera.position.copy(oldPos);controls.target.copy(oldTarget);camera.lookAt(oldTarget);controls.enabled=old;return url;
}
function show(i){document.getElementById('layerTitle').style.display='block';document.getElementById('layers').style.display='block';document.getElementById('layerText').style.display='block';let p=pdata[i],obj=planets[i].mesh;document.getElementById('pic').src=snapshot(obj);document.getElementById('nm').textContent=p[0];document.getElementById('facts').innerHTML=`<p><b>Çapı:</b> ${p[7]}</p><p><b>Güneş'e uzaklığı:</b> ${p[8]}</p><p><b>Dolanma süresi:</b> ${p[9]}</p><p><b>Uydu sayısı:</b> ${p[10]}</p>`;document.getElementById('info').style.display='block';drawLayers(p[0])}
function showSun(){document.getElementById('layerTitle').style.display='block';document.getElementById('layers').style.display='block';document.getElementById('layerText').style.display='block';document.getElementById('pic').src=snapshot(sun);document.getElementById('nm').textContent='Güneş';document.getElementById('facts').innerHTML='<p><b>Çapı:</b> yaklaşık 1,39 milyon km</p><p>Güneş Sistemi’nin merkezindeki yıldızdır.</p>';document.getElementById('info').style.display='block';drawLayers('Güneş')}
document.getElementById('x').onclick=()=>document.getElementById('info').style.display='none';
document.getElementById('play').onclick=function(){running=!running;this.textContent=running?'⏸ Durdur':'▶ Başlat'};
document.getElementById('speed').oninput=function(){speed=+this.value;document.getElementById('sv').textContent=speed.toFixed(1)+'×'};
document.getElementById('reset').onclick=()=>controls.reset();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>

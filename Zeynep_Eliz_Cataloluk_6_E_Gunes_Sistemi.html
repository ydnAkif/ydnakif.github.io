<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeynep'in Güneş Sistemi Modeli</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: Arial, sans-serif;
      color: #fff;
    }

    #main-title {
      position: absolute;
      top: 15px;
      width: 100%;
      text-align: center;
      z-index: 10;
      font-size: 24px;
      font-weight: bold;
      color: #ffd700;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
      pointer-events: none;
    }

    /* Başlangıç Ekranı ve Buton Stili */
    #intro-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    #start-btn {
      background: linear-gradient(45deg, #ffd700, #ff8c00);
      color: #000;
      border: none;
      padding: 20px 40px;
      font-size: 22px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    #start-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 35px rgba(255, 215, 0, 0.9);
    }

    #ui-container {
      position: absolute;
      top: 60px;
      left: 10px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.8);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      max-width: 280px;
    }

    .control-group {
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #444;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .planet-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    button, select {
      background: #222;
      color: #fff;
      border: 1px solid #666;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }

    button:hover, select:hover {
      background: #444;
      border-color: #ffd700;
    }

    .planet-btn {
      background: #111;
      border: 1px solid #555;
    }

    #info-card {
      position: absolute;
      top: 60px;
      right: 10px;
      z-index: 10;
      width: 290px;
      background: rgba(0, 0, 0, 0.85);
      border: 2px solid #ffd700;
      border-radius: 10px;
      padding: 15px;
      display: none;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
      max-height: 80vh;
      overflow-y: auto;
    }

    #info-card h2 {
      margin-top: 0;
      color: #ffd700;
      font-size: 20px;
      border-bottom: 1px solid #444;
      padding-bottom: 5px;
    }

    #info-card p {
      margin: 8px 0;
      font-size: 13px;
      line-height: 1.4;
    }

    #close-card {
      position: absolute;
      top: 8px;
      right: 8px;
      background: transparent;
      border: none;
      color: #fff;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- Başlangıç Ekranı ve Butonu -->
  <div id="intro-screen">
    <button id="start-btn">Zeynep’in Güneş Sistemine Hoş Geldiniz</button>
  </div>

  <div id="main-title">Zeynep’in Güneş Sistemine Hoş Geldiniz</div>

  <div id="ui-container">
    <div class="control-group">
      <div style="display: flex; gap: 5px;">
        <button id="toggle-btn" style="flex: 1;">Durdur</button>
        <select id="speed-select" style="flex: 1;">
          <option value="0.5">0.5x Yavaş</option>
          <option value="1" selected>1x Normal</option>
          <option value="2">2x Hızlı</option>
          <option value="5">5x Çok Hızlı</option>
        </select>
      </div>
      <button id="music-btn" style="background: #331a40; border-color: #9933ff;">🎵 Uzay Müziği: Kapalı</button>
    </div>
    
    <div style="margin-bottom: 5px; font-weight: bold; font-size: 13px; color: #ffd700;">Gök Cismi Seç:</div>
    <div class="planet-buttons" id="planet-buttons-container"></div>
  </div>

  <div id="info-card">
    <button id="close-card">X</button>
    <h2 id="card-title">Gezegen Adı</h2>
    <p><strong>Çap:</strong> <span id="card-diameter">-</span></p>
    <p><strong>Güneş'e Uzaklık:</strong> <span id="card-distance">-</span></p>
    <p><strong>Dolanma Süresi:</strong> <span id="card-period">-</span></p>
    <p><strong>Uydu Bilgisi:</strong> <span id="card-moons">-</span></p>
    <p><strong>İç Katman Yapısı:</strong> <span id="card-layers">-</span></p>
    <p><strong>Önemli Özellikleri:</strong> <span id="card-features">-</span></p>
  </div>

  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 150, 300);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const ambientLight = new THREE.AmbientLight(0x555555);
    scene.add(ambientLight);

    const sunLight = new THREE.PointLight(0xffffff, 2, 500);
    scene.add(sunLight);

    const starsGeometry = new THREE.BufferGeometry();
    const starsCount = 3000;
    const starPositions = new Float32Array(starsCount * 3);

    for (let i = 0; i < starsCount * 3; i++) {
      starPositions[i] = (Math.random() - 0.5) * 600;
    }

    starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.7 });
    scene.add(new THREE.Points(starsGeometry, starsMaterial));

    const planetData = [
      { 
        name: "Güneş", radius: 7, color: 0xffcc00, coreColor: 0xff0000, distance: 0, speed: 0, 
        diameter: "1.392.700 km", sunDistance: "0 km", period: "-", moons: "0 (Merkez Yıldız)",
        layers: "Sıcak Çekirdek, Işınım Bölgesi, Konvektif Bölge ve Korona (Atmosfer)",
        features: "Isı ve ışık kaynağımız olan dev yıldız."
      },
      { 
        name: "Merkür", radius: 0.8, color: 0xaaaaaa, coreColor: 0xff4400, distance: 12, speed: 0.04, 
        diameter: "4.879 km", sunDistance: "57.9 milyon km", period: "88 gün", moons: "Uydusu Yoktur.",
        layers: "Büyük Demir Çekirdek, Kayalık Manto ve İnce Kabuk.",
        features: "Güneş'e en yakın ve en küçük gezegendir."
      },
      { 
        name: "Venüs", radius: 1.2, color: 0xe3bb76, coreColor: 0xff3300, distance: 18, speed: 0.03, 
        diameter: "12.104 km", sunDistance: "108.2 milyon km", period: "225 gün", moons: "Uydusu Yoktur.",
        layers: "Demir Çekirdek, Kayalık Manto ve Bazaltik Kabuk.",
        features: "En sıcak gezegendir."
      },
      { 
        name: "Dünya", radius: 1.4, color: 0x2233ff, coreColor: 0xffaa00, distance: 25, speed: 0.02, 
        diameter: "12.742 km", sunDistance: "149.6 milyon km", period: "365 gün", 
        moons: "1 Adet (Ay)",
        moonList: [{ name: "Ay", dist: 2.5, size: 0.3, speed: 0.03, color: 0xcccccc }],
        layers: "Katı İç Çekirdek, Sıvı Dış Çekirdek, Manto ve Taş Küre (Kabuk).",
        features: "Üzerinde yaşam olan tek gezegen."
      },
      { 
        name: "Mars", radius: 1.0, color: 0xc1440e, coreColor: 0x992200, distance: 32, speed: 0.016, 
        diameter: "6.779 km", sunDistance: "227.9 milyon km", period: "687 gün", 
        moons: "2 Adet (Phobos, Deimos)",
        moonList: [
          { name: "Phobos", dist: 1.8, size: 0.15, speed: 0.04, color: 0xaaaaaa },
          { name: "Deimos", dist: 2.3, size: 0.1, speed: 0.025, color: 0x888888 }
        ],
        layers: "Demir-Sülfür Çekirdek, Silikat Manto ve Paslı Kabuk.",
        features: "Kızıl Gezegen."
      },
      { 
        name: "Jüpiter", radius: 3.5, color: 0xb07f35, coreColor: 0x665544, distance: 44, speed: 0.009, 
        diameter: "139.822 km", sunDistance: "778.5 milyon km", period: "12 yıl", 
        moons: "95 Adet (Önemlileri: Ganymede, Callisto, Io, Europa)",
        moonList: [
          { name: "Io", dist: 4.5, size: 0.25, speed: 0.05, color: 0xffff66 },
          { name: "Europa", dist: 5.2, size: 0.22, speed: 0.04, color: 0xcccccc },
          { name: "Ganymede", dist: 6.0, size: 0.35, speed: 0.03, color: 0x999999 },
          { name: "Callisto", dist: 6.8, size: 0.3, speed: 0.02, color: 0x666666 }
        ],
        layers: "Kaya/Metal Çekirdek, Sıvı Metalik Hidrojen ve Gaz Atmosfer.",
        features: "En büyük gezegen."
      },
      { 
        name: "Satürn", radius: 2.8, color: 0xe2bf7d, coreColor: 0x554433, distance: 58, speed: 0.007, rings: true, 
        diameter: "116.460 km", sunDistance: "1.4 milyar km", period: "29 yıl", 
        moons: "146 Adet (En büyüğü: Titan)",
        moonList: [{ name: "Titan", dist: 5.5, size: 0.35, speed: 0.025, color: 0xe3a857 }],
        layers: "Küçük Taş Çekirdek, Sıvı Hidrojen ve Gaz Atmosfer.",
        features: "Halkalı dev."
      },
      { 
        name: "Uranüs", radius: 2.0, color: 0x4b70dd, coreColor: 0x2288bb, distance: 70, speed: 0.004, 
        diameter: "50.724 km", sunDistance: "2.9 milyar km", period: "84 yıl", 
        moons: "28 Adet (En büyüğü: Titania)",
        moonList: [{ name: "Titania", dist: 3.5, size: 0.2, speed: 0.03, color: 0xbbbbbb }],
        layers: "Kayalık Çekirdek, Sıcak Buzlu Manto (Su/Metan) ve Gaz Katmanı.",
        features: "Buz devi."
      },
      { 
        name: "Neptün", radius: 1.9, color: 0x274687, coreColor: 0x114499, distance: 82, speed: 0.003, 
        diameter: "49.244 km", sunDistance: "4.5 milyar km", period: "165 yıl", 
        moons: "16 Adet (En büyüğü: Triton)",
        moonList: [{ name: "Triton", dist: 3.2, size: 0.22, speed: 0.028, color: 0xdddddd }],
        layers: "Metalik Kayalık Çekirdek, Yoğun Buzlu Manto ve Gaz Katmanı.",
        features: "Rüzgarlı buz devi."
      },
      {
        name: "Kuyruklu Yıldız", radius: 0.5, color: 0x88ffff, coreColor: 0xffffff, distance: 0, speed: 0.015,
        diameter: "~11 km", sunDistance: "Değişken (Eliptik Yörünge)", period: "75 Yıl (Halley)", moons: "Yok",
        layers: "Buz, Donmuş Gazlar ve Kaya Parçalarından Oluşan Çekirdek.",
        features: "Güneş'e yaklaştıkça ısınır ve arkasında gaz ile tozdan uzun parlak bir kuyruk oluşturur."
      },
      {
        name: "Astronot", radius: 0.3, color: 0xffffff, coreColor: 0x222222, distance: 0, speed: 0.01,
        diameter: "2 metre", sunDistance: "Dünya Yakını", period: "-", moons: "Yok",
        layers: "Basınçlı Uzay Elbisesi, Kask ve Hayatta Kalma Katmanları",
        features: "Uzayda görev yapan insan araştırmacı."
      }
    ];

    const interactiveObjects = [];
    const planetMeshes = [];
    const allMoons = [];

    const sunData = planetData[0];
    const sunGroup = new THREE.Group();
    const sunMesh = new THREE.Mesh(
      new THREE.SphereGeometry(sunData.radius, 32, 32),
      new THREE.MeshBasicMaterial({ color: sunData.color, transparent: true, opacity: 0.7 })
    );
    sunMesh.userData = sunData;

    const sunCore = new THREE.Mesh(
      new THREE.SphereGeometry(sunData.radius * 0.4, 32, 32),
      new THREE.MeshBasicMaterial({ color: sunData.coreColor })
    );
    sunGroup.add(sunMesh);
    sunGroup.add(sunCore);
    scene.add(sunGroup);
    interactiveObjects.push(sunMesh);

    for (let i = 1; i < 9; i++) {
      const data = planetData[i];

      const orbitGeo = new THREE.BufferGeometry();
      const points = [];
      for (let j = 0; j <= 128; j++) {
        const theta = (j / 128) * Math.PI * 2;
        points.push(new THREE.Vector3(Math.cos(theta) * data.distance, 0, Math.sin(theta) * data.distance));
      }
      orbitGeo.setFromPoints(points);
      scene.add(new THREE.Line(orbitGeo, new THREE.LineBasicMaterial({ color: 0x555555, transparent: true, opacity: 0.4 })));

      const pGroup = new THREE.Group();

      const outerGeo = new THREE.SphereGeometry(data.radius, 32, 32);
      const outerMat = new THREE.MeshStandardMaterial({ 
        color: data.color, roughness: 0.5, transparent: true, opacity: 0.65 
      });
      const outerMesh = new THREE.Mesh(outerGeo, outerMat);
      outerMesh.userData = data;
      pGroup.add(outerMesh);

      const coreGeo = new THREE.SphereGeometry(data.radius * 0.45, 16, 16);
      const coreMat = new THREE.MeshStandardMaterial({ color: data.coreColor, roughness: 0.3 });
      pGroup.add(new THREE.Mesh(coreGeo, coreMat));

      if (data.rings) {
        const ringGeo = new THREE.RingGeometry(data.radius + 0.8, data.radius + 2.5, 32);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xa68c59, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.rotation.x = Math.PI / 2;
        pGroup.add(ringMesh);
      }

      if (data.moonList) {
        data.moonList.forEach(mInfo => {
          const mMesh = new THREE.Mesh(
            new THREE.SphereGeometry(mInfo.size, 16, 16),
            new THREE.MeshStandardMaterial({ color: mInfo.color })
          );
          mMesh.position.set(mInfo.dist, 0, 0);

          const mPivot = new THREE.Group();
          mPivot.add(mMesh);
          pGroup.add(mPivot);

          allMoons.push({ pivot: mPivot, mesh: mMesh, speed: mInfo.speed });
        });
      }

      const pPivot = new THREE.Group();
      pGroup.position.x = data.distance;
      pPivot.add(pGroup);

      scene.add(pPivot);

      planetMeshes.push({ mesh: pGroup, pivot: pPivot, speed: data.speed });
      interactiveObjects.push(outerMesh);
    }

    const cometData = planetData[9];
    const cometGroup = new THREE.Group();

    const cometHead = new THREE.Mesh(
      new THREE.SphereGeometry(cometData.radius, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0xaaffff })
    );
    cometHead.userData = cometData;
    cometGroup.add(cometHead);

    const tailGeo = new THREE.ConeGeometry(0.8, 8, 16);
    const tailMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.4 });
    const cometTail = new THREE.Mesh(tailGeo, tailMat);
    cometTail.position.z = -4;
    cometTail.rotation.x = Math.PI / 2;
    cometGroup.add(cometTail);

    scene.add(cometGroup);
    interactiveObjects.push(cometHead);

    const astronautData = planetData[10];
    const astronautGroup = new THREE.Group();

    const body = new THREE.Mesh(
      new THREE.CylinderGeometry(0.3, 0.3, 0.8, 16),
      new THREE.MeshStandardMaterial({ color: 0xeeeeee })
    );

    const helmet = new THREE.Mesh(
      new THREE.SphereGeometry(0.25, 16, 16),
      new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.1 })
    );
    helmet.position.y = 0.55;
    
    const visor = new THREE.Mesh(
      new THREE.SphereGeometry(0.18, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0xffd700 })
    );
    visor.position.set(0, 0.55, 0.1);

    astronautGroup.add(body);
    astronautGroup.add(helmet);
    astronautGroup.add(visor);
    astronautGroup.scale.set(1.5, 1.5, 1.5);

    const astronautPivot = new THREE.Group();
    astronautGroup.position.set(28, 2, 0);
    astronautGroup.userData = astronautData;
    body.userData = astronautData;
    astronautPivot.add(astronautGroup);

    scene.add(astronautPivot);
    interactiveObjects.push(body);

    const asteroidGroup = new THREE.Group();
    for (let i = 0; i < 800; i++) {
      const astMesh = new THREE.Mesh(
        new THREE.SphereGeometry(Math.random() * 0.15 + 0.05, 8, 8),
        new THREE.MeshStandardMaterial({ color: 0x888888 })
      );
      const distance = 35 + Math.random() * 5;
      const theta = Math.random() * Math.PI * 2;
      astMesh.position.set(Math.cos(theta) * distance, (Math.random() - 0.5) * 2, Math.sin(theta) * distance);
      asteroidGroup.add(astMesh);
    }
    scene.add(asteroidGroup);

    const buttonsContainer = document.getElementById('planet-buttons-container');
    planetData.forEach((item) => {
      const btn = document.createElement('button');
      btn.className = 'planet-btn';
      btn.innerText = item.name;
      
      btn.addEventListener('click', () => {
        alert("İyi insanlar Zeynep'in güneş sistemini inceliyor! ✨");
        showInfoCard(item);
      });
      
      buttonsContainer.appendChild(btn);
    });

    let isRunning = true;
    let speedMultiplier = 1;
    let cometAngle = 0;
    let introAnimation = false; // Başlangıçta animasyon durur, butona basınca başlar

    document.getElementById('start-btn').addEventListener('click', () => {
      document.getElementById('intro-screen').style.display = 'none';
      introAnimation = true; // Butona basılınca tanıtım filmi başlar
    });

    function animate() {
      requestAnimationFrame(animate);

      if (introAnimation) {
        camera.position.z -= 1.5;
        camera.position.y -= 0.7;
        if (camera.position.z <= 100) {
          camera.position.z = 100;
          camera.position.y = 50;
          introAnimation = false;
        }
      }

      if (isRunning) {
        sunMesh.rotation.y += 0.002 * speedMultiplier;
        asteroidGroup.rotation.y += 0.003 * speedMultiplier;

        planetMeshes.forEach(item => {
          item.pivot.rotation.y += item.speed * speedMultiplier;
          item.mesh.rotation.y += 0.01 * speedMultiplier;
        });

        allMoons.forEach(m => {
          m.pivot.rotation.y += m.speed * speedMultiplier;
          m.mesh.rotation.y += 0.02 * speedMultiplier;
        });

        cometAngle -= 0.008 * speedMultiplier;
        const a = 60;
        const b = 25;
        cometGroup.position.x = Math.cos(cometAngle) * a + 15;
        cometGroup.position.z = Math.sin(cometAngle) * b;
        cometGroup.rotation.y = -cometAngle - Math.PI / 2;

        astronautPivot.rotation.y += 0.005 * speedMultiplier;
        astronautGroup.rotation.x += 0.01 * speedMultiplier;
        astronautGroup.rotation.z += 0.005 * speedMultiplier;
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    let audioCtx = null;
    let isMusicPlaying = false;
    let oscillators = [];
    let gainNode = null;

    function toggleSpaceMusic() {
      if (!isMusicPlaying) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        gainNode = audioCtx.createGain();
        gainNode.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gainNode.connect(audioCtx.destination);

        const frequencies = [110, 164.81, 220, 329.63];
        oscillators = frequencies.map(freq => {
          const osc = audioCtx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          osc.connect(gainNode);
          osc.start();
          return osc;
        });

        isMusicPlaying = true;
        document.getElementById('music-btn').innerText = "🎵 Uzay Müziği: Açık";
        document.getElementById('music-btn').style.background = "#592d75";
      } else {
        if (oscillators.length > 0) {
          oscillators.forEach(osc => osc.stop());
          oscillators = [];
        }
        if (audioCtx) {
          audioCtx.close();
        }
        isMusicPlaying = false;
        document.getElementById('music-btn').innerText = "🎵 Uzay Müziği: Kapalı";
        document.getElementById('music-btn').style.background = "#331a40";
      }
    }

    document.getElementById('music-btn').addEventListener('click', toggleSpaceMusic);

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (event) => {
      if (event.target.tagName !== 'CANVAS') return;

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveObjects);

      if (intersects.length > 0) {
        showInfoCard(intersects[0].object.userData);
      }
    });

    function showInfoCard(data) {
      document.getElementById('card-title').innerText = data.name;
      document.getElementById('card-diameter').innerText = data.diameter;
      document.getElementById('card-distance').innerText = data.sunDistance;
      document.getElementById('card-period').innerText = data.period;
      document.getElementById('card-moons').innerText = data.moons;
      document.getElementById('card-layers').innerText = data.layers;
      document.getElementById('card-features').innerText = data.features;
      document.getElementById('info-card').style.display = 'block';
    }

    document.getElementById('close-card').addEventListener('click', () => {
      document.getElementById('info-card').style.display = 'none';
    });

    document.getElementById('toggle-btn').addEventListener('click', (e) => {
      isRunning = !isRunning;
      e.target.innerText = isRunning ? "Durdur" : "Başlat";
    });

    document.getElementById('speed-select').addEventListener('change', (e) => {
      speedMultiplier = parseFloat(e.target.value);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>

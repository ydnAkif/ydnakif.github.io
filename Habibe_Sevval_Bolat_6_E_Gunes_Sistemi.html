<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>3D İnteraktif Güneş Sistemi - Fen Bilimleri Ödevi</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
      touch-action: none;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    /* Üst Kontrol Paneli */
    #ui-container {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 14px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      max-width: calc(100% - 30px);
      flex-wrap: wrap;
    }
    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover { background: #1d4ed8; }
    
    .slider-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }
    input[type=range] {
      accent-color: #38bdf8;
      cursor: pointer;
      width: 80px;
    }

    /* Zoom Paneli */
    #zoom-controls {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .zoom-btn {
      width: 44px;
      height: 44px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      border-radius: 50%;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    /* Bilgi Kartı Panel */
    #info-card {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 20;
      width: 320px;
      max-height: calc(100dvh - 30px);
      overflow-y: auto;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      display: none;
      animation: slideIn 0.25s ease-out;
    }
    @keyframes slideIn {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    #info-card h2 {
      font-size: 20px;
      color: #38bdf8;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .close-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 22px;
      padding: 4px 8px;
      cursor: pointer;
    }

    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .action-btn {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid #38bdf8;
      color: #38bdf8;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .reset-cam-btn {
      background: rgba(244, 63, 94, 0.15);
      border-color: #f43f5e;
      color: #f43f5e;
    }

    .info-item {
      margin-bottom: 6px;
      font-size: 12px;
      line-height: 1.4;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 4px;
    }
    .info-label { color: #94a3b8; }
    .info-value { font-weight: 600; color: #f8fafc; text-align: right; }
    
    .section-title {
      color: #fbbf24;
      font-size: 12px;
      font-weight: 700;
      margin: 10px 0 4px 0;
      text-transform: uppercase;
    }
    .fun-box {
      background: rgba(251, 191, 36, 0.1);
      border-left: 3px solid #fbbf24;
      padding: 8px;
      border-radius: 4px;
      font-size: 11px;
      line-height: 1.4;
      color: #fef08a;
    }

    .planet-label {
      position: absolute;
      z-index: 5;
      color: #ffffff;
      font-size: 10px;
      font-weight: 600;
      background: rgba(0, 0, 0, 0.7);
      padding: 2px 5px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.2);
      pointer-events: none;
      transform: translate(-50%, -100%);
      white-space: nowrap;
    }

    /* Mobil Ekran Uyum Mantığı */
    @media (max-width: 600px) {
      #info-card {
        top: auto;
        bottom: 10px;
        left: 10px;
        right: 10px;
        width: auto;
        max-height: 50dvh;
      }
      #zoom-controls {
        bottom: 70px;
        right: 15px;
      }
      #ui-container {
        top: 10px;
        left: 10px;
        padding: 8px;
        gap: 6px;
      }
      .btn {
        padding: 6px 10px;
        font-size: 11px;
      }
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- Üst Kontrol Paneli -->
  <div id="ui-container">
    <button id="btn-toggle" class="btn">⏸️ Durdur</button>
    <button id="btn-reset" class="btn" style="background:#475569;">🎥 Sıfırla</button>
    <div class="slider-container">
      <label for="speed-range">Hız:</label>
      <input type="range" id="speed-range" min="0" max="5" step="0.1" value="1">
    </div>
  </div>

  <!-- Dokunmatik Zoom Butonları -->
  <div id="zoom-controls">
    <button class="zoom-btn" id="btn-zoom-in" title="Yakınlaştır">+</button>
    <button class="zoom-btn" id="btn-zoom-out" title="Uzaklaştır">−</button>
  </div>

  <!-- Bilgi Kartı Panel -->
  <div id="info-card">
    <h2>
      <span id="card-title">Gezegen</span>
      <button class="close-btn" id="btn-close-card">✕</button>
    </h2>

    <div class="card-actions">
      <button class="action-btn reset-cam-btn" id="btn-back-to-solar">↺ Güneş Sistemine Dön</button>
      <button class="action-btn" id="btn-play-sound">🔊 Gezegen Sesi Dinle</button>
    </div>
    
    <div id="card-stats"></div>
    
    <div class="section-title">🍕 Ne Kadar Büyüklükte?</div>
    <div id="card-comparison" class="fun-box"></div>

    <div class="section-title">🚀 Roketle Varış Süresi</div>
    <div id="card-travel" class="fun-box" style="border-left-color: #38bdf8; background: rgba(56, 189, 248, 0.1); color: #bae6fd;"></div>

    <div class="section-title">💡 İlginç Bilgi</div>
    <div id="card-fact" class="fun-box" style="border-left-color: #4ade80; background: rgba(74, 222, 128, 0.1); color: #bbf7d0;"></div>
  </div>

  <div id="labels-container"></div>

  <script>
    const PLANET_DATA = {
      sun: {
        name: "Güneş",
        diameter: "1.392.700 km",
        distance: "0 km (Merkez)",
        period: "25 Gün",
        moons: "8 Gezegen",
        comparison: "Güneş dev bir plaj topu olsaydı; Dünya onun yanında küçücük bir mercimek tanesi gibi kalırdı!",
        travel: "Işık Güneş'ten Dünya'ya 8 dakikada ulaşır.",
        fact: "Güneş Sistemimizdeki tüm kütlenin %99.8'ini oluşturur. İçine 1.3 milyon tane Dünya sığabilir!",
        freq: 110
      },
      mercury: {
        name: "Merkür",
        diameter: "4.879 km",
        distance: "57.9 Milyon km",
        period: "88 Gün",
        moons: "0",
        comparison: "Neredeyse bizim Ay'ımız kadar küçük! Cebinize sığacak küçük bir bilye gibi düşünebilirsiniz.",
        travel: "En hızlı roketimizle gitmek yaklaşık 3 Ay sürerdi.",
        fact: "Güneş'e en yakın gezegendir ama en sıcak gezegen değildir! Gündüzleri fırın gibi sıcak, geceleri buz gibidir.",
        freq: 480
      },
      venus: {
        name: "Venüs",
        diameter: "12.104 km",
        distance: "108.2 Milyon km",
        period: "225 Gün",
        moons: "0",
        comparison: "Dünya'nın ikiz kardeşi gibidir! İkisi de hemen hemen aynı boyutta iki tenis topu gibidir.",

        fact: "Güneş Sistemi'nin en sıcak gezegenidir (465°C)! Atmosferindeki yoğun gazlar ısıyı içeride hapseder.",
        freq: 400
      },
      earth: {
        name: "Dünya",
        diameter: "12.742 km",
        distance: "149.6 Milyon km",
        period: "365 Gün (1 Yıl)",
        moons: "1 (Ay)",
        comparison: "Güneş ve Dev Gezegenlerle kıyaslandığında mini bir misket boyutundadır.",
        travel: "Zaten buradayız! Evimiz.",
        fact: "Üzerinde yaşam olduğu bilinen tek gök cismidir. Yüzeyinin %71'i sularla kaplıdır.",
        freq: 256
      },
      mars: {
        name: "Mars",
        diameter: "6.779 km",
        distance: "227.9 Milyon km",
        period: "687 Gün",
        moons: "2",
        comparison: "Dünya'nın yarısı kadardır. Bir ceviz büyüklüğünde düşünebilirsiniz.",
        travel: "En hızlı roketimizle gitmek yaklaşık 7 Ay sürerdi.",
        fact: "Toprağındaki demir paslandığı için kırmızı görünür, bu yüzden ona 'Kızıl Gezegen' denir.",
        freq: 320
      },
      jupiter: {
        name: "Jüpiter",
        diameter: "139.820 km",
        distance: "778.5 Milyon km",
        period: "12 Yıl",
        moons: "95",
        comparison: "Dev bir karpuz olsaydı, Dünya yanında bir nohut tanesi kalırdı.",
        travel: "En hızlı roketimizle gitmek yaklaşık 6 Yıl sürerdi.",
        fact: "Güneş Sistemi'nin en büyük gezegenidir! Üzerindeki dev kırmızı leke, Dünya'dan bile büyük bir fırtınadır.",
        freq: 150
      },
      saturn: {
        name: "Satürn",
        diameter: "116.460 km",
        distance: "1.4 Milyar km",
        period: "29.5 Yıl",
        moons: "146",
        comparison: "Devasa bir basketbol topu büyüklüğündedir ve etrafında harika halkaları vardır!",
        travel: "En hızlı roketimizle gitmek yaklaşık 8 Yıl sürerdi.",
        fact: "Buz ve kayalardan oluşan muhteşem halkaları vardır. O kadar hafiftir ki dev bir su havuzuna koysak batmadan yüzerdi!",
        freq: 210
      },
      uranus: {
        name: "Uranüs",
        diameter: "50.724 km",
        distance: "2.9 Milyar km",
        period: "84 Yıl",
        moons: "28",
        comparison: "Dünya'dan 4 kat büyüktür. Bir portakal ile mercimek tanesi arasındaki fark gibidir.",
        travel: "En hızlı roketimizle gitmek yaklaşık 9.5 Yıl sürerdi.",
        fact: "Yan yatmış bir varil gibi yuvarlanarak döner! Güneş Sistemi'nin en soğuk atmosferine sahip gezegenidir.",
        freq: 280
      },
      neptune: {
        name: "Neptün",
        diameter: "49.244 km",
        distance: "4.5 Milyar km",
        period: "165 Yıl",
        moons: "16",
        comparison: "Uranüs ile neredeyse aynı boyuttadır. Mavi renkli dev bir portakal gibidir.",
        travel: "En hızlı roketimizle gitmek yaklaşık 12 Yıl sürerdi.",
        fact: "Güneş'e en uzak gezegendir. Rüzgarları o kadar hızlıdır ki bir jet uçağından bile daha hızlı esebilir!",
        freq: 350
      }
    };

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    const initialCamPos = new THREE.Vector3(0, 70, 140);
    camera.position.copy(initialCamPos);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    const ambientLight = new THREE.AmbientLight(0x333333);
    scene.add(ambientLight);

    const sunLight = new THREE.PointLight(0xffffff, 2, 500);
    scene.add(sunLight);

    function createStars() {
      const geometry = new THREE.BufferGeometry();
      const count = 2000;
      const positions = new Float32Array(count * 3);
      for (let i = 0; i < count * 3; i++) positions[i] = (Math.random() - 0.5) * 600;
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      scene.add(new THREE.Points(geometry, new THREE.PointsMaterial({ color: 0xffffff, size: 0.8, transparent: true, opacity: 0.8 })));
    }
    createStars();

    const sunGeo = new THREE.SphereGeometry(7, 32, 32);
    const sunMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
    const sun = new THREE.Mesh(sunGeo, sunMat);
    sun.userData = { id: 'sun', radius: 7 };
    scene.add(sun);

    const glowGeo = new THREE.SphereGeometry(7.8, 32, 32);
    const glowMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.25 });
    scene.add(new THREE.Mesh(glowGeo, glowMat));

    const planetConfigs = [
      { id: 'mercury', radius: 0.8, distance: 12, speed: 0.04, color: 0xa6a6a6 },
      { id: 'venus', radius: 1.4, distance: 18, speed: 0.015, color: 0xe3bb76 },
      { id: 'earth', radius: 1.5, distance: 26, speed: 0.01, color: 0x2277ff, hasMoon: true },
      { id: 'mars', radius: 1.0, distance: 34, speed: 0.008, color: 0xcc4400 },
      { id: 'jupiter', radius: 3.8, distance: 50, speed: 0.002, color: 0xd8ca9d },
      { id: 'saturn', radius: 3.0, distance: 66, speed: 0.0009, color: 0xead6b8, hasRings: true },
      { id: 'uranus', radius: 2.2, distance: 80, speed: 0.0004, color: 0x4b70dd, hasRings: true },
      { id: 'neptune', radius: 2.1, distance: 94, speed: 0.0001, color: 0x274687 }
    ];

    const planets = [];
    const labelsContainer = document.getElementById('labels-container');

    planetConfigs.forEach(cfg => {
      const orbitGeo = new THREE.RingGeometry(cfg.distance - 0.1, cfg.distance + 0.1, 64);
      const orbitMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.12 });
      const orbit = new THREE.Mesh(orbitGeo, orbitMat);
      orbit.rotation.x = Math.PI / 2;
      scene.add(orbit);

      const geo = new THREE.SphereGeometry(cfg.radius, 32, 32);
      const mat = new THREE.MeshStandardMaterial({ color: cfg.color, roughness: 0.7, metalness: 0.1 });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.userData = { id: cfg.id, radius: cfg.radius };

      const pivot = new THREE.Group();
      scene.add(pivot);
      pivot.add(mesh);
      mesh.position.x = cfg.distance;

      if (cfg.hasRings) {
        const ringGeo = new THREE.RingGeometry(cfg.radius * 1.4, cfg.radius * 2.3, 32);
        const ringMat = new THREE.MeshBasicMaterial({ 
          color: cfg.id === 'saturn' ? 0xc2b193 : 0x6888c4, 
          side: THREE.DoubleSide, 
          transparent: true, 
          opacity: 0.6 
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        mesh.add(ring);
      }

      let moonMesh = null;
      if (cfg.hasMoon) {
        const moonGeo = new THREE.SphereGeometry(0.4, 16, 16);
        const moonMat = new THREE.MeshStandardMaterial({ color: 0xcccccc });
        moonMesh = new THREE.Mesh(moonGeo, moonMat);
        mesh.add(moonMesh);
      }

      const labelEl = document.createElement('div');
      labelEl.className = 'planet-label';
      labelEl.innerText = PLANET_DATA[cfg.id].name;
      labelsContainer.appendChild(labelEl);

      planets.push({ ...cfg, mesh, pivot, moonMesh, labelEl, angle: Math.random() * Math.PI * 2 });
    });

    let isRunning = true;
    let speedMultiplier = 1;
    let selectedObject = null;
    let targetCameraPos = null;

    function animate() {
      requestAnimationFrame(animate);

      if (isRunning) {
        sun.rotation.y += 0.002 * speedMultiplier;

        planets.forEach(p => {
          p.angle -= p.speed * speedMultiplier;
          p.mesh.position.x = Math.cos(p.angle) * p.distance;
          p.mesh.position.z = Math.sin(p.angle) * p.distance;
          p.mesh.rotation.y += 0.01 * speedMultiplier;

          if (p.moonMesh) {
            const moonSpeed = p.angle * 12;
            p.moonMesh.position.x = Math.cos(moonSpeed) * 3;
            p.moonMesh.position.z = Math.sin(moonSpeed) * 3;
          }
        });
      }

      planets.forEach(p => {
        const tempV = new THREE.Vector3();
        p.mesh.getWorldPosition(tempV);
        tempV.project(camera);
        const x = (tempV.x * .5 + .5) * window.innerWidth;
        const y = (tempV.y * -.5 + .5) * window.innerHeight;
        if (tempV.z < 1) {
          p.labelEl.style.transform = `translate(-50%, -100%) translate(${x}px,${y}px)`;
          p.labelEl.style.opacity = '1';
        } else {
          p.labelEl.style.opacity = '0';
        }
      });

      if (selectedObject) {
        const targetPos = new THREE.Vector3();
        selectedObject.getWorldPosition(targetPos);
        controls.target.lerp(targetPos, 0.08);

        const radius = selectedObject.userData.radius || 2;
        const offset = new THREE.Vector3().subVectors(camera.position, controls.target).normalize().multiplyScalar(radius * 4.5);
        const desiredCamPos = new THREE.Vector3().addVectors(targetPos, offset);
        camera.position.lerp(desiredCamPos, 0.08);
      } else if (targetCameraPos) {
        camera.position.lerp(targetCameraPos, 0.05);
        controls.target.lerp(new THREE.Vector3(0,0,0), 0.05);
        if (camera.position.distanceTo(targetCameraPos) < 1) targetCameraPos = null;
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // MOBİL İÇİN DÜZELTİLMİŞ SES MOTORU
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playPlanetSound(freq) {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.0);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 1.0);
      } catch (e) {
        console.log("Ses hatası:", e);
      }
    }

    // ÇOKLU CİHAZ (DOKUNMA VE TIKLAMA) HESAPLAMA
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    let touchStartTime = 0;
    let touchStartX = 0;
    let touchStartY = 0;

    function handlePointerSelect(clientX, clientY) {
      mouse.x = (clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const objectsToTest = [sun, ...planets.map(p => p.mesh)];
      const intersects = raycaster.intersectObjects(objectsToTest);

      if (intersects.length > 0) {
        const hit = intersects[0].object;
        openInfoCard(hit.userData.id, hit);
      }
    }

    window.addEventListener('touchstart', (e) => {
      initAudio(); // Mobil cihazda ses iznini ilk dokunuşta aktifleştir
      if (e.touches.length === 1) {
        touchStartTime = Date.now();
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (e.changedTouches.length === 1) {
        const touchEndTime = Date.now();
        const touchEndX = e.changedTouches[0].clientX;
        const touchEndY = e.changedTouches[0].clientY;

        const distance = Math.hypot(touchEndX - touchStartX, touchEndY - touchStartY);
        const duration = touchEndTime - touchStartTime;

        // Ekranı kaydırma değil, kısa bir dokunmaysa seçimi tetikle
        if (distance < 10 && duration < 300) {
          const target = document.elementFromPoint(touchEndX, touchEndY);
          if (target && (target.closest('#ui-container') || target.closest('#info-card') || target.closest('#zoom-controls'))) return;
          handlePointerSelect(touchEndX, touchEndY);
        }
      }
    });

    window.addEventListener('click', (e) => {
      if (e.target.closest('#ui-container') || e.target.closest('#info-card') || e.target.closest('#zoom-controls')) return;
      handlePointerSelect(e.clientX, e.clientY);
    });

    const infoCard = document.getElementById('info-card');
    let currentAudioFreq = 200;

    function openInfoCard(id, meshObj) {
      const data = PLANET_DATA[id];
      if (!data) return;

      selectedObject = meshObj;
      targetCameraPos = null;
      currentAudioFreq = data.freq;

      document.getElementById('card-title').innerText = data.name;
      document.getElementById('card-stats').innerHTML = `
        <div class="info-item"><span class="info-label">Çap:</span><span class="info-value">${data.diameter}</span></div>
        <div class="info-item"><span class="info-label">Güneş'e Uzaklık:</span><span class="info-value">${data.distance}</span></div>
        <div class="info-item"><span class="info-label">Dolanma Süresi:</span><span class="info-value">${data.period}</span></div>
        <div class="info-item"><span class="info-label">Uydu Sayısı:</span><span class="info-value">${data.moons}</span></div>
      `;
      document.getElementById('card-comparison').innerText = data.comparison;
      document.getElementById('card-travel').innerText = data.travel;
      document.getElementById('card-fact').innerText = data.fact;

      infoCard.style.display = 'block';
      playPlanetSound(currentAudioFreq);
    }

    function resetToSystemView() {
      infoCard.style.display = 'none';
      selectedObject = null;
      targetCameraPos = initialCamPos.clone();
    }

    document.getElementById('btn-close-card').addEventListener('click', resetToSystemView);
    document.getElementById('btn-back-to-solar').addEventListener('click', resetToSystemView);
    document.getElementById('btn-reset').addEventListener('click', resetToSystemView);

    document.getElementById('btn-play-sound').addEventListener('click', () => {
      playPlanetSound(currentAudioFreq);
    });

    const btnToggle = document.getElementById('btn-toggle');
    btnToggle.addEventListener('click', () => {
      isRunning = !isRunning;
      btnToggle.innerText = isRunning ? "⏸️ Durdur" : "▶️ Başlat";
    });

    document.getElementById('speed-range').addEventListener('input', (e) => {
      speedMultiplier = parseFloat(e.target.value);
    });

    document.getElementById('btn-zoom-in').addEventListener('click', () => {
      camera.position.multiplyScalar(0.85);
    });

    document.getElementById('btn-zoom-out').addEventListener('click', () => {
      camera.position.multiplyScalar(1.15);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>

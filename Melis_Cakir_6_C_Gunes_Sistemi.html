<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>3B Etkileşimli Güneş Sistemi - 6. Sınıf Fen Bilimleri</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; color: #fff; }
  #canvas-container { width: 100vw; height: 100vh; }
  canvas { display: block; }

  #controls {
    position: absolute; top: 12px; left: 12px; z-index: 10;
    background: rgba(0,20,40,0.85); padding: 12px 16px; border-radius: 12px;
    border: 1px solid #3a7ca5; backdrop-filter: blur(8px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    display: none;
  }
  #controls button {
    background: #1e88e5; color: white; border: none; padding: 8px 16px;
    border-radius: 8px; cursor: pointer; font-size: 14px; margin-right: 8px;
    transition: background 0.2s;
  }
  #controls button:hover { background: #1565c0; }
  #controls button.paused { background: #e53935; }
  #controls label { font-size: 13px; margin-right: 6px; }
  #speedSlider { width: 120px; vertical-align: middle; }

  #infoPanel {
    position: absolute; top: 12px; right: 12px; width: 280px;
    background: rgba(0,20,40,0.92); padding: 16px; border-radius: 12px;
    border: 1px solid #3a7ca5; backdrop-filter: blur(10px);
    box-shadow: 0 4px 25px rgba(0,0,0,0.6);
    display: none; max-height: 80vh; overflow-y: auto;
  }
  #infoPanel h2 { color: #64b5f6; margin-bottom: 10px; font-size: 20px; }
  #infoPanel p { margin: 6px 0; font-size: 14px; line-height: 1.4; }
  #infoPanel .close-btn {
    position: absolute; top: 8px; right: 12px; background: none;
    border: none; color: #aaa; font-size: 22px; cursor: pointer;
  }
  #infoPanel .close-btn:hover { color: #fff; }

  #title {
    position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(0,20,40,0.8); padding: 8px 20px; border-radius: 20px;
    font-size: 14px; border: 1px solid #3a7ca5; pointer-events: none;
    display: none;
  }

  #loading {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-size: 18px; color: #64b5f6; z-index: 20; text-align: center;
    max-width: 90%;
  }
  #loading .error { color: #ff6b6b; margin-top: 12px; font-size: 15px; line-height: 1.5; }
</style>
</head>
<body>
<div id="loading">
  Güneş Sistemi yükleniyor...<br>
  <span style="font-size:13px;opacity:0.7;">İnternet bağlantısı gereklidir</span>
</div>
<div id="canvas-container"></div>

<div id="controls">
  <button id="playPauseBtn">⏸ Durdur</button>
  <label>Hız:</label>
  <input type="range" id="speedSlider" min="0.1" max="5" step="0.1" value="1">
  <span id="speedValue">1x</span>
</div>

<div id="infoPanel">
  <button class="close-btn" onclick="document.getElementById('infoPanel').style.display='none'">×</button>
  <h2 id="infoTitle">Gezegen</h2>
  <div id="infoContent"></div>
</div>

<div id="title">🌟 3B Güneş Sistemi Modeli • Fare ile döndür / yakınlaştır • Gezegene tıkla</div>

<!-- Daha güvenilir CDN'ler -->
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
// Yükleme kontrolü
function showError(msg) {
  const loading = document.getElementById('loading');
  loading.innerHTML = 'Güneş Sistemi yüklenemedi<br><div class="error">' + msg + '</div>';
}

// Three.js yüklenmiş mi kontrol et
if (typeof THREE === 'undefined') {
  showError('Three.js kütüphanesi yüklenemedi.<br>Lütfen internet bağlantınızı kontrol edin ve sayfayı yenileyin (F5).');
} else {
  // OrbitControls kontrolü
  if (typeof THREE.OrbitControls === 'undefined') {
    showError('Kontroller yüklenemedi.<br>İnternet bağlantınızı kontrol edip sayfayı yenileyin.');
  } else {
    startSolarSystem();
  }
}

function startSolarSystem() {
  // ==================== VERİLER (Türkçe) ====================
  const PLANETS = [
    {
      name: "Merkür",
      radius: 0.38,
      distance: 12,
      speed: 4.15,
      color: 0xb5b5b5,
      diameter: "4.879 km",
      distSun: "57,9 milyon km",
      period: "88 Dünya günü",
      moons: 0,
      info: "Güneş'e en yakın ve en küçük gezegen. Atmosferi yok denecek kadar azdır. Yüzeyi kraterlerle kaplıdır."
    },
    {
      name: "Venüs",
      radius: 0.95,
      distance: 18,
      speed: 1.62,
      color: 0xe6c35c,
      diameter: "12.104 km",
      distSun: "108,2 milyon km",
      period: "225 Dünya günü",
      moons: 0,
      info: "Güneş Sistemi'nin en sıcak gezegeni. Kalın karbon dioksit atmosferi sera etkisi yaratır. Ters yönde döner."
    },
    {
      name: "Dünya",
      radius: 1.0,
      distance: 25,
      speed: 1.0,
      color: 0x2a6fdb,
      diameter: "12.742 km",
      distSun: "149,6 milyon km",
      period: "365,25 Dünya günü",
      moons: 1,
      info: "Yaşam barındıran tek gezegen. Yüzeyinin %71'i su ile kaplıdır. Atmosferi azot ve oksijenden oluşur."
    },
    {
      name: "Mars",
      radius: 0.53,
      distance: 34,
      speed: 0.53,
      color: 0xc1440e,
      diameter: "6.779 km",
      distSun: "227,9 milyon km",
      period: "687 Dünya günü",
      moons: 2,
      info: "Kızıl Gezegen. Demir oksit nedeniyle kırmızı görünür. Buzulları ve eski nehir yatakları vardır. 2 uydusu: Phobos ve Deimos."
    },
    {
      name: "Jüpiter",
      radius: 3.5,
      distance: 55,
      speed: 0.084,
      color: 0xd8a35d,
      diameter: "139.820 km",
      distSun: "778,5 milyon km",
      period: "11,9 Dünya yılı",
      moons: 95,
      info: "Güneş Sistemi'nin en büyük gezegeni. Gaz devi. Büyük Kırmızı Leke adlı fırtınası ünlüdür. Birçok uydusu vardır."
    },
    {
      name: "Satürn",
      radius: 2.9,
      distance: 75,
      speed: 0.034,
      color: 0xf0d9a0,
      diameter: "116.460 km",
      distSun: "1.434 milyon km",
      period: "29,5 Dünya yılı",
      moons: 146,
      info: "Halkalarıyla ünlü gaz devi. Halkaları buz ve kayalardan oluşur. Güneş Sistemi'nde en çok uyduya sahip gezegendir."
    },
    {
      name: "Uranüs",
      radius: 1.8,
      distance: 95,
      speed: 0.012,
      color: 0x7ec8e3,
      diameter: "50.724 km",
      distSun: "2.871 milyon km",
      period: "84 Dünya yılı",
      moons: 28,
      info: "Buz devi. Yan yatarak döner (eksen eğikliği 98°). Metan nedeniyle mavi-yeşil görünür."
    },
    {
      name: "Neptün",
      radius: 1.7,
      distance: 115,
      speed: 0.006,
      color: 0x3d5afe,
      diameter: "49.244 km",
      distSun: "4.495 milyon km",
      period: "165 Dünya yılı",
      moons: 16,
      info: "Güneş'e en uzak gezegen. En rüzgarlı gezegendir (saatte 2000 km). Buz devi, koyu mavi renktedir."
    }
  ];

  const SUN_LAYERS = [
    { name: "Çekirdek", desc: "Güneş'in merkezi. Sıcaklık yaklaşık 15 milyon °C. Nükleer füzyon burada gerçekleşir." },
    { name: "Işınım Bölgesi", desc: "Enerji fotonlar halinde dışarıya taşınır. Bu katman çok yoğundur." },
    { name: "Konveksiyon Bölgesi", desc: "Sıcak gaz yükselir, soğuk gaz alçalır. Enerji bu şekilde yüzeye ulaşır." },
    { name: "Fotosfer", desc: "Güneş'in görünen yüzeyi. Sıcaklık yaklaşık 5500 °C. Güneş lekeleri burada görülür." },
    { name: "Kromosfer", desc: "Fotosferin hemen üstündeki kırmızımsı katman. Güneş tutulumunda görünür." },
    { name: "Korona", desc: "Güneş'in en dış atmosferi. Sıcaklık 1-2 milyon °C. Güneş rüzgârı buradan çıkar." }
  ];

  // ==================== SAHNE KURULUMU ====================
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000008);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
  camera.position.set(0, 40, 90);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  // Işıklar
  const ambientLight = new THREE.AmbientLight(0x333333);
  scene.add(ambientLight);

  const sunLight = new THREE.PointLight(0xffffff, 2.5, 500);
  scene.add(sunLight);

  // OrbitControls
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.minDistance = 15;
  controls.maxDistance = 300;
  controls.enablePan = true;

  // ==================== YILDIZLAR ====================
  function createStars() {
    const geometry = new THREE.BufferGeometry();
    const count = 4000;
    const positions = new Float32Array(count * 3);
    for (let i = 0; i < count * 3; i++) {
      positions[i] = (Math.random() - 0.5) * 1200;
    }
    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const material = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 0.8,
      sizeAttenuation: true,
      transparent: true,
      opacity: 0.85
    });
    const stars = new THREE.Points(geometry, material);
    scene.add(stars);
    return stars;
  }
  const stars = createStars();

  // ==================== GÜNEŞ ====================
  const sunGroup = new THREE.Group();
  scene.add(sunGroup);

  const sunGeometry = new THREE.SphereGeometry(6, 64, 64);
  const sunMaterial = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
  const sun = new THREE.Mesh(sunGeometry, sunMaterial);
  sun.name = "Güneş";
  sunGroup.add(sun);

  // Güneş ışıması
  const glowGeometry = new THREE.SphereGeometry(7.5, 32, 32);
  const glowMaterial = new THREE.MeshBasicMaterial({
    color: 0xffaa00,
    transparent: true,
    opacity: 0.25,
    side: THREE.BackSide
  });
  const glow = new THREE.Mesh(glowGeometry, glowMaterial);
  sunGroup.add(glow);

  const coronaGeometry = new THREE.SphereGeometry(9, 32, 32);
  const coronaMaterial = new THREE.MeshBasicMaterial({
    color: 0xff8800,
    transparent: true,
    opacity: 0.12,
    side: THREE.BackSide
  });
  const corona = new THREE.Mesh(coronaGeometry, coronaMaterial);
  sunGroup.add(corona);

  // ==================== GEZEGENLER ====================
  const planetMeshes = [];
  const planetGroups = [];

  PLANETS.forEach((p) => {
    const group = new THREE.Group();
    scene.add(group);
    planetGroups.push(group);

    const geometry = new THREE.SphereGeometry(p.radius, 32, 32);
    const material = new THREE.MeshStandardMaterial({
      color: p.color,
      roughness: 0.7,
      metalness: 0.1
    });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.x = p.distance;
    mesh.name = p.name;
    mesh.userData = p;
    group.add(mesh);
    planetMeshes.push(mesh);

    // Yörünge çizgisi
    const orbitGeo = new THREE.BufferGeometry();
    const orbitPoints = [];
    for (let i = 0; i <= 128; i++) {
      const angle = (i / 128) * Math.PI * 2;
      orbitPoints.push(new THREE.Vector3(Math.cos(angle) * p.distance, 0, Math.sin(angle) * p.distance));
    }
    orbitGeo.setFromPoints(orbitPoints);
    const orbitMat = new THREE.LineBasicMaterial({ color: 0x444466, transparent: true, opacity: 0.4 });
    const orbit = new THREE.Line(orbitGeo, orbitMat);
    scene.add(orbit);

    // Satürn halkaları
    if (p.name === "Satürn") {
      const ringGeo = new THREE.RingGeometry(p.radius * 1.4, p.radius * 2.3, 64);
      const ringMat = new THREE.MeshBasicMaterial({
        color: 0xc9b18a,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.75
      });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = Math.PI / 2.2;
      mesh.add(ring);
    }

    // Dünya'nın Ay'ı
    if (p.name === "Dünya") {
      const moonGeo = new THREE.SphereGeometry(0.27, 16, 16);
      const moonMat = new THREE.MeshStandardMaterial({ color: 0xcccccc });
      const moon = new THREE.Mesh(moonGeo, moonMat);
      moon.position.x = 2.2;
      moon.name = "Ay";
      mesh.add(moon);
      mesh.userData.moon = moon;
    }
  });

  // ==================== ASTEROİT KUŞAĞI ====================
  function createAsteroidBelt() {
    const count = 800;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);

    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 42 + Math.random() * 10;
      const y = (Math.random() - 0.5) * 2.5;

      positions[i * 3] = Math.cos(angle) * radius;
      positions[i * 3 + 1] = y;
      positions[i * 3 + 2] = Math.sin(angle) * radius;

      const gray = 0.4 + Math.random() * 0.3;
      colors[i * 3] = gray;
      colors[i * 3 + 1] = gray * 0.9;
      colors[i * 3 + 2] = gray * 0.8;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
      size: 0.35,
      vertexColors: true,
      transparent: true,
      opacity: 0.9
    });
    const belt = new THREE.Points(geometry, material);
    scene.add(belt);
    return belt;
  }
  createAsteroidBelt();

  // ==================== TÜRK UYDUSU (TÜRKSAT) ====================
  const turksatGroup = new THREE.Group();
  const turksatGeo = new THREE.BoxGeometry(0.15, 0.08, 0.25);
  const turksatMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x2244aa, emissiveIntensity: 0.4 });
  const turksat = new THREE.Mesh(turksatGeo, turksatMat);
  turksat.position.x = 3.5;
  turksat.name = "TÜRKSAT";
  turksatGroup.add(turksat);

  const panelGeo = new THREE.BoxGeometry(0.6, 0.02, 0.15);
  const panelMat = new THREE.MeshStandardMaterial({ color: 0x1133aa });
  const panel1 = new THREE.Mesh(panelGeo, panelMat);
  panel1.position.x = 0.4;
  turksat.add(panel1);
  const panel2 = new THREE.Mesh(panelGeo, panelMat);
  panel2.position.x = -0.4;
  turksat.add(panel2);

  planetGroups[2].add(turksatGroup);
  turksatGroup.position.x = 25;

  // ==================== TIKLAMA ====================
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();

  function onPointerDown(event) {
    const clientX = event.clientX || (event.touches && event.touches[0].clientX);
    const clientY = event.clientY || (event.touches && event.touches[0].clientY);
    if (clientX === undefined) return;

    mouse.x = (clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);

    const objects = [sun, ...planetMeshes];
    planetMeshes.forEach(m => {
      if (m.userData.moon) objects.push(m.userData.moon);
    });
    objects.push(turksat);

    const intersects = raycaster.intersectObjects(objects, true);

    if (intersects.length > 0) {
      let obj = intersects[0].object;
      while (obj && !obj.name) obj = obj.parent;
      if (!obj) return;
      showInfo(obj);
    }
  }

  function showInfo(obj) {
    const panel = document.getElementById('infoPanel');
    const title = document.getElementById('infoTitle');
    const content = document.getElementById('infoContent');

    if (obj.name === "Güneş") {
      title.textContent = "☀ Güneş";
      let html = `<p><strong>Tür:</strong> Sarı cüce yıldız (G2V)</p>
                  <p><strong>Çap:</strong> 1.392.000 km (Dünya'nın 109 katı)</p>
                  <p><strong>Sıcaklık (yüzey):</strong> ~5.500 °C</p>
                  <p><strong>Yaş:</strong> ~4,6 milyar yıl</p>
                  <hr style="border-color:#3a7ca5; margin:10px 0;">
                  <p><strong>Katmanları:</strong></p>`;
      SUN_LAYERS.forEach(l => {
        html += `<p style="margin:4px 0;"><strong>${l.name}:</strong> ${l.desc}</p>`;
      });
      content.innerHTML = html;
    } else if (obj.name === "Ay") {
      title.textContent = "🌙 Ay";
      content.innerHTML = `
        <p><strong>Dünya'nın doğal uydusu</strong></p>
        <p><strong>Çap:</strong> 3.474 km</p>
        <p><strong>Dünya'ya uzaklık:</strong> ~384.400 km</p>
        <p><strong>Dolanma süresi:</strong> 27,3 gün</p>
        <p>Dünya'nın tek doğal uydusudur. Gelgit olaylarına neden olur.</p>
      `;
    } else if (obj.name === "TÜRKSAT") {
      title.textContent = "🛰️ TÜRKSAT";
      content.innerHTML = `
        <p><strong>Türkiye'nin haberleşme uydusu</strong></p>
        <p>TÜRKSAT uyduları, televizyon yayınları, internet ve haberleşme hizmetleri sağlar.</p>
        <p>Dünya etrafında yer sabit yörüngede bulunur.</p>
        <p>Türkiye'nin uzay teknolojisindeki önemli başarılarından biridir.</p>
      `;
    } else {
      const data = obj.userData;
      title.textContent = "🪐 " + data.name;
      content.innerHTML = `
        <p><strong>Çap:</strong> ${data.diameter}</p>
        <p><strong>Güneş'e uzaklık:</strong> ${data.distSun}</p>
        <p><strong>Dolanma süresi:</strong> ${data.period}</p>
        <p><strong>Uydu sayısı:</strong> ${data.moons}</p>
        <hr style="border-color:#3a7ca5; margin:10px 0;">
        <p>${data.info}</p>
      `;
    }
    panel.style.display = 'block';
  }

  window.addEventListener('pointerdown', onPointerDown);

  // ==================== KONTROLLER ====================
  let isPlaying = true;
  let speedMultiplier = 1;

  document.getElementById('playPauseBtn').addEventListener('click', function() {
    isPlaying = !isPlaying;
    this.textContent = isPlaying ? '⏸ Durdur' : '▶ Başlat';
    this.classList.toggle('paused', !isPlaying);
  });

  document.getElementById('speedSlider').addEventListener('input', function() {
    speedMultiplier = parseFloat(this.value);
    document.getElementById('speedValue').textContent = speedMultiplier.toFixed(1) + 'x';
  });

  // ==================== ANİMASYON ====================
  let time = 0;
  function animate() {
    requestAnimationFrame(animate);

    if (isPlaying) {
      time += 0.008 * speedMultiplier;

      planetGroups.forEach((group, i) => {
        const p = PLANETS[i];
        group.rotation.y = time * p.speed;
      });

      planetMeshes.forEach((mesh, i) => {
        mesh.rotation.y += 0.01 * speedMultiplier * (i < 4 ? 1 : 0.5);
      });

      const earth = planetMeshes[2];
      if (earth.userData.moon) {
        earth.userData.moon.position.x = Math.cos(time * 8) * 2.2;
        earth.userData.moon.position.z = Math.sin(time * 8) * 2.2;
      }

      turksatGroup.rotation.y = time * 0.8;
      sun.rotation.y += 0.002 * speedMultiplier;
      stars.rotation.y += 0.00015 * speedMultiplier;
    }

    controls.update();
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // Başarılı yükleme
  document.getElementById('loading').style.display = 'none';
  document.getElementById('controls').style.display = 'block';
  document.getElementById('title').style.display = 'block';
  animate();
}
</script>
</body>
</html>

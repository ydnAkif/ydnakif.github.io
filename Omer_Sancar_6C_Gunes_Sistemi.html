<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Güneş Sistemi - 3D Model</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 100vw; height: 100vh; overflow: hidden; background: #000; font-family: Arial, sans-serif; color: #fff; }
  #canvas-container { width: 100%; height: 100%; }

  /* Kontrol Paneli */
  #controls {
    position: fixed; left: 18px; top: 18px;
    width: min(320px, calc(100vw - 36px));
    background: rgba(7, 12, 28, 0.85); backdrop-filter: blur(10px);
    border: 1px solid rgba(150, 180, 255, 0.25); border-radius: 18px;
    padding: 16px; z-index: 20; box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }
  h1 { font-size: 18px; margin-bottom: 4px; }
  .sub { font-size: 12px; color: #aebbd8; margin-bottom: 12px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  button { border: 0; border-radius: 8px; padding: 8px 12px; background: #1b2b55; color: #fff; cursor: pointer; transition: 0.2s; }
  button:hover { background: #294174; }
  #hint { font-size: 11px; color: #9eacd0; margin-top: 8px; line-height: 1.4; }

  /* Bilgi Kutusu */
  #info {
    position: fixed; right: 18px; top: 18px;
    width: min(300px, calc(100vw - 36px));
    background: rgba(7, 12, 28, 0.92); backdrop-filter: blur(10px);
    border: 1px solid rgba(150, 180, 255, 0.35); border-radius: 18px;
    padding: 16px; z-index: 20; display: none; box-shadow: 0 12px 40px rgba(0,0,0,0.6);
  }
  #info h2 { margin-bottom: 8px; font-size: 20px; color: #ffd21c; }
  #info p { font-size: 13px; color: #d5ddf2; line-height: 1.5; margin-bottom: 6px; }
  #info .close { float: right; background: transparent; font-size: 18px; padding: 0 4px; border: none; color: #fff; cursor: pointer; }

  #title-bar {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    z-index: 10; background: rgba(3,7,18,0.7); padding: 8px 16px;
    border-radius: 20px; font-size: 12px; color: #aebbd8; border: 1px solid rgba(150,180,255,0.15);
    pointer-events: none;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="canvas-container"></div>

<div id="controls">
  <h1>☀️ 3D Güneş Sistemi</h1>
  <div class="sub">Saat Yönünün Tersi Dönen Gezegenler & Asteroit Kuşağı</div>
  <div class="row">
    <button id="toggleBtn">⏸ Durdur</button>
    <button id="slowerBtn">− Yavaşlat</button>
    <button id="fasterBtn">+ Hızlandır</button>
  </div>
  <div id="hint">Gezegenlerin üzerine tıklayarak bilgi alabilirsiniz. Ekranı fare ile sürükleyerek döndürebilirsiniz.</div>
</div>

<div id="info">
  <button class="close" onclick="closeInfo()">✕</button>
  <h2 id="infoName"></h2>
  <div id="infoText"></div>
</div>

<div id="title-bar">3B Küre Modeller • Asteroit Kuşağı • Kayan Yıldızlar • Saat Yönünün Tersi Dönüş</div>

<script>
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.0005);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.set(0, 150, 300);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;

// Işıklandırma
const sunLight = new THREE.PointLight(0xffffff, 2, 1000);
scene.add(sunLight);
const ambientLight = new THREE.AmbientLight(0x444444);
scene.add(ambientLight);

// Arka Plan Yıldızları
const starGeometry = new THREE.BufferGeometry();
const starCount = 3000;
const starPositions = new Float32Array(starCount * 3);
for(let i = 0; i < starCount * 3; i++) {
  starPositions[i] = (Math.random() - 0.5) * 1500;
}
starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 1 });
const starField = new THREE.Points(starGeometry, starMaterial);
scene.add(starField);

// Güneş
const sunGeo = new THREE.SphereGeometry(16, 32, 32);
const sunMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
const sun = new THREE.Mesh(sunGeo, sunMat);
scene.add(sun);

// Gezegen Verileri
const planetData = [
  { name: "Merkür", radius: 1.8, distance: 28, speed: 0.03, color: 0xaaaaaa, info: "Güneş'e en yakın gezegendir. Yüzeyi kraterlerle doludur.", period: "88 gün", moons: "0" },
  { name: "Venüs", radius: 3.2, distance: 42, speed: 0.02, color: 0xe3bb76, info: "Sera etkisi nedeniyle Güneş Sistemi'nin en sıcak gezegenidir.", period: "224.7 gün", moons: "0" },
  { name: "Dünya", radius: 3.5, distance: 58, speed: 0.015, color: 0x2b82c5, hasMoon: true, info: "Yaşam olduğu bilinen tek gezegendir.", period: "365.25 gün", moons: "1" },
  { name: "Mars", radius: 2.2, distance: 74, speed: 0.012, color: 0xc1440e, info: "Kızıl Gezegen olarak bilinir.", period: "687 gün", moons: "2" },
  { name: "Jüpiter", radius: 9.0, distance: 120, speed: 0.007, color: 0xb07f35, info: "Güneş Sistemi'nin en büyük gezegenidir.", period: "11.86 yıl", moons: "95+" },
  { name: "Satürn", radius: 7.5, distance: 155, speed: 0.005, color: 0xe2bf7d, hasRings: true, info: "Görkemli halka sistemiyle tanınır.", period: "29.45 yıl", moons: "140+" },
  { name: "Uranüs", radius: 5.5, distance: 190, speed: 0.003, color: 0x4b70dd, info: "Yana yatmış ekseniyle turlayan buz devidir.", period: "84 yıl", moons: "28" },
  { name: "Neptün", radius: 5.2, distance: 220, speed: 0.002, color: 0x274687, info: "Güneş'e en uzak gezegendir, rüzgarları çok şiddetlidir.", period: "164.8 yıl", moons: "16" }
];

const planets = [];

function createOrbitLine(radius) {
  const points = [];
  for (let i = 0; i <= 128; i++) {
    const theta = (i / 128) * Math.PI * 2;
    points.push(new THREE.Vector3(Math.cos(theta) * radius, 0, Math.sin(theta) * radius));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  const mat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.15 });
  const line = new THREE.Line(geo, mat);
  scene.add(line);
}

planetData.forEach((d) => {
  createOrbitLine(d.distance);

  const pGeo = new THREE.SphereGeometry(d.radius, 32, 32);
  const pMat = new THREE.MeshStandardMaterial({ color: d.color, roughness: 0.7 });
  const mesh = new THREE.Mesh(pGeo, pMat);

  mesh.position.x = d.distance;

  if (d.hasRings) {
    const ringGeo = new THREE.RingGeometry(d.radius * 1.4, d.radius * 2.3, 32);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0xc2a56d, side: THREE.DoubleSide, transparent: true, opacity: 0.7 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2.3;
    mesh.add(ring);
  }

  let moonMesh = null;
  if (d.hasMoon) {
    const mGeo = new THREE.SphereGeometry(0.8, 16, 16);
    const mMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
    moonMesh = new THREE.Mesh(mGeo, mMat);
    mesh.add(moonMesh);
  }

  mesh.userData = d;
  scene.add(mesh);
  planets.push({ mesh, moonMesh, data: d, angle: Math.random() * Math.PI * 2 });
});

// Asteroit Kuşağı (Mars-Jüpiter arası)
const asteroidCount = 1200;
const asteroidGeo = new THREE.DodecahedronGeometry(0.5, 0);
const asteroidMat = new THREE.MeshStandardMaterial({ color: 0x666666, roughness: 0.9 });
const asteroidInstanced = new THREE.InstancedMesh(asteroidGeo, asteroidMat, asteroidCount);

const dummy = new THREE.Object3D();
const asteroidData = [];

for (let i = 0; i < asteroidCount; i++) {
  const radius = THREE.MathUtils.randFloat(86, 106);
  const angle = Math.random() * Math.PI * 2;
  const y = THREE.MathUtils.randFloat(-3, 3);
  const scale = THREE.MathUtils.randFloat(0.6, 1.8);

  dummy.position.set(Math.cos(angle) * radius, y, Math.sin(angle) * radius);
  dummy.scale.set(scale, scale, scale);
  dummy.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
  dummy.updateMatrix();

  asteroidInstanced.setMatrixAt(i, dummy.matrix);
  asteroidData.push({ radius, angle, y, speed: THREE.MathUtils.randFloat(0.008, 0.011), scale });
}
scene.add(asteroidInstanced);

// Kayan Yıldızlar
const shootingStars = [];

function createShootingStar() {
  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(6);
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

  const material = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 1 });
  const line = new THREE.Line(geometry, material);
  
  const startX = THREE.MathUtils.randFloat(-200, 200);
  const startY = THREE.MathUtils.randFloat(100, 250);
  const startZ = THREE.MathUtils.randFloat(-200, 200);

  line.userData = {
    pos: new THREE.Vector3(startX, startY, startZ),
    vel: new THREE.Vector3(THREE.MathUtils.randFloat(-4, -2), THREE.MathUtils.randFloat(-3, -1), THREE.MathUtils.randFloat(-2, 2)),
    length: THREE.MathUtils.randFloat(15, 25),
    life: 0,
    maxLife: THREE.MathUtils.randFloat(40, 70)
  };

  scene.add(line);
  shootingStars.push(line);
}

setInterval(() => {
  if (Math.random() < 0.7) createShootingStar();
}, 1500);

function updateShootingStars() {
  for (let i = shootingStars.length - 1; i >= 0; i--) {
    const star = shootingStars[i];
    const data = star.userData;

    data.life++;
    data.pos.add(data.vel);

    const tailPos = data.pos.clone().sub(data.vel.clone().normalize().multiplyScalar(data.length));
    const positions = star.geometry.attributes.position.array;
    positions[0] = data.pos.x; positions[1] = data.pos.y; positions[2] = data.pos.z;
    positions[3] = tailPos.x; positions[4] = tailPos.y; positions[5] = tailPos.z;
    star.geometry.attributes.position.needsUpdate = true;

    star.material.opacity = 1 - (data.life / data.maxLife);

    if (data.life >= data.maxLife) {
      scene.remove(star);
      star.geometry.dispose();
      star.material.dispose();
      shootingStars.splice(i, 1);
    }
  }
}

// Animasyon Döngüsü
let isRunning = true;
let speedFactor = 1;

function animate() {
  requestAnimationFrame(animate);

  if (isRunning) {
    // Gezegen Dönüşleri (SAAT YÖNÜNÜN TERSİNE)
    planets.forEach((p) => {
      p.angle += p.data.speed * 0.5 * speedFactor;
      p.mesh.position.x = Math.cos(p.angle) * p.data.distance;
      p.mesh.position.z = Math.sin(p.angle) * p.data.distance;
      p.mesh.rotation.y += 0.01 * speedFactor;

      if (p.moonMesh) {
        const moonAngle = Date.now() * 0.003 * speedFactor;
        p.moonMesh.position.x = Math.cos(moonAngle) * 7;
        p.moonMesh.position.z = Math.sin(moonAngle) * 7;
      }
    });

    // Asteroit Dönüşleri (SAAT YÖNÜNÜN TERSİNE)
    for (let i = 0; i < asteroidCount; i++) {
      const ast = asteroidData[i];
      ast.angle += ast.speed * 0.3 * speedFactor;

      dummy.position.set(Math.cos(ast.angle) * ast.radius, ast.y, Math.sin(ast.angle) * ast.radius);
      dummy.scale.set(ast.scale, ast.scale, ast.scale);
      dummy.rotation.y += 0.01;
      dummy.updateMatrix();

      asteroidInstanced.setMatrixAt(i, dummy.matrix);
    }
    asteroidInstanced.instanceMatrix.needsUpdate = true;

    sun.rotation.y += 0.002 * speedFactor;
    updateShootingStars();
  }

  controls.update();
  renderer.render(scene, camera);
}

animate();

// Tıklama ile Bilgi Gösterme
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener('pointerdown', (e) => {
  if(e.target.closest('#controls') || e.target.closest('#info')) return;

  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(planets.map(p => p.mesh));

  if (intersects.length > 0) {
    const data = intersects[0].object.userData;
    showInfo(data);
  }
});

function showInfo(d) {
  document.getElementById("infoName").textContent = d.name;
  document.getElementById("infoText").innerHTML = `
    <p><b>Güneş'e Uzaklık Sırası:</b> ${planetData.indexOf(d) + 1}</p>
    <p><b>Dolanma Süresi:</b> ${d.period}</p>
    <p><b>Uydu Sayısı:</b> ${d.moons}</p>
    <p><b>Açıklama:</b> ${d.info}</p>
  `;
  document.getElementById("info").style.display = "block";
}

function closeInfo() {
  document.getElementById("info").style.display = "none";
}

document.getElementById("toggleBtn").onclick = () => {
  isRunning = !isRunning;
  document.getElementById("toggleBtn").textContent = isRunning ? "⏸ Durdur" : "▶ Başlat";
};
document.getElementById("slowerBtn").onclick = () => speedFactor = Math.max(0.2, speedFactor / 1.5);
document.getElementById("fasterBtn").onclick = () => speedFactor = Math.min(5, speedFactor * 1.5);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3B Güneş Sistemi Modeli</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            color: #fff;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        /* Üst Kontrol Paneli */
        #controls-bar {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            padding: 10px 20px;
            border-radius: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        /* Gezegen Seçim Hızlı Menüsü */
        #planet-nav {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(15, 23, 42, 0.75);
            padding: 8px 15px;
            border-radius: 25px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            max-width: 95vw;
            overflow-x: auto;
        }

        .nav-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 13px;
            transition: 0.2s;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Bilgi Kartı Panel */
        #info-card {
            position: absolute;
            right: 20px;
            top: 20px;
            width: 320px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(59, 130, 246, 0.5);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            display: none;
            z-index: 10;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #info-card h2 {
            margin: 0 0 10px 0;
            color: #60a5fa;
            font-size: 22px;
            border-bottom: 2px solid rgba(96, 165, 250, 0.3);
            padding-bottom: 8px;
        }

        #info-card p {
            margin: 8px 0;
            font-size: 14px;
            line-height: 1.5;
            color: #e2e8f0;
        }

        #info-card .stat-label {
            font-weight: bold;
            color: #93c5fd;
        }

        .close-btn {
            position: absolute;
            top: 12px;
            right: 15px;
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 20px;
            cursor: pointer;
        }

        .close-btn:hover { color: #fff; }

        /* Bilgi İpucu */
        #help-tip {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            color: #cbd5e1;
            pointer-events: none;
            z-index: 5;
        }
    </style>
    <!-- Three.js ve OrbitControls Kütüphaneleri -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="controls-bar">
        <button id="toggle-btn" class="btn">Durdur</button>
        <div class="slider-container">
            <label for="speed-slider">Hız:</label>
            <input type="range" id="speed-slider" min="0" max="3" step="0.1" value="1">
        </div>
        <button id="reset-cam" class="btn" style="background: #475569;">Görünümü Sıfırla</button>
    </div>

    <div id="help-tip">Gezegenlere tıklayarak detaylı bilgi alabilir, fare/dokunma ile uzayı döndürebilirsiniz.</div>

    <div id="planet-nav">
        <button class="nav-btn" onclick="focusObject('Güneş')">Güneş</button>
        <button class="nav-btn" onclick="focusObject('Merkür')">Merkür</button>
        <button class="nav-btn" onclick="focusObject('Venüs')">Venüs</button>
        <button class="nav-btn" onclick="focusObject('Dünya')">Dünya</button>
        <button class="nav-btn" onclick="focusObject('Mars')">Mars</button>
        <button class="nav-btn" onclick="focusObject('Jüpiter')">Jüpiter</button>
        <button class="nav-btn" onclick="focusObject('Satürn')">Satürn</button>
        <button class="nav-btn" onclick="focusObject('Uranüs')">Uranüs</button>
        <button class="nav-btn" onclick="focusObject('Neptün')">Neptün</button>
    </div>

    <div id="info-card">
        <button class="close-btn" onclick="closeInfoCard()">&times;</button>
        <h2 id="card-title">Gezegen Adı</h2>
        <p><span class="stat-label">Çap:</span> <span id="card-diameter">-</span></p>
        <p><span class="stat-label">Güneş'e Uzaklık:</span> <span id="card-distance">-</span></p>
        <p><span class="stat-label">Dolanma Süresi:</span> <span id="card-period">-</span></p>
        <p><span class="stat-label">Uydu Sayısı:</span> <span id="card-moons">-</span></p>
        <p id="card-desc" style="margin-top: 12px; font-style: italic; color: #94a3b8;"></p>
    </div>

    <div id="canvas-container"></div>

    <script>
        // --- 1. VERİ TANIMLAMALARI (TÜRKÇE VE BİLİMSEL DOĞRULUKTA) ---
        const planetData = {
            "Güneş": {
                diameter: "1.392.700 km",
                distance: "0 km (Merkez)",
                period: "-",
                moons: "0 (8 Gezegen yörüngesindedir)",
                desc: "Güneş Sisteminin merkezinde yer alan ısı ve ışık kaynağı orta büyüklükte bir yıldızdır. Katmanları: Çekirdek, Işınım Bölgesi, Bağınım Bölgesi, Renküre ve Taç katmanıdır.",
                color: 0xffaa00,
                radius: 12,
                orbitRadius: 0,
                speed: 0
            },
            "Merkür": {
                diameter: "4.879 km",
                distance: "57.9 milyon km",
                period: "88 gün",
                moons: "0",
                desc: "Güneş'e en yakın ve Güneş sistemindeki en küçük gezegendir. Uydusu ve halkası yoktur.",
                color: 0xa6a6a6,
                radius: 1.2,
                orbitRadius: 22,
                speed: 0.03
            },
            "Venüs": {
                diameter: "12.104 km",
                distance: "108.2 milyon km",
                period: "225 gün",
                moons: "0",
                desc: "Güneş sisteminin en sıcak gezegenidir. Yoğun atmosferi sera etkisi yaratır. Ters yönde döner.",
                color: 0xe3bb76,
                radius: 2.2,
                orbitRadius: 32,
                speed: 0.02
            },
            "Dünya": {
                diameter: "12.742 km",
                distance: "149.6 milyon km",
                period: "365 gün (1 yıl)",
                moons: "1 (Ay)",
                desc: "Üzerinde yaşam olduğu bilinen tek gök cismidir. Yüzeyinin yaklaşık %71'i sularla kaplıdır.",
                color: 0x2b82c5,
                radius: 2.5,
                orbitRadius: 45,
                speed: 0.015
            },
            "Mars": {
                diameter: "6.779 km",
                distance: "227.9 milyon km",
                period: "687 gün",
                moons: "2 (Phobos, Deimos)",
                desc: "Yüzeyindeki demir oksitten dolayı 'Kızıl Gezegen' olarak bilinir. İnce bir atmosferi vardır.",
                color: 0xc84b31,
                radius: 1.6,
                orbitRadius: 58,
                speed: 0.012
            },
            "Jüpiter": {
                diameter: "139.822 km",
                distance: "778.5 milyon km",
                period: "12 yıl",
                moons: "95",
                desc: "Güneş sisteminin en büyük gezegenidir. Gaz devidir ve devasa Büyük Kırmızı Leke adında fırtınaya sahiptir.",
                color: 0xd0a98f,
                radius: 6.0,
                orbitRadius: 80,
                speed: 0.007
            },
            "Satürn": {
                diameter: "116.460 km",
                distance: "1.4 milyar km",
                period: "29.5 yıl",
                moons: "146",
                desc: "Buz ve kayalardan oluşan muhteşem ve belirgin halka sistemiyle tanınan dev gaz gezegenidir.",
                color: 0xead6b8,
                radius: 4.8,
                orbitRadius: 105,
                speed: 0.005
            },
            "Uranüs": {
                diameter: "50.724 km",
                distance: "2.9 milyar km",
                period: "84 yıl",
                moons: "28",
                desc: "Yörüngesinde yatay olarak (varil gibi) dönen buz devidir. Mavi-yeşil rengini amonyak ve metandan alır.",
                color: 0x82cae0,
                radius: 3.5,
                orbitRadius: 128,
                speed: 0.003
            },
            "Neptün": {
                diameter: "49.244 km",
                distance: "4.5 milyar km",
                period: "165 yıl",
                moons: "16",
                desc: "Güneş'e en uzak gezegendir. Derin mavi rengi ve Güneş sistemindeki en hızlı rüzgarları ile bilinir.",
                color: 0x335bf5,
                radius: 3.4,
                orbitRadius: 148,
                speed: 0.002
            }
        };

        // --- 2. TEMEL SAHNE OLUŞTURMA ---
        let isRunning = true;
        let simSpeed = 1;
        const container = document.getElementById('canvas-container');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 70, 180);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 400;
        controls.minDistance = 10;

        // Işıklandırma
        const ambientLight = new THREE.AmbientLight(0x333333);
        scene.add(ambientLight);

        const sunLight = new THREE.PointLight(0xffffff, 2, 500);
        scene.add(sunLight);

        // --- 3. EKSTRA GÖRSEL ÖĞELER (Yıldızlar, Asteroit Kuşağı, Güneş Katmanları) ---
        
        // Yıldızlı Arka Plan
        function createStars() {
            const starGeometry = new THREE.BufferGeometry();
            const starCount = 3000;
            const starPositions = new Float32Array(starCount * 3);

            for (let i = 0; i < starCount * 3; i++) {
                starPositions[i] = (Math.random() - 0.5) * 800;
            }

            starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.8, transparent: true, opacity: 0.8 });
            const starField = new THREE.Points(starGeometry, starMaterial);
            scene.add(starField);
        }
        createStars();

        // Asteroit Kuşağı (Mars ile Jüpiter Arasında)
        function createAsteroidBelt() {
            const asteroidCount = 1200;
            const asteroidGeometry = new THREE.DodecahedronGeometry(0.2, 0);
            const asteroidMaterial = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.9 });
            const instancedMesh = new THREE.InstancedMesh(asteroidGeometry, asteroidMaterial, asteroidCount);

            const dummy = new THREE.Object3D();
            for (let i = 0; i < asteroidCount; i++) {
                const angle = Math.random() * Math.PI * 2;
                const radius = 66 + Math.random() * 9; // 58 (Mars) ile 80 (Jüpiter) arası
                
                dummy.position.x = Math.cos(angle) * radius + (Math.random() - 0.5) * 2;
                dummy.position.y = (Math.random() - 0.5) * 2;
                dummy.position.z = Math.sin(angle) * radius + (Math.random() - 0.5) * 2;
                
                dummy.rotation.x = Math.random() * Math.PI;
                dummy.rotation.y = Math.random() * Math.PI;
                
                const scale = 0.5 + Math.random() * 0.8;
                dummy.scale.set(scale, scale, scale);
                
                dummy.updateMatrix();
                instancedMesh.setMatrixAt(i, dummy.matrix);
            }
            scene.add(instancedMesh);
        }
        createAsteroidBelt();

        // --- 4. GÜNEŞ VE GEZEGENLERİN OLUŞTURULMASI ---
        const planetMeshes = {};
        const planetAngles = {};

        // Güneş (Işıyan iç yapı ve şeffaf dış Katman / Taç)
        const sunGroup = new THREE.Group();
        const sunGeo = new THREE.SphereGeometry(planetData["Güneş"].radius, 32, 32);
        const sunMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
        const sunCoreMesh = new THREE.Mesh(sunGeo, sunMat);
        sunGroup.add(sunCoreMesh);

        // Güneş Katmanı (Güneş atmosferi / Taç katmanı simülasyonu)
        const sunCoronaGeo = new THREE.SphereGeometry(planetData["Güneş"].radius * 1.15, 32, 32);
        const sunCoronaMat = new THREE.MeshBasicMaterial({ color: 0xffdd44, transparent: true, opacity: 0.25 });
        const sunCoronaMesh = new THREE.Mesh(sunCoronaGeo, sunCoronaMat);
        sunGroup.add(sunCoronaMesh);

        sunGroup.userData = { name: "Güneş" };
        scene.add(sunGroup);
        planetMeshes["Güneş"] = sunGroup;

        // Gezegenler, Yörüngeler, Ay ve Satürn Halkası
        let moonMesh;

        Object.keys(planetData).forEach(key => {
            if (key === "Güneş") return;

            const data = planetData[key];
            
            // Yörünge Çizgisi
            const orbitGeo = new THREE.BufferGeometry();
            const points = [];
            for (let i = 0; i <= 128; i++) {
                const theta = (i / 128) * Math.PI * 2;
                points.push(new THREE.Vector3(Math.cos(theta) * data.orbitRadius, 0, Math.sin(theta) * data.orbitRadius));
            }
            orbitGeo.setFromPoints(points);
            const orbitMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.15 });
            const orbitLine = new THREE.Line(orbitGeo, orbitMat);
            scene.add(orbitLine);

            // Gezegen Gövdesi
            const pGroup = new THREE.Group();
            const pGeo = new THREE.SphereGeometry(data.radius, 32, 32);
            const pMat = new THREE.MeshStandardMaterial({ 
                color: data.color, 
                roughness: 0.7,
                metalness: 0.1
            });
            const pMesh = new THREE.Mesh(pGeo, pMat);
            pGroup.add(pMesh);

            // Satürn Halkaları
            if (key === "Satürn") {
                const ringGeo = new THREE.RingGeometry(data.radius * 1.4, data.radius * 2.3, 64);
                // Çift taraflı görünüm için
                const ringMat = new THREE.MeshStandardMaterial({ 
                    color: 0xd2b48c, 
                    side: THREE.DoubleSide, 
                    transparent: true, 
                    opacity: 0.8 
                });
                const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                ringMesh.rotation.x = Math.PI / 2.3;
                pGroup.add(ringMesh);
            }

            // Dünya için Ay
            if (key === "Dünya") {
                const moonGeo = new THREE.SphereGeometry(0.6, 16, 16);
                const moonMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.8 });
                moonMesh = new THREE.Mesh(moonGeo, moonMat);
                pGroup.add(moonMesh);
            }

            pGroup.userData = { name: key };
            pMesh.userData = { name: key }; // Tıklama algılaması için

            planetAngles[key] = Math.random() * Math.PI * 2; // Rastgele başlangıç konumu
            pGroup.position.x = Math.cos(planetAngles[key]) * data.orbitRadius;
            pGroup.position.z = Math.sin(planetAngles[key]) * data.orbitRadius;

            scene.add(pGroup);
            planetMeshes[key] = pGroup;
        });

        // --- 5. ETKİLEŞİM VE TIKLAMA ALGISI (RAYCASTING) ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (e) => {
            // Arayüz elemanlarına tıklandıysa nesne seçimini engelle
            if (e.target.closest('#controls-bar') || e.target.closest('#planet-nav') || e.target.closest('#info-card')) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            
            // Tüm gezegen ve Güneş nesnelerini tara
            const interactiveObjects = [];
            Object.values(planetMeshes).forEach(group => {
                group.traverse(child => {
                    if (child.isMesh) interactiveObjects.push(child);
                });
            });

            const intersects = raycaster.intersectObjects(interactiveObjects);

            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while (obj.parent && !obj.userData.name && obj.parent !== scene) {
                    obj = obj.parent;
                }
                const name = obj.userData.name;
                if (name && planetData[name]) {
                    showInfoCard(name);
                }
            }
        });

        // Bilgi Kartını Açma
        function showInfoCard(name) {
            const data = planetData[name];
            document.getElementById('card-title').innerText = name;
            document.getElementById('card-diameter').innerText = data.diameter;
            document.getElementById('card-distance').innerText = data.distance;
            document.getElementById('card-period').innerText = data.period;
            document.getElementById('card-moons').innerText = data.moons;
            document.getElementById('card-desc').innerText = data.desc;
            
            document.getElementById('info-card').style.display = 'block';
        }

        // Bilgi Kartını Kapatma
        function closeInfoCard() {
            document.getElementById('info-card').style.display = 'none';
        }

        // Gezegene Odaklanma Düğmeleri
        function focusObject(name) {
            showInfoCard(name);
            const target = planetMeshes[name];
            if (target) {
                const targetPos = new THREE.Vector3();
                target.getWorldPosition(targetPos);
                
                // Kamerayı seçilen nesneye yumuşakça yaklaştır
                const offset = name === "Güneş" ? 40 : planetData[name].radius * 6 + 10;
                camera.position.set(targetPos.x, targetPos.y + offset * 0.5, targetPos.z + offset);
                controls.target.copy(targetPos);
            }
        }

        // --- 6. KONTROL ARAYÜZÜ ETKİLEŞİMLERİ ---
        const toggleBtn = document.getElementById('toggle-btn');
        toggleBtn.addEventListener('click', () => {
            isRunning = !isRunning;
            toggleBtn.innerText = isRunning ? "Durdur" : "Başlat";
            toggleBtn.style.background = isRunning ? "#2563eb" : "#16a34a";
        });

        const speedSlider = document.getElementById('speed-slider');
        speedSlider.addEventListener('input', (e) => {
            simSpeed = parseFloat(e.target.value);
        });

        document.getElementById('reset-cam').addEventListener('click', () => {
            camera.position.set(0, 70, 180);
            controls.target.set(0, 0, 0);
        });

        // Pencere Boyutu Değişimi
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- 7. ANİMASYON VE DÖNGÜ ---
        let moonAngle = 0;

        function animate() {
            requestAnimationFrame(animate);

            if (isRunning) {
                // Güneş ve Gezegenlerin Dönüşü
                Object.keys(planetData).forEach(key => {
                    const data = planetData[key];
                    const meshGroup = planetMeshes[key];

                    // Kendi ekseninde dönme
                    meshGroup.rotation.y += 0.005 * simSpeed;

                    // Yörüngede dönme
                    if (key !== "Güneş") {
                        planetAngles[key] += data.speed * 0.5 * simSpeed;
                        meshGroup.position.x = Math.cos(planetAngles[key]) * data.orbitRadius;
                        meshGroup.position.z = Math.sin(planetAngles[key]) * data.orbitRadius;
                    }
                });

                // Dünya etrafında Ay'ın dönmesi
                if (moonMesh && planetMeshes["Dünya"]) {
                    moonAngle += 0.03 * simSpeed;
                    const moonDist = 4.5;
                    moonMesh.position.x = Math.cos(moonAngle) * moonDist;
                    moonMesh.position.z = Math.sin(moonAngle) * moonDist;
                }
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D İnteraktif Güneş Sistemi Modeli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #030712;
            color: #f3f4f6;
            user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        /* Custom scrollbar for popup detail panel */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.5);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.8);
        }
        /* Glowing UI Glassmorphism Effect */
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }
        .glow-button {
            transition: all 0.2s ease-in-out;
        }
        .glow-button:hover {
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.6);
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="relative min-h-screen overflow-hidden">

    <div id="canvas-container" class="absolute inset-0 z-0"></div>

    <header class="absolute top-4 left-4 right-4 z-10 flex flex-col sm:flex-row justify-between items-center pointer-events-none gap-4">
        <div class="glass-panel px-5 py-3 rounded-2xl pointer-events-auto flex items-center gap-3">
            <div class="bg-amber-500/20 p-2.5 rounded-xl text-amber-400">
                <i class="fa-solid fa-sun text-2xl animate-spin-slow"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg text-white tracking-wide">3D Güneş Sistemi Modeli</h1>
                <p class="text-xs text-gray-400">Fen Bilimleri Proje Ödevi - 6. Sınıf</p>
            </div>
        </div>

        <!-- Animation Controls (Play/Pause, Speed Slider) -->
        <div class="glass-panel px-5 py-3 rounded-2xl pointer-events-auto flex items-center gap-4">
            <button id="play-pause-btn" class="glow-button bg-indigo-600 hover:bg-indigo-500 text-white p-3 rounded-xl flex items-center justify-center transition" title="Başlat / Durdur">
                <i id="play-icon" class="fa-solid fa-pause text-base"></i>
            </button>
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-gauge-high text-indigo-400 text-sm"></i>
                <div class="flex flex-col">
                    <span class="text-xs text-gray-300 font-medium flex justify-between">
                        Yörünge Hızı: <span id="speed-value" class="text-indigo-400 font-bold">1.0x</span>
                    </span>
                    <input id="speed-slider" type="range" min="0" max="5" step="0.1" value="1" class="w-28 sm:w-36 h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-indigo-500 mt-1">
                </div>
            </div>
            <button id="reset-cam-btn" class="glow-button bg-slate-800 hover:bg-slate-700 text-gray-300 hover:text-white p-3 rounded-xl flex items-center justify-center border border-slate-700 transition" title="Kamerayı Sıfırla">
                <i class="fa-solid fa-arrows-to-circle text-base"></i>
            </button>
        </div>
    </header>

    <aside id="info-panel" class="glass-panel absolute right-4 top-24 bottom-6 w-80 sm:w-96 rounded-2xl p-6 z-10 transform translate-x-[115%] transition-transform duration-300 ease-out flex flex-col justify-between overflow-y-auto">
        <div>
            <!-- Close Button & Header -->
            <div class="flex justify-between items-center pb-4 border-b border-gray-700/60 mb-5">
                <div class="flex items-center gap-3">
                    <span id="planet-color-badge" class="w-4 h-4 rounded-full bg-amber-400 inline-block shadow-lg"></span>
                    <h2 id="planet-name" class="text-2xl font-extrabold text-white tracking-wide">Güneş</h2>
                </div>
                <button id="close-info-btn" class="text-gray-400 hover:text-white p-2 rounded-lg hover:bg-white/10 transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Planet Visual Icon/Badge -->
            <div class="flex justify-center my-4">
                <div id="planet-icon-container" class="w-28 h-28 rounded-full flex items-center justify-center bg-gradient-to-br from-indigo-900/40 to-slate-900/40 border border-white/10 shadow-2xl relative overflow-hidden">
                    <div id="planet-visual" class="w-20 h-20 rounded-full shadow-inner"></div>
                </div>
            </div>

            <p id="planet-description" class="text-sm text-gray-300 leading-relaxed my-4 text-center italic">
                Tıklanan gök cismi hakkında kısa bilgi.
            </p>

            <!-- Detailed Properties Grid -->
            <div class="space-y-3 mt-6">
                <div class="bg-slate-900/50 p-3.5 rounded-xl border border-white/5 flex items-center gap-3">
                    <div class="p-2.5 bg-indigo-500/20 text-indigo-400 rounded-lg">
                        <i class="fa-solid fa-ruler-combined text-lg w-5 text-center"></i>
                    </div>
                    <div>
                        <div class="text-xs text-gray-400 font-medium">Çap</div>
                        <div id="planet-diameter" class="text-sm font-semibold text-white">0 km</div>
                    </div>
                </div>

                <div class="bg-slate-900/50 p-3.5 rounded-xl border border-white/5 flex items-center gap-3">
                    <div class="p-2.5 bg-amber-500/20 text-amber-400 rounded-lg">
                        <i class="fa-solid fa-arrows-left-right text-lg w-5 text-center"></i>
                    </div>
                    <div>
                        <div class="text-xs text-gray-400 font-medium">Güneş'e Uzaklığı</div>
                        <div id="planet-distance" class="text-sm font-semibold text-white">0 km</div>
                    </div>
                </div>

                <div class="bg-slate-900/50 p-3.5 rounded-xl border border-white/5 flex items-center gap-3">
                    <div class="p-2.5 bg-emerald-500/20 text-emerald-400 rounded-lg">
                        <i class="fa-solid fa-rotate text-lg w-5 text-center"></i>
                    </div>
                    <div>
                        <div class="text-xs text-gray-400 font-medium">Dolanma Süresi (1 Yıl)</div>
                        <div id="planet-period" class="text-sm font-semibold text-white">0 Gün</div>
                    </div>
                </div>

                <div class="bg-slate-900/50 p-3.5 rounded-xl border border-white/5 flex items-center gap-3">
                    <div class="p-2.5 bg-purple-500/20 text-purple-400 rounded-lg">
                        <i class="fa-solid fa-moon text-lg w-5 text-center"></i>
                    </div>
                    <div>
                        <div class="text-xs text-gray-400 font-medium">Uydu Sayısı</div>
                        <div id="planet-moons" class="text-sm font-semibold text-white">0</div>
                    </div>
                </div>
            </div>
        </div>

        <button id="focus-planet-btn" class="glow-button w-full mt-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl flex items-center justify-center gap-2 transition">
            <i class="fa-solid fa-crosshairs"></i> Yakından İncele
        </button>
    </aside>

    <!-- Navigation Bar for Fast Planet Selection -->
    <nav class="absolute bottom-4 left-1/2 transform -translate-x-1/2 z-10 glass-panel px-3 py-2 rounded-2xl max-w-[95vw] overflow-x-auto">
        <div id="planet-nav" class="flex items-center gap-1 sm:gap-2">
            <!-- Dynamically populated via JS -->
        </div>
    </nav>

    <!-- Help / Instruction Tooltip -->
    <div class="absolute top-20 left-4 z-10 pointer-events-none hidden md:block">
        <div class="glass-panel px-4 py-2.5 rounded-xl text-xs text-gray-300 flex items-center gap-2">
            <i class="fa-solid fa-hand-pointer text-indigo-400 text-sm"></i>
            <span>Gezegen seçmek için <b>tıklayın</b>. Fare ile <b>döndürün</b> ve <b>yakınlaşın</b>.</span>
        </div>
    </div>

    <script>
        const PLANET_DATA = [
            {
                id: 'sun',
                name: 'Güneş',
                color: 0xffaa00,
                radius: 7.0,
                distance: 0,
                speed: 0,
                diameter: '1.392.700 km',
                sunDistance: '0 km (Merkez)',
                period: '25-35 Gün (Kendi etrafında)',
                moons: 0,
                description: 'Güneş Sistemi\'nin merkezinde yer alan orta büyüklükte parlak bir yıldızdır. Sistemdeki kütlenin %99.8\'ini oluşturur.',
                textureColor: '#ffaa00'
            },
            {
                id: 'mercury',
                name: 'Merkür',

                radius: 0.8,
                distance: 14,

                diameter: '4.879 km',

                period: '88 Gün',

                textureColor: '#8c8c8c'
            },
            {
                id: 'venus',
                name: 'Venüs',
                color: 0xe3bb76,
                radius: 1.3,
                distance: 22,
                speed: 0.022,
                diameter: '12.104 km',
                sunDistance: '108.200.000 km',
                period: '225 Gün',
                moons: 0,
                description: 'Çok yoğun karbondioksit atmosferi nedeniyle sera etkisi yüzünden en sıcak gezegendir. Çoban Yıldızı olarak da bilinir.',
                textureColor: '#e3bb76'
            },
            {
                id: 'earth',
                name: 'Dünya',
                color: 0x2b82c5,
                radius: 1.5,
                distance: 32,
                speed: 0.015,
                diameter: '12.742 km',
                sunDistance: '149.600.000 km',
                period: '365,25 Gün',
                moons: 1,
                description: 'Üzerinde yaşam olduğu bilinen tek gök cismidir. Yüzeyinin yaklaşık %71\'i sularla kaplıdır.',
                textureColor: '#2b82c5',
                hasMoon: true
            },
            {
                id: 'mars',
                name: 'Mars',
                color: 0xc85a32,
                radius: 1.0,
                distance: 42,
                speed: 0.012,
                diameter: '6.779 km',
                sunDistance: '227.900.000 km',
                period: '687 Gün',
                moons: 2,
                description: 'Yüzeyindeki demir oksit (pas) nedeniyle "Kızıl Gezegen" olarak adlandırılır.',
                textureColor: '#c85a32'
            },
            {
                id: 'jupiter',
                name: 'Jüpiter',
                color: 0xb07f35,
                radius: 3.8,
                distance: 58,
                speed: 0.008,
                diameter: '139.820 km',
                sunDistance: '778.500.000 km',
                period: '12 Yıl (4.333 Gün)',
                moons: 95,
                description: 'Güneş Sistemi\'nin en büyük gezegenidir. Bir gaz devidir ve üzerinde Dev Kırmızı Leke adı verilen devasa bir fırtına bulunur.',
                textureColor: '#b07f35'
            },
            {
                id: 'saturn',
                name: 'Satürn',
                color: 0xe2bf7d,
                radius: 3.0,
                distance: 76,
                speed: 0.006,
                diameter: '116.460 km',
                sunDistance: '1.434.000.000 km',
                period: '29,5 Yıl (10.759 Gün)',
                moons: 146,
                description: 'Buz ve kaya parçalarından oluşan muhteşem ve belirgin halka sistemiyle ünlü gaz devidir.',
                textureColor: '#e2bf7d',
                hasRings: true
            },
            {
                id: 'uranus',
                name: 'Uranüs',
                color: 0x6bbfff,
                radius: 2.2,
                distance: 92,
                speed: 0.004,
                diameter: '50.724 km',
                sunDistance: '2.871.000.000 km',
                period: '84 Yıl (30.687 Gün)',
                moons: 28,
                description: 'Yörüngesinde yatay olarak yan yatmış gibi dönen tek gezegendir. Metan gazı nedeniyle mavi-yeşil renktedir.',
                textureColor: '#6bbfff',
                hasRingThin: true
            },
            {
                id: 'neptune',
                name: 'Neptün',
                color: 0x3355ff,
                radius: 2.1,
                distance: 106,
                speed: 0.003,
                diameter: '49.244 km',
                sunDistance: '4.495.000.000 km',
                period: '165 Yıl (60.190 Gün)',
                moons: 16,
                description: 'Güneş\'e en uzak gezegendir. Derin mavi rengi ve Saatte 2.000 km\'ye ulaşan süpersonik rüzgarları ile tanınır.',
                textureColor: '#3355ff'
            }
        ];

        let scene, camera, renderer, controls;
        let planetObjects = [];
        let raycaster, mouse;
        let selectedObject = null;
        let isPlaying = true;
        let animationSpeed = 1.0;
        let moonMesh = null;
        let moonOrbitAngle = 0;

        const container = document.getElementById('canvas-container');

        function initScene() {
            // Scene
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030712, 0.0015);

            // Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 50, 110);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 300;
            controls.minDistance = 5;

            // Raycasting for object selection
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Lighting Setup
            setupLighting();

            // Starry Background
            createStarfield();

            // Create Solar System Objects
            createSolarSystem();

            // Setup UI Quick Nav
            setupNavigation();

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('click', onPointerClick);

            // Start Animation Loop
            animate();
        }

        function setupLighting() {
            // Ambient light for general soft visibility
            const ambientLight = new THREE.AmbientLight(0x333344, 0.8);
            scene.add(ambientLight);

            // PointLight at Sun center radiating outwards
            const sunLight = new THREE.PointLight(0xffffff, 2.0, 400);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 1024;
            sunLight.shadow.mapSize.height = 1024;
            scene.add(sunLight);
        }

        function createProceduralTexture(colorHex, isSun = false, isGasGiant = false) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = colorHex;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Add procedural details/noise
            if (isSun) {
                for (let i = 0; i < 400; i++) {
                    ctx.fillStyle = Math.random() > 0.5 ? '#ffcc00' : '#ff4400';
                    ctx.beginPath();
                    ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 8, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else if (isGasGiant) {
                // Horizontal bands
                for (let y = 0; y < canvas.height; y += 4) {
                    ctx.fillStyle = `rgba(0, 0, 0, ${Math.random() * 0.25})`;
                    ctx.fillRect(0, y, canvas.width, 2 + Math.random() * 4);
                }
            } else {
                // Surface noise for rocky planets
                for (let i = 0; i < 300; i++) {
                    ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.15})`;
                    ctx.beginPath();
                    ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 4, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            return new THREE.CanvasTexture(canvas);
        }

        function createStarfield() {
            const starsGeometry = new THREE.BufferGeometry();
            const count = 3000;
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            for (let i = 0; i < count * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 600;
                positions[i + 1] = (Math.random() - 0.5) * 600;
                positions[i + 2] = (Math.random() - 0.5) * 600;

                // Subtle blue/white star color variations
                const c = 0.8 + Math.random() * 0.2;
                colors[i] = c;
                colors[i + 1] = c;
                colors[i + 2] = c + Math.random() * 0.2;
            }

            starsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            starsGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const starsMaterial = new THREE.PointsMaterial({
                size: 0.8,
                vertexColors: true,
                transparent: true,
                opacity: 0.8
            });

            const starField = new THREE.Points(starsGeometry, starsMaterial);
            scene.add(starField);
        }

        function createSolarSystem() {
            PLANET_DATA.forEach((data) => {
                const pivot = new THREE.Group();
                scene.add(pivot);

                let mesh;

                if (data.id === 'sun') {
                    // Sun Mesh
                    const sunGeo = new THREE.SphereGeometry(data.radius, 32, 32);
                    const sunMat = new THREE.MeshBasicMaterial({
                        color: data.color,
                        map: createProceduralTexture(data.textureColor, true)
                    });
                    mesh = new THREE.Mesh(sunGeo, sunMat);

                    // Sun Glow Shader/Sprite effect
                    const glowGeo = new THREE.SphereGeometry(data.radius * 1.25, 32, 32);
                    const glowMat = new THREE.MeshBasicMaterial({
                        color: 0xffaa00,
                        transparent: true,
                        opacity: 0.25,
                        side: THREE.BackSide
                    });
                    const glowMesh = new THREE.Mesh(glowGeo, glowMat);
                    mesh.add(glowMesh);

                } else {
                    // Planet Sphere
                    const isGas = ['jupiter', 'saturn', 'uranus', 'neptune'].includes(data.id);
                    const planetGeo = new THREE.SphereGeometry(data.radius, 32, 32);
                    const planetMat = new THREE.MeshStandardMaterial({
                        color: data.color,
                        map: createProceduralTexture(data.textureColor, false, isGas),
                        roughness: 0.7,
                        metalness: 0.1
                    });
                    mesh = new THREE.Mesh(planetGeo, planetMat);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;

                    // Position along radius
                    mesh.position.x = data.distance;

                    // Draw Orbital Line
                    const orbitLine = createOrbitLine(data.distance);
                    scene.add(orbitLine);

                    // Add Saturn Rings
                    if (data.hasRings) {
                        const ringGeo = new THREE.RingGeometry(data.radius * 1.4, data.radius * 2.4, 64);
                        // Rotate geometry so it aligns with Saturn's equator
                        ringGeo.rotateX(Math.PI / 2);
                        const ringMat = new THREE.MeshStandardMaterial({
                            color: 0xd2b48c,
                            side: THREE.DoubleSide,
                            transparent: true,
                            opacity: 0.85
                        });
                        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                        ringMesh.rotation.x = 0.4;
                        mesh.add(ringMesh);
                    }

                    // Add Uranus Thin Ring
                    if (data.hasRingThin) {
                        const ringGeo = new THREE.RingGeometry(data.radius * 1.3, data.radius * 1.5, 32);
                        ringGeo.rotateX(Math.PI / 2);
                        const ringMat = new THREE.MeshBasicMaterial({
                            color: 0x88d4ff,
                            side: THREE.DoubleSide,
                            transparent: true,
                            opacity: 0.5
                        });
                        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                        ringMesh.rotation.z = Math.PI / 2;
                        mesh.add(ringMesh);
                    }

                    // Add Earth's Moon
                    if (data.hasMoon) {
                        const moonGeo = new THREE.SphereGeometry(0.35, 16, 16);
                        const moonMat = new THREE.MeshStandardMaterial({
                            color: 0xdcdcdc,
                            roughness: 0.8
                        });
                        moonMesh = new THREE.Mesh(moonGeo, moonMat);
                        moonMesh.position.set(data.radius + 1.8, 0, 0);
                        mesh.add(moonMesh);
                    }
                }

                // Metadata attached to mesh for raycasting identification
                mesh.userData = { ...data, pivot: pivot };
                pivot.add(mesh);

                planetObjects.push(mesh);
            });
        }

        function createOrbitLine(radius) {
            const points = [];
            const segments = 128;
            for (let i = 0; i <= segments; i++) {
                const theta = (i / segments) * Math.PI * 2;
                points.push(new THREE.Vector3(Math.cos(theta) * radius, 0, Math.sin(theta) * radius));
            }

            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.15
            });

            return new THREE.LineLoop(geometry, material);
        }

        function setupNavigation() {
            const navContainer = document.getElementById('planet-nav');
            PLANET_DATA.forEach((planet) => {
                const btn = document.createElement('button');
                btn.className = 'px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 whitespace-nowrap transition bg-slate-800/60 hover:bg-indigo-600 text-gray-300 hover:text-white border border-white/5';
                
                const dot = document.createElement('span');
                dot.className = 'w-2.5 h-2.5 rounded-full';
                dot.style.backgroundColor = '#' + planet.color.toString(16).padStart(6, '0');

                btn.appendChild(dot);
                btn.appendChild(document.createTextNode(planet.name));

                btn.addEventListener('click', () => {
                    const targetObj = planetObjects.find(p => p.userData.id === planet.id);
                    if (targetObj) {
                        selectPlanet(targetObj);
                    }
                });

                navContainer.appendChild(btn);
            });
        }

        function onPointerClick(event) {
            // Ignore click if user clicked on UI overlay elements
            if (event.target.closest('#info-panel') || 
                event.target.closest('#planet-nav') || 
                event.target.closest('header')) {
                return;
            }

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(planetObjects, true);

            if (intersects.length > 0) {
                // Find root planet object
                let clicked = intersects[0].object;
                while (clicked.parent && !clicked.userData.name) {
                    clicked = clicked.parent;
                }
                if (clicked && clicked.userData.name) {
                    selectPlanet(clicked);
                }
            }
        }

        function selectPlanet(planetMesh) {
            selectedObject = planetMesh;
            const data = planetMesh.userData;

            // Update Info Panel UI Text
            document.getElementById('planet-name').textContent = data.name;
            document.getElementById('planet-description').textContent = data.description;
            document.getElementById('planet-diameter').textContent = data.diameter;
            document.getElementById('planet-distance').textContent = data.sunDistance;
            document.getElementById('planet-period').textContent = data.period;
            document.getElementById('planet-moons').textContent = data.moons;

            const colorHex = '#' + data.color.toString(16).padStart(6, '0');
            document.getElementById('planet-color-badge').style.backgroundColor = colorHex;
            document.getElementById('planet-visual').style.backgroundColor = colorHex;
            document.getElementById('planet-visual').style.boxShadow = `0 0 25px ${colorHex}`;

            // Show Sidebar
            const panel = document.getElementById('info-panel');
            panel.classList.remove('translate-x-[115%]');

            // Smooth Camera Focus Movement
            focusCameraOn(planetMesh);
        }

        function focusCameraOn(target) {
            const worldPos = new THREE.Vector3();
            target.getWorldPosition(worldPos);

            const isSun = target.userData.id === 'sun';
            const distanceOffset = isSun ? 30 : target.userData.radius * 6 + 10;

            const targetCamPos = new THREE.Vector3()
                .copy(worldPos)
                .add(new THREE.Vector3(distanceOffset * 0.7, distanceOffset * 0.5, distanceOffset));

            // Animate Controls Target
            const startTarget = controls.target.clone();
            const startCamPos = camera.position.clone();
            const startTime = performance.now();
            const duration = 1000; // 1s smooth transition

            function animateCamera(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easeProgress = 0.5 - Math.cos(progress * Math.PI) / 2; // Ease in out

                controls.target.lerpVectors(startTarget, worldPos, easeProgress);
                camera.position.lerpVectors(startCamPos, targetCamPos, easeProgress);
                controls.update();

                if (progress < 1) {
                    requestAnimationFrame(animateCamera);
                }
            }

            requestAnimationFrame(animateCamera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying) {
                // Orbit & Self Rotation
                planetObjects.forEach((planet) => {
                    const data = planet.userData;

                    // Self Rotation
                    planet.rotation.y += 0.01;

                    // Orbital Revolution around Sun
                    if (data.pivot && data.speed > 0) {
                        data.pivot.rotation.y += data.speed * 0.3 * animationSpeed;
                    }
                });

                // Orbit Earth's Moon
                if (moonMesh) {
                    moonOrbitAngle += 0.03 * animationSpeed;
                    const moonDist = 3.2;
                    moonMesh.position.x = Math.cos(moonOrbitAngle) * moonDist;
                    moonMesh.position.z = Math.sin(moonOrbitAngle) * moonDist;
                }
            }

            // Update camera controls
            controls.update();

            // Render scene
            renderer.render(scene, camera);
        }

        document.addEventListener('DOMContentLoaded', () => {
            initScene();

            // Play / Pause Toggle
            const playPauseBtn = document.getElementById('play-pause-btn');
            const playIcon = document.getElementById('play-icon');

            playPauseBtn.addEventListener('click', () => {
                isPlaying = !isPlaying;
                playIcon.className = isPlaying ? 'fa-solid fa-pause text-base' : 'fa-solid fa-play text-base';
            });

            // Speed Slider
            const speedSlider = document.getElementById('speed-slider');
            const speedValue = document.getElementById('speed-value');

            speedSlider.addEventListener('input', (e) => {
                animationSpeed = parseFloat(e.target.value);
                speedValue.textContent = animationSpeed.toFixed(1) + 'x';
            });

            // Reset Camera
            document.getElementById('reset-cam-btn').addEventListener('click', () => {
                controls.target.set(0, 0, 0);
                camera.position.set(0, 50, 110);
                controls.update();
            });

            // Close Info Panel Button
            document.getElementById('close-info-btn').addEventListener('click', () => {
                document.getElementById('info-panel').classList.add('translate-x-[115%]');
            });

            // Focus button in Info Panel
            document.getElementById('focus-planet-btn').addEventListener('click', () => {
                if (selectedObject) {
                    focusCameraOn(selectedObject);
                }
            });
        });
    </script>
</body>
</html>

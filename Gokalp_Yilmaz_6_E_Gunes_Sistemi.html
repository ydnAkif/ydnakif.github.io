<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Etkileşimli Güneş Sistemi</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030b;color:#fff;font-family:Arial}canvas{display:block;width:100%;height:100%;touch-action:none}
#panel,#info{position:fixed;z-index:2;background:#07102ddd;border:1px solid #53638d;border-radius:16px;padding:14px;box-shadow:0 0 25px #000}#panel{left:12px;top:12px;width:260px}#info{right:12px;top:12px;width:270px;display:none}h2{margin:0 0 10px;color:#ffd34d;font-size:20px}button{padding:8px 12px;margin-right:5px;border:0;border-radius:8px;background:#29447d;color:#fff;font-weight:bold}input{width:150px}small{color:#c8d2ef;line-height:1.5}</style></head><body>
<canvas id="c"></canvas><div id="panel"><h2>🌞 Güneş Sistemi</h2><button id="start">▶ Başla</button><button id="stop">⏸ Durdur</button><br><br>Hız: <b id="speedText">1×</b><br><input id="speed" type="range" min="0" max="5" step=".25" value="1"><br><br><small>Fareyle sürükle: döndür<br>Fare tekerleği: yakınlaştır<br>Gezegene tıkla: bilgi</small></div>
<div id="info"><h2 id="name"></h2><p><b>Çapı:</b> <span id="dia"></span></p><p><b>Güneş'e uzaklığı:</b> <span id="dist"></span></p><p><b>Dolanma süresi:</b> <span id="period"></span></p><p><b>Uydu sayısı:</b> <span id="moons"></span></p></div>
<script>
"use strict";
const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");let W=0,H=0,DPR=1;
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener("resize",resize);resize();
const planets=[
["Merkür","#9b958c",4,55,"4.879 km","57,9 milyon km","88 gün","0"],["Venüs","#d5a35f",5.5,82,"12.104 km","108,2 milyon km","224,7 gün","0"],["Dünya","#3488dc",6,112,"12.742 km","149,6 milyon km","365,25 gün","1"],["Mars","#c75c3c",5,142,"6.779 km","227,9 milyon km","687 gün","2"],["Jüpiter","#c89d70",13,190,"139.820 km","778,5 milyon km","11,86 yıl","101"],["Satürn","#d6bd88",11,245,"116.460 km","1,43 milyar km","29,45 yıl","146"],["Uranüs","#78d6d5",8,300,"50.724 km","2,87 milyar km","84 yıl","28"],["Neptün","#416de0",8,355,"49.244 km","4,50 milyar km","164,8 yıl","16"]];
const stars=[];for(let i=0;i<650;i++)stars.push([Math.random(),Math.random(),Math.random()*1.7+.4]);
let angle=0,running=true,speed=1,yaw=0,pitch=.35,zoom=1,dragging=false,lastX=0,lastY=0,positions=[];
function project(x,y,z){let cy=Math.cos(yaw),sy=Math.sin(yaw),X=x*cy-z*sy,Z=x*sy+z*cy,cp=Math.cos(pitch),sp=Math.sin(pitch),Y=y*cp-Z*sp,ZZ=y*sp+Z*cp,f=850/(850+ZZ);return{x:W/2+X*zoom*f,y:H/2+Y*zoom*f,z:ZZ,f}}
function sphere(x,y,r,color){let g=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.05,x,y,r);g.addColorStop(0,"#fff");g.addColorStop(.16,color);g.addColorStop(.72,color);g.addColorStop(1,"#02030a");ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill()}
function orbit(r){ctx.beginPath();for(let a=0;a<=Math.PI*2+.04;a+=.04){let p=project(Math.cos(a)*r,0,Math.sin(a)*r);if(a===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)}ctx.strokeStyle="rgba(110,140,200,.32)";ctx.lineWidth=1;ctx.stroke()}
function draw(){ctx.fillStyle="#02030b";ctx.fillRect(0,0,W,H);for(const s of stars){ctx.fillStyle="rgba(255,255,255,"+(.35+Math.sin(performance.now()*.001+s[2])*.2)+")";ctx.beginPath();ctx.arc(s[0]*W,s[1]*H,s[2],0,Math.PI*2);ctx.fill()}planets.forEach(p=>orbit(p[3]));
let sun=project(0,0,0),glow=ctx.createRadialGradient(sun.x,sun.y,5,sun.x,sun.y,95*zoom);glow.addColorStop(0,"rgba(255,235,100,.9)");glow.addColorStop(.35,"rgba(255,170,20,.35)");glow.addColorStop(1,"rgba(255,100,0,0)");ctx.beginPath();ctx.arc(sun.x,sun.y,95*zoom,0,Math.PI*2);ctx.fillStyle=glow;ctx.fill();sphere(sun.x,sun.y,28*zoom,"#ffb51b");
positions=[];planets.forEach((p,i)=>{let a=angle*(.55/(1+i*.18))+i*.75,q=project(Math.cos(a)*p[3],0,Math.sin(a)*p[3]),r=p[2]*zoom*q.f;positions.push({p,q,r,a})});positions.sort((a,b)=>b.q.z-a.q.z);
for(const o of positions){sphere(o.q.x,o.q.y,o.r,o.p[1]);if(o.p[0]==="Satürn"){ctx.save();ctx.translate(o.q.x,o.q.y);ctx.rotate(-.35);ctx.beginPath();ctx.ellipse(0,0,o.r*1.9,o.r*.55,0,0,Math.PI*2);ctx.strokeStyle="rgba(235,215,170,.8)";ctx.lineWidth=o.r*.23;ctx.stroke();ctx.restore()}}
let earth=positions.find(o=>o.p[0]==="Dünya");if(earth){let ma=angle*3,ex=Math.cos(earth.a)*earth.p[3],ez=Math.sin(earth.a)*earth.p[3],m=project(ex+Math.cos(ma)*15,0,ez+Math.sin(ma)*15);sphere(m.x,m.y,2.2*zoom*m.f,"#bdbdbd")}
if(running)angle+=.012*speed;requestAnimationFrame(draw)}draw();
document.getElementById("start").onclick=()=>running=true;document.getElementById("stop").onclick=()=>running=false;document.getElementById("speed").oninput=e=>{speed=Number(e.target.value);document.getElementById("speedText").textContent=speed+"×"};
canvas.addEventListener("mousedown",e=>{dragging=true;lastX=e.clientX;lastY=e.clientY});addEventListener("mouseup",()=>dragging=false);addEventListener("mousemove",e=>{if(!dragging)return;yaw+=(e.clientX-lastX)*.008;pitch+=(e.clientY-lastY)*.008;pitch=Math.max(-1.4,Math.min(1.4,pitch));lastX=e.clientX;lastY=e.clientY});
canvas.addEventListener("wheel",e=>{e.preventDefault();zoom*=e.deltaY>0?.9:1.1;zoom=Math.max(.35,Math.min(3,zoom))},{passive:false});
canvas.addEventListener("click",e=>{let hit=null,best=1e9;for(const o of positions){let d=Math.hypot(e.clientX-o.q.x,e.clientY-o.q.y);if(d<o.r+12&&d<best){best=d;hit=o}}if(hit){let p=hit.p;document.getElementById("info").style.display="block";document.getElementById("name").textContent="🪐 "+p[0];document.getElementById("dia").textContent=p[4];document.getElementById("dist").textContent=p[5];document.getElementById("period").textContent=p[6];document.getElementById("moons").textContent=p[7]}});
</script></body></html>

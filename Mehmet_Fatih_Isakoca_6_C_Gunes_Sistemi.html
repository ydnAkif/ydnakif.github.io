<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3 Boyutlu Güneş Sistemi Modeli</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #000;
            color: #fff;
            touch-action: none;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }

        /* Üst kontrol paneli */
        #controls {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            align-items: center;
            background: rgba(0, 20, 40, 0.85);
            backdrop-filter: blur(10px);
            padding: 10px 14px;
            border-radius: 16px;
            border: 1px solid rgba(100, 180, 255, 0.3);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 95vw;
        }
        button {
            background: linear-gradient(135deg, #1a6bff, #0a4ccc);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            min-height: 42px;
            min-width: 42px;
            touch-action: manipulation;
        }
        button:active {
            transform: scale(0.95);
        }
        button.active {
            background: linear-gradient(135deg, #ff4444, #cc2222);
        }
        #speed-control {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #aaddff;
            font-size: 13px;
            white-space: nowrap;
        }
        input[type="range"] {
            width: 90px;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: #334;
            border-radius: 3px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #4af;
            border-radius: 50%;
            cursor: pointer;
        }

        /* Bilgi paneli */
        #info-panel {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            background: rgba(0, 15, 35, 0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(80, 160, 255, 0.4);
            border-radius: 16px;
            padding: 16px 20px;
            max-width: 92vw;
            width: 380px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            display: none;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        #info-panel h2 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #6cf;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #info-panel .close-btn {
            position: absolute;
            top: 10px;
            right: 12px;
            background: transparent;
            border: none;
            color: #aaa;
            font-size: 22px;
            cursor: pointer;
            padding: 4px 8px;
            min-width: auto;
            min-height: auto;
        }
        #info-content {
            font-size: 14px;
            line-height: 1.55;
            color: #ddeeff;
        }
        #info-content p {
            margin: 4px 0;
        }
        #info-content .label {
            color: #8cf;
            font-weight: 600;
        }

        /* Yardım / İpuçları */
        #help {
            position: fixed;
            bottom: 12px;
            right: 12px;
            z-index: 90;
            background: rgba(0,20,40,0.7);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 12px;
            color: #9cf;
            max-width: 160px;
            text-align: center;
            line-height: 1.4;
            pointer-events: none;
        }

        /* Yükleniyor */
        #loading {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            color: #6cf;
            font-size: 18px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #234;
            border-top-color: #4af;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Mobil uyum */
        @media (max-width: 600px) {
            #controls {
                top: 6px;
                padding: 8px 10px;
                gap: 6px;
            }
            button {
                padding: 8px 12px;
                font-size: 13px;
            }
            #speed-control {
                font-size: 12px;
            }
            input[type="range"] {
                width: 70px;
            }
            #info-panel {
                width: 94vw;
                padding: 14px 16px;
                bottom: 12px;
            }
            #help {
                display: none;
            }
        }
    </style>
</head>

        <div id="speed-control">

            <input type="range" id="speed" min="0.1" max="5" step="0.1" value="1">
            <span id="speed-val">1x</span>
        </div>
        <button id="btn-reset">🔄 Sıfırla</button>
    </div>

    <div id="info-panel">

        <h2 id="info-title">Güneş</h2>

        function createStarField() {
            const starGeo = new THREE.BufferGeometry();
            const starCount = 4000;
            const positions = new Float32Array(starCount * 3);
            const colors = new Float32Array(starCount * 3);

            for (let i = 0; i < starCount; i++) {
                const r = 400 + Math.random() * 600;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = r * Math.cos(phi);

                const c = 0.6 + Math.random() * 0.4;
                colors[i * 3] = c;
                colors[i * 3 + 1] = c * (0.9 + Math.random() * 0.1);
                colors[i * 3 + 2] = c * (0.8 + Math.random() * 0.2);
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            starGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const starMat = new THREE.PointsMaterial({
                size: 1.2,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                sizeAttenuation: true
            });
            starField = new THREE.Points(starGeo, starMat);
            scene.add(starField);
        }

            const mat = new THREE.MeshBasicMaterial({
                color: data.color,
                transparent: true
            });
            sunMesh = new THREE.Mesh(geo, mat);
            sunMesh.userData = { type: 'sun', key: 'sun', data: data };
            scene.add(sunMesh);
            clickableObjects.push(sunMesh);

            // Güneş parıltısı
            const glowGeo = new THREE.SphereGeometry(data.radius * 1.4, 32, 32);
            const glowMat = new THREE.MeshBasicMaterial({
                color: 0xff6600,
                transparent: true,
                opacity: 0.25,
                side: THREE.BackSide
            });
            const glow = new THREE.Mesh(glowGeo, glowMat);
            sunMesh.add(glow);

            // Daha büyük dış parıltı
            const outerGlow = new THREE.Mesh(
                new THREE.SphereGeometry(data.radius * 2.2, 32, 32),
                new THREE.MeshBasicMaterial({
                    color: 0xff4400,
                    transparent: true,
                    opacity: 0.08,
                    side: THREE.BackSide
                })
            );
            sunMesh.add(outerGlow);
        }

        function createPlanets() {
            const keys = ['mercury', 'venus', 'earth', 'mars', 'jupiter', 'saturn', 'uranus', 'neptune'];

            keys.forEach(key => {
                const data = PLANET_DATA[key];

                // Gezegen grubu (yörünge için)
                const group = new THREE.Object3D();
                scene.add(group);

                // Gezegen mesh
                const geo = new THREE.SphereGeometry(data.radius, 32, 32);
                const mat = new THREE.MeshStandardMaterial({
                    color: data.color,
                    roughness: 0.7,
                    metalness: 0.1
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.x = data.distance;
                mesh.userData = { type: 'planet', key: key, data: data };
                group.add(mesh);
                clickableObjects.push(mesh);

                // Yörünge çizgisi
                const orbitGeo = new THREE.RingGeometry(data.distance - 0.15, data.distance + 0.15, 128);
                const orbitMat = new THREE.MeshBasicMaterial({
                    color: 0x446688,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.35
                });
                const orbit = new THREE.Mesh(orbitGeo, orbitMat);
                orbit.rotation.x = Math.PI / 2;
                scene.add(orbit);
                orbits.push(orbit);

                // Satürn halkaları
                if (key === 'saturn') {
                    const ringGeo = new THREE.RingGeometry(data.radius * 1.4, data.radius * 2.4, 64);
                    const ringMat = new THREE.MeshBasicMaterial({
                        color: 0xc9b88a,
                        side: THREE.DoubleSide,
                        transparent: true,
                        opacity: 0.75
                    });
                    const ring = new THREE.Mesh(ringGeo, ringMat);
                    ring.rotation.x = Math.PI / 2.3;
                    mesh.add(ring);
                }

                // Uranüs halkaları (ince)
                if (key === 'uranus') {
                    const ringGeo = new THREE.RingGeometry(data.radius * 1.5, data.radius * 1.9, 64);
                    const ringMat = new THREE.MeshBasicMaterial({
                        color: 0x99dddd,
                        side: THREE.DoubleSide,
                        transparent: true,
                        opacity: 0.4
                    });
                    const ring = new THREE.Mesh(ringGeo, ringMat);
                    ring.rotation.x = Math.PI / 2;
                    mesh.add(ring);
                }

                planets[key] = { group, mesh, data, angle: Math.random() * Math.PI * 2 };

                // Uydular
                if (MOON_DATA[key]) {
                    moons[key] = [];
                    MOON_DATA[key].forEach(mData => {
                        const mGroup = new THREE.Object3D();
                        mesh.add(mGroup);

                        const mGeo = new THREE.SphereGeometry(mData.radius, 16, 16);
                        const mMat = new THREE.MeshStandardMaterial({ color: mData.color, roughness: 0.8 });
                        const mMesh = new THREE.Mesh(mGeo, mMat);
                        mMesh.position.x = mData.distance;
                        mMesh.userData = { type: 'moon', name: mData.name, data: mData, parent: key };
                        mGroup.add(mMesh);
                        clickableObjects.push(mMesh);

                        moons[key].push({ group: mGroup, mesh: mMesh, data: mData, angle: Math.random() * Math.PI * 2 });
                    });
                }
            });
        }

        function createAsteroidBelt() {
            const beltGroup = new THREE.Group();
            const count = 1200;
            const geo = new THREE.SphereGeometry(0.15, 4, 4);

            for (let i = 0; i < count; i++) {
                const mat = new THREE.MeshBasicMaterial({
                    color: new THREE.Color().setHSL(0.08, 0.3, 0.3 + Math.random() * 0.3)
                });
                const asteroid = new THREE.Mesh(geo, mat);
                const dist = 85 + Math.random() * 20;
                const angle = Math.random() * Math.PI * 2;
                const y = (Math.random() - 0.5) * 4;
                asteroid.position.set(
                    Math.cos(angle) * dist,
                    y,
                    Math.sin(angle) * dist
                );
                asteroid.scale.setScalar(0.3 + Math.random() * 1.5);
                beltGroup.add(asteroid);
            }
            scene.add(beltGroup);
            asteroidBelt = beltGroup;

            // Asteroit kuşağı bilgi objesi (görünmez tıklanabilir alan)
            const beltInfo = new THREE.Mesh(
                new THREE.TorusGeometry(95, 12, 8, 48),
                new THREE.MeshBasicMaterial({ visible: false })
            );
            beltInfo.rotation.x = Math.PI / 2;
            beltInfo.userData = {
                type: 'asteroid',
                name: "Asteroit Kuşağı",
                data: {
                    info: {
                        tip: "Asteroit Kuşağı",
                        konum: "Mars ile Jüpiter arasında",
                        açıklama: "Güneş Sistemi'nde Mars ve Jüpiter arasında bulunan, milyonlarca kayalık cisimden oluşan bölge. En büyük üyesi Ceres cüce gezegenidir. Toplam kütlesi Ay'ın kütlesinden daha azdır."
                    }
                }
            };
            scene.add(beltInfo);
            clickableObjects.push(beltInfo);
        }

        function createNASACrafts() {
            NASA_CRAFT.forEach(craft => {
                const group = new THREE.Object3D();
                scene.add(group);

                // Basit uzay aracı şekli
                const body = new THREE.Mesh(
                    new THREE.BoxGeometry(craft.size * 1.5, craft.size * 0.4, craft.size * 0.8),
                    new THREE.MeshBasicMaterial({ color: craft.color })
                );
                group.add(body);

                // Anten
                const dish = new THREE.Mesh(
                    new THREE.CircleGeometry(craft.size * 0.6, 16),
                    new THREE.MeshBasicMaterial({ color: 0xaaaaaa, side: THREE.DoubleSide })
                );
                dish.position.set(0, craft.size * 0.5, 0);
                dish.rotation.x = -Math.PI / 3;
                group.add(dish);

                group.position.set(
                    Math.cos(craft.angle) * craft.distance,
                    (Math.random() - 0.5) * 10,
                    Math.sin(craft.angle) * craft.distance
                );

                group.userData = { type: 'nasa', name: craft.name, data: craft };
                // Tıklanabilirlik için body'ye ata
                body.userData = group.userData;
                dish.userData = group.userData;
                clickableObjects.push(body);
                clickableObjects.push(dish);

                nasaObjects.push({ group, data: craft, angle: craft.angle });
            });
        }

        function createBlackHole() {
            const group = new THREE.Object3D();
            group.position.set(-350, 40, -280);
            scene.add(group);

            // Kara delik (siyah küre)
            const bh = new THREE.Mesh(
                new THREE.SphereGeometry(8, 32, 32),
                new THREE.MeshBasicMaterial({ color: 0x000000 })
            );
            group.add(bh);

            // Olay ufku parıltısı
            const disk = new THREE.Mesh(
                new THREE.RingGeometry(9, 22, 64),
                new THREE.MeshBasicMaterial({
                    color: 0xff6600,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.7
                })
            );
            disk.rotation.x = Math.PI / 2.5;
            group.add(disk);

            // İkinci halka
            const disk2 = new THREE.Mesh(
                new THREE.RingGeometry(12, 28, 64),
                new THREE.MeshBasicMaterial({
                    color: 0xff2200,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.35
                })
            );
            disk2.rotation.x = Math.PI / 2.8;
            group.add(disk2);

            bh.userData = {
                type: 'blackhole',
                name: "Kara Delik (Temsili)",
                data: {
                    info: {
                        tip: "Kara Delik",
                        konum: "Samanyolu Galaksisi merkezi (temsili konum)",
                        açıklama: "Kara delikler, ışığın bile kaçamayacağı kadar güçlü yerçekimine sahip gök cisimleridir. Samanyolu'nun merkezinde Sagittarius A* adlı süper kütleli kara delik bulunur. Bu modelde temsili olarak gösterilmiştir. Gerçek kara delikler Güneş Sistemi'nde yoktur."
                    }
                }
            };
            clickableObjects.push(bh);
            blackHole = group;
        }

        // ==================== ETKİLEŞİM ====================
        function onClick(event) {
            event.preventDefault();
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            checkIntersection();
        }

        function onTouchEnd(event) {
            if (event.changedTouches.length === 1) {
                const touch = event.changedTouches[0];
                const rect = renderer.domElement.getBoundingClientRect();
                mouse.x = ((touch.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((touch.clientY - rect.top) / rect.height) * 2 + 1;
                checkIntersection();
            }
        }

        function checkIntersection() {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableObjects, true);

            if (intersects.length > 0) {
                let obj = intersects[0].object;
                // Parent'a bak
                while (obj && !obj.userData.type && obj.parent) {
                    obj = obj.parent;
                }
                if (obj && obj.userData && obj.userData.type) {
                    showInfo(obj.userData);
                }
            }
        }

        function showInfo(userData) {
            const panel = document.getElementById('info-panel');
            const title = document.getElementById('info-title');
            const content = document.getElementById('info-content');

            let name = userData.name || (userData.data && userData.data.name) || 'Bilinmeyen';
            let info = userData.data ? userData.data.info : null;

            if (userData.type === 'planet' || userData.type === 'sun') {
                name = userData.data.name;
                info = userData.data.info;
            } else if (userData.type === 'moon') {
                name = userData.name;
                info = userData.data.info;
            } else if (userData.type === 'nasa') {
                name = userData.name;
                info = userData.data.info;
            } else if (userData.type === 'asteroid' || userData.type === 'blackhole') {
                name = userData.name;
                info = userData.data.info;
            }

            title.textContent = name;

            let html = '';
            if (info) {
                if (info.çap) html += `<p><span class="label">Çap:</span> ${info.çap}</p>`;
                if (info.uzaklık) html += `<p><span class="label">Güneş'e uzaklık:</span> ${info.uzaklık}</p>`;
                if (info.süre) html += `<p><span class="label">Dolanma süresi:</span> ${info.süre}</p>`;
                if (info.uydu) html += `<p><span class="label">Uydu sayısı:</span> ${info.uydu}</p>`;
                if (info.tip) html += `<p><span class="label">Tip:</span> ${info.tip}</p>`;
                if (info.sıcaklık) html += `<p><span class="label">Sıcaklık:</span> ${info.sıcaklık}</p>`;
                if (info.fırlatma) html += `<p><span class="label">Fırlatma:</span> ${info.fırlatma}</p>`;
                if (info.konum) html += `<p><span class="label">Konum:</span> ${info.konum}</p>`;
                if (info.açıklama) html += `<p style="margin-top:10px;">${info.açıklama}</p>`;
            }

            content.innerHTML = html || '<p>Bilgi bulunamadı.</p>';
            panel.style.display = 'block';
        }

        function setupUI() {
            const btnPlay = document.getElementById('btn-play');
            const speedInput = document.getElementById('speed');
            const speedVal = document.getElementById('speed-val');
            const btnReset = document.getElementById('btn-reset');
            const closeInfo = document.getElementById('close-info');

            btnPlay.addEventListener('click', () => {
                isPlaying = !isPlaying;
                btnPlay.textContent = isPlaying ? '⏸ Durdur' : '▶ Başlat';
                btnPlay.classList.toggle('active', isPlaying);
            });

            speedInput.addEventListener('input', () => {
                speedMultiplier = parseFloat(speedInput.value);
                speedVal.textContent = speedMultiplier.toFixed(1) + 'x';
            });

            btnReset.addEventListener('click', () => {
                camera.position.set(80, 60, 120);
                controls.target.set(0, 0, 0);
                controls.update();
            });

            closeInfo.addEventListener('click', () => {
                document.getElementById('info-panel').style.display = 'none';
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ==================== ANİMASYON ====================
        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            if (isPlaying) {
                // Gezegenler
                Object.keys(planets).forEach(key => {
                    const p = planets[key];
                    p.angle += p.data.speed * speedMultiplier * delta * 60;
                    p.group.rotation.y = p.angle;
                    p.mesh.rotation.y += p.data.rotationSpeed * speedMultiplier;
                });

                // Uydular
                Object.keys(moons).forEach(key => {
                    moons[key].forEach(m => {
                        m.angle += m.data.speed * speedMultiplier * delta * 60;
                        m.group.rotation.y = m.angle;
                    });
                });

                // Güneş dönüşü
                if (sunMesh) sunMesh.rotation.y += 0.002 * speedMultiplier;

                // Asteroit kuşağı yavaş dönüş
                if (asteroidBelt) asteroidBelt.rotation.y += 0.0003 * speedMultiplier;

                // Kara delik halkaları
                if (blackHole) {
                    blackHole.children[1].rotation.z += 0.01 * speedMultiplier;
                    blackHole.children[2].rotation.z -= 0.007 * speedMultiplier;
                }

                // NASA araçları yavaş hareket
                nasaObjects.forEach(n => {
                    n.angle += 0.0005 * speedMultiplier * delta * 60;
                    const d = n.data.distance;
                    n.group.position.x = Math.cos(n.angle) * d;
                    n.group.position.z = Math.sin(n.angle) * d;
                });
            }

            controls.update();
            renderer.render(scene, camera);
        }

        // Başlat
        window.addEventListener('load', init);
    </script>
</body>
</html>

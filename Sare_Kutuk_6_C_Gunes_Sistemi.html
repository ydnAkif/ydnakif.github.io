<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Güneş Sistemi Simülasyonu</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome İkonları -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js ve OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #020208;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.6);
        }
        ::-webkit-scrollbar {
            width: 3px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(245, 158, 11, 0.5);
            border-radius: 4px;
        }
    </style>
</head>
<body class="text-white">

    <div id="canvas-container" class="w-full h-full absolute inset-0"></div>

    <div class="absolute top-4 left-4 z-20 w-32 max-w-[calc(100vw-2rem)] glass-panel rounded-xl p-2 border-l-4 border-amber-400 shadow-2xl max-h-[85vh] flex flex-col">
        <div class="flex items-center justify-between mb-1 pb-1 border-b border-slate-700/60">
            <h2 class="text-[10px] font-bold text-amber-300 flex items-center gap-1">
                <i class="fa-solid fa-globe text-[9px]"></i> Gezegenler
            </h2>
        </div>
        <div id="planet-list-container" class="space-y-1 overflow-y-auto pr-1">
            <!-- Dinamik olarak doldurulur -->
        </div>
    </div>

    <div class="absolute bottom-5 left-1/2 -translate-x-1/2 z-10 w-11/12 max-w-xl">
        <div class="glass-panel p-3 md:p-4 rounded-2xl flex flex-wrap md:flex-nowrap items-center justify-between gap-3 text-sm">
            <button id="btn-pause" class="px-4 py-2 bg-amber-500 hover:bg-amber-600 active:scale-95 transition text-slate-950 font-bold rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-amber-500/20 whitespace-nowrap text-xs md:text-sm">
                <i id="icon-pause" class="fa-solid fa-pause"></i>
                <span id="text-pause">Durdur</span>
            </button>

            <div class="flex items-center gap-2 flex-1 px-2 min-w-[140px]">
                <i class="fa-solid fa-gauge-high text-amber-400 text-xs"></i>
                <span class="text-xs font-medium whitespace-nowrap">Hız:</span>
                <input type="range" id="speed-slider" min="0" max="6" step="0.2" value="2.5" 
                      class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-amber-400">
                <span id="speed-val" class="text-xs font-mono text-amber-300 w-8">2.5x</span>
            </div>

            <div class="flex items-center gap-2">
                <button id="btn-toggle-orbits" title="Yörünge Çizgileri" class="p-2 bg-slate-800/80 hover:bg-slate-700 text-amber-300 rounded-xl border border-slate-600/50 transition">
                    <i class="fa-solid fa-circle-notch text-xs"></i>
                </button>
                <button id="btn-reset-cam" title="Kamerayı Sıfırla" class="px-3 py-2 bg-slate-800/80 hover:bg-slate-700 text-gray-200 rounded-xl border border-slate-600/50 text-xs font-medium flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span class="hidden sm:inline">Sıfırla</span>
                </button>
                <button id="btn-fullscreen" title="Tam Ekran" class="p-2 bg-slate-800/80 hover:bg-slate-700 text-gray-200 rounded-xl border border-slate-600/50 transition">
                    <i class="fa-solid fa-expand text-xs"></i>
                </button>
            </div>
        </div>
    </div>

    <div id="info-card" class="hidden absolute top-4 right-4 z-20 w-80 max-w-[calc(100vw-2rem)] glass-panel rounded-2xl p-4 border-t-4 border-cyan-400 transition-all duration-300 max-h-[85vh] overflow-y-auto">
        <div class="flex justify-between items-start mb-2">
            <div>
                <span id="planet-type" class="text-[10px] uppercase tracking-wider font-bold px-2 py-0.5 rounded-full bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">Gezegen</span>
                <h2 id="planet-name" class="text-xl font-extrabold text-white mt-1">Dünya</h2>
            </div>
            <button id="btn-close-card" class="text-gray-400 hover:text-white p-1 rounded-lg hover:bg-slate-800/60">
                <i class="fa-solid fa-xmark text-base"></i>
            </button>
        </div>

        <p id="planet-desc" class="text-[11px] text-gray-300 mb-3 leading-relaxed">Gezegen açıklaması...</p>

        <!-- Güneş Katmanları Özel Görsel Alanı -->
        <div id="sun-layers-container" class="hidden mb-3 rounded-xl overflow-hidden border border-slate-700/60 bg-slate-900/80">
            <img src="https://encrypted-tbn3.gstatic.com/licensed-image?q=tbn:ANd9GcRjcp_OYquHtDo0qvF6v9FcPPjlX-kIgM2PdCw6AMuf86Jw86eBHzxJa5vL5NuInhR2aVPYK0M-nTU_kzw" alt="Güneş Katmanları Diyagramı" class="w-full h-36 object-cover">
            <div class="p-2 text-[10px] text-amber-300 font-medium text-center">Güneş'in İç ve Dış Katmanları (Çekirdek, Radyatif, Konvektif, Fotosfer, Korona)</div>
        </div>

        <div id="standard-info-list" class="space-y-1.5 text-[11px]">
            <div class="flex justify-between p-1.5 rounded-lg bg-slate-800/50 border border-slate-700/40">
                <span class="text-gray-400 flex items-center gap-1.5"><i class="fa-solid fa-ruler-horizontal text-amber-400"></i> Çap:</span>
                <span id="planet-diameter" class="font-semibold text-gray-100">12,742 km</span>
            </div>
            <div class="flex justify-between p-1.5 rounded-lg bg-slate-800/50 border border-slate-700/40">
                <span class="text-gray-400 flex items-center gap-1.5"><i class="fa-solid fa-arrows-left-right text-cyan-400"></i> Güneş'e Uzaklık:</span>
                <span id="planet-distance" class="font-semibold text-gray-100">149.6 milyon km</span>
            </div>
            <div class="flex justify-between p-1.5 rounded-lg bg-slate-800/50 border border-slate-700/40">
                <span class="text-gray-400 flex items-center gap-1.5"><i class="fa-solid fa-rotate text-emerald-400"></i> Dolanma Süresi:</span>
                <span id="planet-period" class="font-semibold text-gray-100">365 Gün (1 Yıl)</span>
            </div>
            <div class="flex justify-between p-1.5 rounded-lg bg-slate-800/50 border border-slate-700/40">
                <span class="text-gray-400 flex items-center gap-1.5"><i class="fa-solid fa-moon text-indigo-400"></i> Uydu Sayısı:</span>
                <span id="planet-moons" class="font-semibold text-gray-100">1</span>
            </div>
        </div>
    </div>

    <script>
        const PLANET_DATA = [
            { id: 'sun', name: 'Güneş', type: 'Yıldız', radius: 20, color: 0xfffaed, baseColorHex: '#fff5d1', distance: 0, speed: 0, spinSpeed: 0.015, spinDir: -1, axialTilt: 7.25, inclination: 0, diameter: '1,392,700 km', sunDistance: '0 km (Merkez)', period: '25 Gün', moons: '8 Gezegen', desc: 'Güneş Sistemi\'mizin merkezindeki, gerçekte parlak beyaz-sarı tonlarında olan G sınıfı ana kol yıldızıdır.', isSun: true },
            { id: 'mercury', name: 'Merkür', type: 'Karasal Gezegen', radius: 1.2, color: 0xb0b0b0, baseColorHex: '#9c9c9c', spotColorHex: '#6e6e6e', distance: 32, speed: 0.15, spinSpeed: 0.005, spinDir: -1, axialTilt: 0.03, inclination: 7.0, orbitDir: -1, diameter: '4,879 km', sunDistance: '57.9 milyon km', period: '88 Gün', moons: '0', desc: 'Güneş\'e en yakın kraterli gezegen.' },
            { id: 'venus', name: 'Venüs', type: 'Karasal Gezegen', radius: 2.0, color: 0xdec17b, baseColorHex: '#d4b268', spotColorHex: '#b89240', distance: 44, speed: 0.11, spinSpeed: 0.002, spinDir: 1, axialTilt: 177.36, inclination: 3.39, orbitDir: -1, diameter: '12,104 km', sunDistance: '108.2 milyon km', period: '225 Gün', moons: '0', desc: 'Güneş etrafında ters yönde dönen sıcak gezegen.' },
            { id: 'earth', name: 'Dünya', type: 'Karasal Gezegen', radius: 2.2, color: 0x2b82c5, baseColorHex: '#1b6ca8', spotColorHex: '#227838', distance: 58, speed: 0.09, spinSpeed: 0.08, spinDir: -1, axialTilt: 23.44, inclination: 0.0, orbitDir: -1, diameter: '12,742 km', sunDistance: '149.6 milyon km', period: '365 Gün', moons: '1 (Ay)', desc: 'Üzerinde yaşam barındıran mavi evimiz.', hasMoon: true },
            { id: 'mars', name: 'Mars', type: 'Karasal Gezegen', radius: 1.5, color: 0xc45532, baseColorHex: '#b54823', spotColorHex: '#7a2811', distance: 70, speed: 0.07, spinSpeed: 0.075, spinDir: -1, axialTilt: 25.19, inclination: 1.85, orbitDir: -1, diameter: '6,779 km', sunDistance: '227.9 milyon km', period: '687 Gün', moons: '2', desc: 'Demir oksitli kızıl gezegen.' },
            { id: 'jupiter', name: 'Jüpiter', type: 'Gaz Devi', radius: 5.5, color: 0xd9b382, baseColorHex: '#c79d68', spotColorHex: '#946638', distance: 100, speed: 0.045, spinSpeed: 0.15, spinDir: -1, axialTilt: 3.13, inclination: 1.30, orbitDir: -1, diameter: '139,820 km', sunDistance: '778.5 milyon km', period: '12 Yıl', moons: '95', desc: 'En büyük gaz devi.' },
            { id: 'saturn', name: 'Satürn', type: 'Gaz Devi', radius: 4.5, color: 0xe8d7b3, baseColorHex: '#dbcca0', spotColorHex: '#b09d71', distance: 125, speed: 0.032, spinSpeed: 0.12, spinDir: -1, axialTilt: 26.73, inclination: 2.49, orbitDir: -1, diameter: '116,460 km', sunDistance: '1.4 milyar km', period: '29 Yıl', moons: '146', desc: 'Görkemli halkaları olan gezegen.', hasRings: true },
            { id: 'uranus', name: 'Uranüs', type: 'Buz Devi', radius: 3.2, color: 0x76c8cb, baseColorHex: '#5db0b5', spotColorHex: '#3a7d82', distance: 150, speed: 0.022, spinSpeed: 0.06, spinDir: -1, axialTilt: 97.77, inclination: 0.77, orbitDir: -1, diameter: '50,724 km', sunDistance: '2.9 milyar km', period: '84 Yıl', moons: '27', desc: 'Neredeyse tamamen yan yatmış buz devi.' },
            { id: 'neptune', name: 'Neptün', type: 'Buz Devi', radius: 3.0, color: 0x3366cc, baseColorHex: '#264da3', spotColorHex: '#142a6b', distance: 175, speed: 0.015, spinSpeed: 0.085, spinDir: -1, axialTilt: 28.32, inclination: 1.77, orbitDir: -1, diameter: '49,244 km', sunDistance: '4.5 milyar km', period: '165 Yıl', moons: '14', desc: 'Şiddetli rüzgarlı en uzak mavi dev.' }
        ];

        let scene, camera, renderer, controls;
        let planetObjects = [];
        let orbitLines = [];
        let asteroidBeltGroup;
        let isPaused = false;
        let simSpeed = 2.5;
        let showOrbits = true;
        let selectedObject = null;
        let followPlanet = false;

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const degToRad = (deg) => deg * (Math.PI / 180);

        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x020208, 0.0008);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1200);
            camera.position.set(0, 80, 220);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.07;
            controls.maxDistance = 500;
            controls.minDistance = 5;

            setupLighting();
            createStarfield();
            createSolarSystem();
            createAsteroidBelt();

            window.addEventListener('resize', onWindowResize);
            renderer.domElement.addEventListener('pointerdown', onPointerDown);

            setupUI();
            setupLeftPlanetList();

            animate();
        }

        function setupLighting() {
            scene.add(new THREE.AmbientLight(0xffffff, 0.1));
            const sunLight = new THREE.PointLight(0xfffaed, 3.8, 1600, 0.25);
            sunLight.position.set(0, 0, 0);
            sunLight.castShadow = true;
            scene.add(sunLight);
        }

        function createStarfield() {
            const count = 3500;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            for (let i = 0; i < count * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 800;
                positions[i + 1] = (Math.random() - 0.5) * 800;
                positions[i + 2] = (Math.random() - 0.5) * 800;
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.PointsMaterial({ size: 0.9, color: 0xffffff, transparent: true, opacity: 0.85 });
            scene.add(new THREE.Points(geometry, material));
        }

        function createProceduralTexture(baseColorHex, spotColorHex, isEarth = false, isJupiter = false, isSun = false) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = baseColorHex;
            ctx.fillRect(0, 0, 512, 512);

            if (isSun) {
                const grad = ctx.createRadialGradient(256, 256, 50, 256, 256, 256);
                grad.addColorStop(0, '#ffffff');
                grad.addColorStop(0.5, '#ffea9f');
                grad.addColorStop(1, '#ffb732');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 512, 512);

                ctx.fillStyle = 'rgba(255, 140, 0, 0.15)';
                for (let i = 0; i < 40; i++) {
                    ctx.beginPath();
                    ctx.arc(Math.random() * 512, Math.random() * 512, 20 + Math.random() * 50, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else if (isEarth) {
                ctx.fillStyle = spotColorHex;
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath();
                    ctx.arc(Math.random() * 512, Math.random() * 512, 10 + Math.random() * 15, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else if (isJupiter) {
                for (let i = 0; i < 20; i++) {
                    ctx.fillStyle = i % 2 === 0 ? spotColorHex : baseColorHex;
                    ctx.fillRect(0, i * 25.6, 512, 25.6);
                }
            }
            return new THREE.CanvasTexture(canvas);
        }

        function createAsteroidBelt() {
            asteroidBeltGroup = new THREE.Group();
            for (let i = 0; i < 600; i++) {
                const radius = 84 + Math.random() * 8;
                const angle = Math.random() * Math.PI * 2;
                const geo = new THREE.DodecahedronGeometry(0.2, 0);
                const mat = new THREE.MeshStandardMaterial({ color: 0x888888 });
                const asteroid = new THREE.Mesh(geo, mat);
                asteroid.position.set(Math.cos(angle) * radius, (Math.random() - 0.5) * 2, Math.sin(angle) * radius);
                asteroidBeltGroup.add(asteroid);
            }
            scene.add(asteroidBeltGroup);
        }

        function createSolarSystem() {
            PLANET_DATA.forEach((data) => {
                if (data.isSun) {
                    const sunGeo = new THREE.SphereGeometry(data.radius, 128, 128);
                    const sunMat = new THREE.MeshBasicMaterial({ 
                        color: data.color, 
                        map: createProceduralTexture(data.baseColorHex, null, false, false, true) 
                    });
                    const sunMesh = new THREE.Mesh(sunGeo, sunMat);
                    sunMesh.rotation.z = degToRad(data.axialTilt);
                    sunMesh.userData = data;

                    const glowGeo = new THREE.SphereGeometry(data.radius * 1.08, 64, 64);
                    const glowMat = new THREE.MeshBasicMaterial({
                        color: 0xffaa22,
                        transparent: true,
                        opacity: 0.25,
                        side: THREE.BackSide
                    });
                    const glowMesh = new THREE.Mesh(glowGeo, glowMat);
                    sunMesh.add(glowMesh);

                    scene.add(sunMesh);
                    planetObjects.push({ mesh: sunMesh, data: data, angle: 0 });
                } else {
                    const orbitGroup = new THREE.Group();
                    orbitGroup.rotation.z = degToRad(data.inclination);
                    scene.add(orbitGroup);

                    const points = [];
                    for (let i = 0; i <= 128; i++) {
                        const theta = (i / 128) * Math.PI * 2;
                        points.push(new THREE.Vector3(Math.cos(theta) * data.distance, 0, Math.sin(theta) * data.distance));
                    }
                    const orbitGeo = new THREE.BufferGeometry().setFromPoints(points);
                    const orbitLine = new THREE.Line(orbitGeo, new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.55 }));
                    orbitGroup.add(orbitLine);
                    orbitLines.push(orbitLine);

                    const geo = new THREE.SphereGeometry(data.radius, 64, 64);
                    const mat = new THREE.MeshStandardMaterial({
                        color: data.color,
                        map: createProceduralTexture(data.baseColorHex, data.spotColorHex, data.id === 'earth', data.id === 'jupiter', false)
                    });
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.castShadow = true; mesh.receiveShadow = true;
                    mesh.rotation.z = degToRad(data.axialTilt);

                    const initialAngle = Math.random() * Math.PI * 2;
                    mesh.position.set(Math.cos(initialAngle) * data.distance, 0, Math.sin(initialAngle) * data.distance);
                    mesh.userData = data;

                    if (data.hasRings) {
                        const ringGeo = new THREE.RingGeometry(data.radius * 1.25, data.radius * 2.7, 128);
                        ringGeo.rotateX(Math.PI / 2);
                        const ringMesh = new THREE.Mesh(ringGeo, new THREE.MeshStandardMaterial({ color: 0xe0c99b, side: THREE.DoubleSide, transparent: true, opacity: 0.95 }));
                        mesh.add(ringMesh);
                    }

                    if (data.hasMoon) {
                        const moonMesh = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 32), new THREE.MeshStandardMaterial({ color: 0x888888 }));
                        moonMesh.position.set(4, 0, 0);
                        mesh.add(moonMesh);
                    }

                    orbitGroup.add(mesh);
                    planetObjects.push({ orbitGroup: orbitGroup, mesh: mesh, data: data, angle: initialAngle });
                }
            });
        }

        function setupUI() {
            document.getElementById('btn-pause').addEventListener('click', () => {
                isPaused = !isPaused;
                document.getElementById('text-pause').innerText = isPaused ? 'Devam Et' : 'Durdur';
                document.getElementById('icon-pause').className = isPaused ? 'fa-solid fa-play' : 'fa-solid fa-pause';
            });
            document.getElementById('speed-slider').addEventListener('input', (e) => {
                simSpeed = parseFloat(e.target.value);
                document.getElementById('speed-val').innerText = simSpeed.toFixed(1) + 'x';
            });
            document.getElementById('btn-toggle-orbits').addEventListener('click', () => {
                showOrbits = !showOrbits;
                orbitLines.forEach(line => line.visible = showOrbits);
            });
            document.getElementById('btn-reset-cam').addEventListener('click', () => {
                followPlanet = false; selectedObject = null;
                document.getElementById('info-card').classList.add('hidden');
                controls.target.set(0, 0, 0); camera.position.set(0, 80, 220);
            });
            document.getElementById('btn-fullscreen').addEventListener('click', () => {
                if (!document.fullscreenElement) document.documentElement.requestFullscreen();
                else document.exitFullscreen();
            });
            document.getElementById('btn-close-card').addEventListener('click', () => {
                document.getElementById('info-card').classList.add('hidden');
                followPlanet = false; selectedObject = null;
            });
        }

        function setupLeftPlanetList() {
            const container = document.getElementById('planet-list-container');
            PLANET_DATA.forEach(planet => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left px-2 py-1 rounded hover:bg-slate-800 text-[10px] text-gray-200 flex items-center justify-between transition";
                btn.innerHTML = `<span>${planet.name}</span> <i class="fa-solid fa-chevron-right text-[8px] text-gray-500"></i>`;
                btn.addEventListener('click', () => {
                    const obj = planetObjects.find(p => p.data.id === planet.id);
                    if (obj) selectPlanet(obj);
                });
                container.appendChild(btn);
            });
        }

        function selectPlanet(obj) {
            selectedObject = obj.mesh; followPlanet = true;
            const card = document.getElementById('info-card');
            card.classList.remove('hidden');
            document.getElementById('planet-name').innerText = obj.data.name;
            document.getElementById('planet-type').innerText = obj.data.type;
            document.getElementById('planet-desc').innerText = obj.data.desc;
            document.getElementById('planet-diameter').innerText = obj.data.diameter;
            document.getElementById('planet-distance').innerText = obj.data.sunDistance;
            document.getElementById('planet-period').innerText = obj.data.period;
            document.getElementById('planet-moons').innerText = obj.data.moons;

            const sunLayersEl = document.getElementById('sun-layers-container');
            if (obj.data.id === 'sun') {
                sunLayersEl.classList.remove('hidden');
            } else {
                sunLayersEl.classList.add('hidden');
            }
        }

        function onPointerDown(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children, true);
            if (intersects.length > 0) {
                let hitMesh = intersects[0].object;
                while (hitMesh.parent && hitMesh.parent !== scene && !hitMesh.userData.id) hitMesh = hitMesh.parent;
                if (hitMesh.userData && hitMesh.userData.id) {
                    const obj = planetObjects.find(p => p.data.id === hitMesh.userData.id);
                    if (obj) selectPlanet(obj);
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = 0.016 * simSpeed;

            if (!isPaused) {
                planetObjects.forEach(obj => {
                    if (!obj.data.isSun) {
                        const orbitDirection = obj.data.orbitDir !== undefined ? obj.data.orbitDir : -1;
                        obj.angle += obj.data.speed * delta * 0.2 * orbitDirection;
                        
                        obj.mesh.position.x = Math.cos(obj.angle) * obj.data.distance;
                        obj.mesh.position.z = Math.sin(obj.angle) * obj.data.distance;
                    }
                    const spinDirection = obj.data.spinDir !== undefined ? obj.data.spinDir : -1;
                    obj.mesh.rotation.y += obj.data.spinSpeed * delta * spinDirection;
                });
                if (asteroidBeltGroup) asteroidBeltGroup.rotation.y -= 0.001 * delta;
            }

            if (followPlanet && selectedObject) {
                const targetPos = new THREE.Vector3();
                selectedObject.getWorldPosition(targetPos);
                controls.target.copy(targetPos);
            }

            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Güneş Sistemi Simülasyonu</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #030712;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #fff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    /* Zaman ve Hız Kontrol Paneli */
    #time-control-panel {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 10px 20px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 15px rgba(56, 189, 248, 0.2);
      z-index: 20;
    }

    .control-btn {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.3);
      color: #f8fafc;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .control-btn:hover {
      background: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    .control-btn.active {
      background: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
    }

    #speed-display {
      font-size: 13px;
      font-weight: bold;
      color: #38bdf8;
      min-width: 65px;
      text-align: center;
    }

    /* 6. Sınıf Seviyesinde Bilgi Paneli */
    #info-box {
      position: absolute;
      top: 20px;
      right: 20px;
      width: min(340px, 90vw);
      background: rgba(15, 23, 42, 0.92);
      border: 2px solid #38bdf8;
      border-radius: 16px;
      color: #fff;
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7), 0 0 20px rgba(56, 189, 248, 0.3);
      display: none;
      backdrop-filter: blur(8px);
      z-index: 30;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #info-box h2 {
      margin: 0 0 12px 0;
      color: #38bdf8;
      font-size: 22px;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    #info-box p {
      margin: 10px 0;
      font-size: 14px;
      line-height: 1.5;
      color: #cbd5e1;
    }

    #info-box strong {
      color: #f8fafc;
    }

    #close-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #94a3b8;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    #close-btn:hover {
      background: rgba(239, 68, 68, 0.8);
      color: #fff;
    }

    #instructions {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 10px 16px;
      border-radius: 20px;
      color: #94a3b8;
      font-size: 13px;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }

    .planet-label {
      position: absolute;
      color: #ffffff;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.5);
      border-radius: 10px;
      pointer-events: none;
      white-space: nowrap;
      transform: translate(-50%, -100%);
      transition: opacity 0.2s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }
  </style>

  <!-- Three.js ve OrbitControls Kütüphaneleri -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="canvas-container"></div>
  <div id="labels-container"></div>

  <!-- Zaman Kontrol Paneli -->
  <div id="time-control-panel">
    <button class="control-btn" id="btn-pause" onclick="togglePause()">
      <span id="pause-icon">⏸️</span> <span id="pause-text">Durdur</span>
    </button>
    <div style="width: 1px; height: 18px; background: rgba(148, 163, 184, 0.3);"></div>
    <button class="control-btn" onclick="setSpeed(0.5, this)">0.5x</button>
    <button class="control-btn active" id="btn-1x" onclick="setSpeed(1, this)">1x</button>
    <button class="control-btn" onclick="setSpeed(2, this)">2x</button>
    <button class="control-btn" onclick="setSpeed(5, this)">5x</button>
    <button class="control-btn" onclick="setSpeed(10, this)">10x</button>
    <span id="speed-display">Hız: 1x</span>
  </div>

  <!-- Detaylı Bilgi Kutusu -->
  <div id="info-box">
    <h2>
      <span id="p-name">Gezegen Adı</span>
      <button id="close-btn" onclick="closeInfo()">✕</button>
    </h2>
    <p><strong>Güneş'e Sırası:</strong> <span id="p-order">-</span></p>
    <p><strong>Ortalama Çapı:</strong> <span id="p-diameter">-</span></p>
    <p><strong>Türü:</strong> <span id="p-type">-</span></p>
    <p><strong>Dönme & Dolanma:</strong> <span id="p-rotation">-</span></p>
    <p><strong>Önemli Bilgi:</strong> <span id="p-fact">-</span></p>
  </div>

  <div id="instructions">💡 Gezegenlere tıklayarak bilgi alabilir, fareyle döndürebilirsin.</div>

  <script>
    // Prosedürel Doku Üreteçleri (Canvas ile Yüksek Kaliteli Yüzeyler)
    function createNoiseTexture(baseColor, detailColor, type = 'planet') {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = baseColor;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (type === 'sun') {
        const grad = ctx.createRadialGradient(512, 256, 50, 512, 256, 512);
        grad.addColorStop(0, '#fff7ed');
        grad.addColorStop(0.2, '#fde047');
        grad.addColorStop(0.6, '#f97316');
        grad.addColorStop(1, '#ea580c');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < 1000; i++) {
          ctx.fillStyle = Math.random() > 0.5 ? '#fef08a' : '#c2410c';
          ctx.beginPath();
          ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 8 + 2, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (type === 'jupiter' || type === 'saturn') {
        for (let y = 0; y < canvas.height; y += 4) {
          const noise = Math.sin(y * 0.05) * 20 + Math.random() * 10;
          ctx.fillStyle = (y % 16 < 8) ? baseColor : detailColor;
          ctx.fillRect(0, y, canvas.width, 6 + noise);
        }
        if (type === 'jupiter') {
          ctx.fillStyle = '#b91c1c';
          ctx.beginPath();
          ctx.ellipse(600, 320, 60, 35, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (type === 'earth') {
        ctx.fillStyle = '#1d4ed8';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#15803d';
        for (let i = 0; i < 40; i++) {
          ctx.beginPath();
          ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 90 + 30, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
        for (let i = 0; i < 30; i++) {
          ctx.beginPath();
          ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 70 + 20, 0, Math.PI * 2);
          ctx.fill();
        }
      } else {
        ctx.fillStyle = detailColor;
        for (let i = 0; i < 1200; i++) {
          ctx.beginPath();
          ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 4 + 1, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      return new THREE.CanvasTexture(canvas);
    }

    // 6. Sınıf Fen Bilimleri Müfredatına Uygun Gezegen ve Güneş Verileri
    const planetData = {
      "Güneş": { order: "Merkezde", diameter: "1.392.700 km", type: "Yıldız", rotation: "Kendi ekseni etrafında saat yönünün tersine döner", fact: "Güneş sisteminin merkezindedir. Tüm gezegenlerin ısı ve ışık kaynağıdır. Çok sıcak gazlardan oluşur." },
      "Merkür": { order: "1. Gezegen", diameter: "4.879 km", type: "Karasal (İç) Gezegen", rotation: "Güneş etrafında ve kendi ekseninde saat yönünün tersine döner", fact: "Güneş'e en yakın ve en küçük gezegendir. Uydusu ve halkası yoktur." },
      "Venüs": { order: "2. Gezegen", diameter: "12.104 km", type: "Karasal (İç) Gezegen", rotation: "Güneş etrafında saat yönünün tersine, kendi ekseni etrafında SAAT YÖNÜNDE döner", fact: "Sera etkisinden dolayı en sıcak gezegendir. Diğer gezegenlerin aksine kendi ekseni etrafında saat yönünde döner." },
      "Dünya": { order: "3. Gezegen", diameter: "12.756 km", type: "Karasal (İç) Gezegen", rotation: "Güneş etrafında ve kendi ekseninde saat yönünün tersine döner", fact: "Üzerinde yaşam olduğu bilinen tek gezegendir. Tek uydusu Ay'dır." },
      "Ay": { order: "Dünya'nın Uydusu", diameter: "3.474 km", type: "Doğal Uydu", rotation: "Dünya etrafında saat yönünün tersine dolanır", fact: "Dünya'nın tek doğal uydusudur. Dünya etrafındaki turunu yaklaşık 27 günde tamamlar." },
      "Mars": { order: "4. Gezegen", diameter: "6.779 km", type: "Karasal (İç) Gezegen", rotation: "Güneş etrafında ve kendi ekseninde saat yönünün tersine döner", fact: "Yüzeyindeki demir oksitten (pas) dolayı 'Kızıl Gezegen' olarak adlandırılır. İki küçük uydusu vardır." },
      "Jüpiter": { order: "5. Gezegen", diameter: "142.984 km", type: "Gazsal (Dış) Gezegen", rotation: "Güneş etrafında ve kendi ekseninde saat yönünün tersine döner", fact: "Güneş sisteminin en büyük gezegenidir. Devasa bir gaz devidir." },
      "Satürn": { order: "6. Gezegen", diameter: "120.536 km", type: "Gazsal (Dış) Gezegen", rotation: "Güneş etrafında ve kendi ekseninde saat yönünün tersine döner", fact: "Buz ve kayalardan oluşan belirgin ve göz alıcı halkalarıyla ünlüdür." },
      "Uranüs": { order: "7. Gezegen", diameter: "51.118 km", type: "Gazsal (Dış) Gezegen", rotation: "Güneş etrafında saat yönünün tersine, YAN YATARAK yuvarlanır", fact: "Yörüngesinde yan yatmış bir varil gibi yuvarlanarak döner. Çok soğuktur." },
      "Neptün": { order: "8. Gezegen", diameter: "49.528 km", type: "Gazsal (Dış) Gezegen", rotation: "Güneş etrafında ve kendi ekseninde saat yönünün tersine döner", fact: "Güneş'e en uzak gezegendir. Atmosferi çok fırtınalı ve mavi renklidir." }
    };

    const container = document.getElementById('canvas-container');
    const labelsContainer = document.getElementById('labels-container');

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxDistance = 200;
    controls.minDistance = 8;
    camera.position.set(0, 45, 85);
    controls.update();

    // Işıklandırma
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const sunLight = new THREE.PointLight(0xffffff, 2.5, 500);
    scene.add(sunLight);

    // Arka Plan Yıldızları
    const starsGeo = new THREE.BufferGeometry();
    const starsCount = 4000;
    const starPositions = new Float32Array(starsCount * 3);
    for (let i = 0; i < starsCount * 3; i++) {
      starPositions[i] = (Math.random() - 0.5) * 600;
    }
    starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.8 });
    const starField = new THREE.Points(starsGeo, starsMat);
    scene.add(starField);

    const interactableObjects = [];
    const labelElements = [];

    function createLabel(name) {
      const div = document.createElement('div');
      div.className = 'planet-label';
      div.innerText = name;
      labelsContainer.appendChild(div);
      return div;
    }

    // Güneş Yapımı
    const sunTexture = createNoiseTexture('#f97316', '#fef08a', 'sun');
    const sunGeo = new THREE.SphereGeometry(4.8, 64, 64);
    const sunMat = new THREE.MeshBasicMaterial({ map: sunTexture });
    const sun = new THREE.Mesh(sunGeo, sunMat);
    sun.name = "Güneş";
    scene.add(sun);
    interactableObjects.push(sun);

    const glowGeo = new THREE.SphereGeometry(5.2, 32, 32);
    const glowMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.25 });
    const glow = new THREE.Mesh(glowGeo, glowMat);
    scene.add(glow);

    labelElements.push({ mesh: sun, element: createLabel("Güneş"), offsetY: 6.0 });

    // Gezegen Yapılandırmaları (Hepsi saat yönünün tersine dolanım - açılar negatif artırılır)
    const planetConfigs = [
      { name: "Merkür", size: 0.6, color: '#9ca3af', detailColor: '#4b5563', dist: 10, speed: 0.025, rotSpeed: 0.005, rotDir: 1, texType: 'planet' },
      { name: "Venüs", size: 0.95, color: '#fde047', detailColor: '#ca8a04', dist: 14, speed: 0.018, rotSpeed: -0.004, rotDir: -1, texType: 'planet' }, // Kendi ekseni saat yönünde
      { name: "Dünya", size: 1.1, color: '#2563eb', detailColor: '#16a34a', dist: 20, speed: 0.014, rotSpeed: 0.015, rotDir: 1, texType: 'earth', hasMoon: true },
      { name: "Mars", size: 0.75, color: '#dc2626', detailColor: '#7f1d1d', dist: 26, speed: 0.011, rotSpeed: 0.012, rotDir: 1, texType: 'planet' },
      { name: "Jüpiter", size: 2.4, color: '#ea580c', detailColor: '#fef08a', dist: 35, speed: 0.007, rotSpeed: 0.025, rotDir: 1, texType: 'jupiter' },
      { name: "Satürn", size: 2.0, color: '#facc15', detailColor: '#854d0e', dist: 45, speed: 0.005, rotSpeed: 0.02, rotDir: 1, texType: 'saturn', ring: true },
      { name: "Uranüs", size: 1.35, color: '#38bdf8', detailColor: '#0284c7', dist: 55, speed: 0.003, rotSpeed: 0.015, rotDir: 1, tilt: Math.PI / 2.1, texType: 'planet' }, // Yan yatmış
      { name: "Neptün", size: 1.25, color: '#1d4ed8', detailColor: '#1e40af', dist: 64, speed: 0.002, rotSpeed: 0.015, rotDir: 1, texType: 'planet' }
    ];

    const planets = [];
    let moonMesh = null;

    planetConfigs.forEach(cfg => {
      const orbitGeo = new THREE.RingGeometry(cfg.dist - 0.08, cfg.dist + 0.08, 128);
      const orbitMat = new THREE.MeshBasicMaterial({ color: 0x334155, side: THREE.DoubleSide, transparent: true, opacity: 0.5 });
      const orbit = new THREE.Mesh(orbitGeo, orbitMat);
      orbit.rotation.x = Math.PI / 2;
      scene.add(orbit);

      const pTex = createNoiseTexture(cfg.color, cfg.detailColor, cfg.texType);
      const pGeo = new THREE.SphereGeometry(cfg.size, 32, 32);
      const pMat = new THREE.MeshStandardMaterial({ map: pTex, roughness: 0.7, metalness: 0.1 });
      const mesh = new THREE.Mesh(pGeo, pMat);
      mesh.name = cfg.name;

      if (cfg.tilt) {
        mesh.rotation.z = cfg.tilt;
      }

      if (cfg.ring) {
        const ringGeo = new THREE.RingGeometry(cfg.size + 0.5, cfg.size + 1.8, 64);
        const ringTex = createNoiseTexture('#eab308', '#713f12', 'saturn');
        const ringMat = new THREE.MeshBasicMaterial({ map: ringTex, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        mesh.add(ring);
      }

      if (cfg.hasMoon) {
        const moonTex = createNoiseTexture('#d1d5db', '#4b5563', 'planet');
        const moonGeo = new THREE.SphereGeometry(0.35, 16, 16);
        const moonMat = new THREE.MeshStandardMaterial({ map: moonTex, roughness: 0.9 });
        moonMesh = new THREE.Mesh(moonGeo, moonMat);
        moonMesh.name = "Ay";
        scene.add(moonMesh);
        interactableObjects.push(moonMesh);
        labelElements.push({ mesh: moonMesh, element: createLabel("Ay"), offsetY: 0.8 });
      }

      scene.add(mesh);
      interactableObjects.push(mesh);
      labelElements.push({ mesh: mesh, element: createLabel(cfg.name), offsetY: cfg.size + 1.2 });

      planets.push({
        mesh: mesh,
        dist: cfg.dist,
        speed: cfg.speed,
        rotSpeed: cfg.rotSpeed,
        rotDir: cfg.rotDir,
        angle: Math.random() * Math.PI * 2,
        hasMoon: !!cfg.hasMoon
      });
    });

    let isPaused = false;
    let speedMultiplier = 1;
    let moonAngle = 0;

    function setSpeed(multiplier, btnElement) {
      speedMultiplier = multiplier;
      document.getElementById('speed-display').innerText = `Hız: ${multiplier}x`;
      document.querySelectorAll('#time-control-panel .control-btn').forEach(btn => {
        if (btn.id !== 'btn-pause') btn.classList.remove('active');
      });
      if (btnElement) btnElement.classList.add('active');
    }

    function togglePause() {
      isPaused = !isPaused;
      document.getElementById('pause-icon').innerText = isPaused ? '▶️' : '⏸️';
      document.getElementById('pause-text').innerText = isPaused ? 'Başlat' : 'Durdur';
      document.getElementById('btn-pause').classList.toggle('active', isPaused);
    }

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    window.addEventListener('click', (event) => {
      if (event.target.closest('#time-control-panel') || event.target.closest('#info-box')) return;

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactableObjects);

      if (intersects.length > 0) {
        const selectedObj = intersects[0].object;
        showInfo(selectedObj.name);
      }
    });

    function showInfo(name) {
      const data = planetData[name];
      if (!data) return;

      document.getElementById('p-name').innerText = name;
      document.getElementById('p-order').innerText = data.order;
      document.getElementById('p-diameter').innerText = data.diameter;
      document.getElementById('p-type').innerText = data.type;
      document.getElementById('p-rotation').innerText = data.rotation;
      document.getElementById('p-fact').innerText = data.fact;

      document.getElementById('info-box').style.display = 'block';
    }

    function closeInfo() {
      document.getElementById('info-box').style.display = 'none';
    }

    const tempV = new THREE.Vector3();
    function updateLabels() {
      labelElements.forEach(item => {
        item.mesh.getWorldPosition(tempV);
        tempV.y += item.offsetY;
        tempV.project(camera);

        const x = (tempV.x * 0.5 + 0.5) * window.innerWidth;
        const y = (-tempV.y * 0.5 + 0.5) * window.innerHeight;

        if (tempV.z > 1.0) {
          item.element.style.opacity = '0';
        } else {
          item.element.style.opacity = '1';
          item.element.style.left = `${x}px`;
          item.element.style.top = `${y}px`;
        }
      });
    }

    function animate() {
      requestAnimationFrame(animate);

      if (!isPaused) {
        sun.rotation.y += 0.002 * speedMultiplier;

        planets.forEach(p => {
          // Güneş etrafında dolanma: saat yönünün tersine (açı azalır)
          p.angle -= p.speed * 0.5 * speedMultiplier;
          p.mesh.position.x = Math.cos(p.angle) * p.dist;
          p.mesh.position.z = Math.sin(p.angle) * p.dist;

          // Kendi ekseni etrafında dönüş (Venüs rotDir = -1 olduğu için ters döner)
          p.mesh.rotation.y += (p.rotSpeed * p.rotDir) * speedMultiplier;

          if (p.hasMoon && moonMesh) {
            moonAngle -= 0.05 * speedMultiplier; // Ay da saat yönünün tersine dolanır
            const moonDist = 2.4;
            moonMesh.position.x = p.mesh.position.x + Math.cos(moonAngle) * moonDist;
            moonMesh.position.z = p.mesh.position.z + Math.sin(moonAngle) * moonDist;
            moonMesh.position.y = p.mesh.position.y + Math.sin(moonAngle * 0.5) * 0.5;
            moonMesh.rotation.y += 0.02 * speedMultiplier;
          }
        });
      }

      controls.update();
      updateLabels();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>

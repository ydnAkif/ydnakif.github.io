<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Güneş Sistemi</title>
<style>
  :root{
    --bg:#000000; --panel:#000000; --text:#ffffff; --line:#555555;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box; color:var(--text);}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;}
  #canvas-wrap{position:fixed;inset:0;}
  canvas{display:block;}
  #hud{
    position:fixed; top:calc(12px + env(safe-area-inset-top,0px)); left:12px; right:12px;
    display:flex; justify-content:space-between; align-items:flex-start; gap:8px;
    pointer-events:none; z-index:10;
  }
  #title{
    background:var(--panel); padding:8px 14px; border-radius:12px; font-size:14px; font-weight:600;
    border:1px solid var(--line); pointer-events:auto;
  }
  #speedbox{
    background:var(--panel); padding:8px 12px; border-radius:12px; font-size:12px;
    border:1px solid var(--line); pointer-events:auto; display:flex; align-items:center; gap:8px;
  }
  #speedbox input{width:70px;}
  #info{
    position:fixed; left:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px)); right:12px;
    max-width:340px; background:var(--panel);
    border:1px solid var(--line); border-radius:14px; padding:14px 16px;
    font-size:13px; line-height:1.5; z-index:20; display:none;
  }
  #info h2{margin:0 0 6px; font-size:16px;}
  #info p{margin:2px 0;}
  #info button{
    margin-top:8px; background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:6px 10px; font-size:12px; font-weight:700; cursor:pointer;
  }
  #legend{
    position:fixed; left:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px));
    display:flex; flex-wrap:wrap; gap:6px; max-width:220px; z-index:9;
  }
  .chip{
    font-size:10px; padding:4px 8px; border-radius:999px; cursor:pointer;
    background:var(--panel); border:1px solid var(--line);
    white-space:nowrap; pointer-events:auto;
  }
  #hint{
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    font-size:12px; text-align:center; pointer-events:none; z-index:5; opacity:0.65;
  }
  /* Zoom buttons */
  #zoomctl{
    position:fixed; right:12px; bottom:calc(12px + env(safe-area-inset-bottom,0px));
    display:flex; flex-direction:column; gap:6px; z-index:15; pointer-events:auto;
  }
  #zoomctl button{
    width:40px; height:40px; border-radius:12px; background:var(--panel); border:1px solid var(--line);
    font-size:20px; font-weight:700; cursor:pointer;
  }
  /* Timeline */
  #timeline{
    position:fixed; right:8px; top:70px; width:64px; z-index:15;
    display:flex; flex-direction:column; align-items:center;
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:8px 4px; pointer-events:auto;
  }
  #timeline-head{display:flex; align-items:center; gap:4px; margin-bottom:6px;}
  #timeline-label{font-size:10px; font-weight:700;}
  #tl-close{
    background:none; border:1px solid var(--line); border-radius:6px; font-size:10px; cursor:pointer; padding:1px 5px;
  }
  #tl-range{ -webkit-appearance:slider-vertical; writing-mode:bt-lr; width:20px; height:140px; margin:4px 0; }
  #tl-year{font-size:12px; font-weight:700;}
  #tl-card{
    position:fixed; right:80px; top:70px; z-index:15; max-width:200px;
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; font-size:12px; line-height:1.4; display:none;
  }
  #tl-card b{font-size:13px;}
  #tl-reopen{
    position:fixed; right:8px; top:70px; z-index:15; display:none;
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:8px; font-size:16px; cursor:pointer; pointer-events:auto;
  }
  #history-btn{
    position:fixed; left:12px; top:calc(60px + env(safe-area-inset-top,0px)); z-index:15;
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:8px 12px; font-size:12px; cursor:pointer; pointer-events:auto;
  }
  #history-card{
    position:fixed; left:12px; top:calc(105px + env(safe-area-inset-top,0px)); z-index:20;
    max-width:300px; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:14px; font-size:13px; line-height:1.5; display:none;
  }
  #history-card button{
    margin-top:8px; background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:6px 10px; font-size:12px; font-weight:700; cursor:pointer;
  }
  @media (max-width:480px){
    #timeline{width:48px;}
    #tl-card{max-width:160px; right:58px;}
  }
</style>
</head>
<body>
<div id="canvas-wrap"></div>

<div id="hud">
  <div id="title">🪐 3D Güneş Sistemi</div>
  <div id="speedbox">Hız <input id="speed" type="range" min="0" max="5" step="0.1" value="1"></div>
</div>

<div id="hint">Sürükle: döndür · Kaydır/çimdikle: yakınlaş · Bir gezegene dokun: bilgi al</div>

<button id="history-btn">🚀 Uzay Tarihi</button>
<div id="history-card">
  <div id="history-text"></div>
  <button id="history-next">Diğer bilgi →</button>
</div>

<div id="timeline">
  <div id="timeline-head">
    <span id="timeline-label">1945–2026</span>
    <button id="tl-close">✕</button>
  </div>
  <input id="tl-range" type="range" min="1945" max="2026" value="1957" step="1" orient="vertical">
  <div id="tl-year">1957</div>
</div>
<button id="tl-reopen">🕒</button>
<div id="tl-card"></div>

<div id="zoomctl">
  <button id="zoom-in">+</button>
  <button id="zoom-out">−</button>
</div>

<div id="legend"></div>
<div id="info">
  <h2 id="info-name"></h2>
  <p id="info-fact1"></p>
  <p id="info-fact2"></p>
  <p id="info-fact3"></p>
  <p id="info-temp"></p>
  <button onclick="document.getElementById('info').style.display='none'">Kapat</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const wrap = document.getElementById('canvas-wrap');
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 5000);
  camera.position.set(0, 90, 210);

  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  wrap.appendChild(renderer.domElement);

  // Stars
  const starGeo = new THREE.BufferGeometry();
  const starCount = 1500;
  const starPos = new Float32Array(starCount*3);
  for(let i=0;i<starCount;i++){
    const r = 800 + Math.random()*1200;
    const theta = Math.random()*Math.PI*2;
    const phi = Math.acos((Math.random()*2)-1);
    starPos[i*3] = r*Math.sin(phi)*Math.cos(theta);
    starPos[i*3+1] = r*Math.cos(phi);
    starPos[i*3+2] = r*Math.sin(phi)*Math.sin(theta);
  }
  starGeo.setAttribute('position', new THREE.BufferAttribute(starPos,3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color:0xffffff, size:1.3})));

  scene.add(new THREE.AmbientLight(0x404060, 1.1));
  const sunLight = new THREE.PointLight(0xffffff, 2.2, 3000);
  scene.add(sunLight);

  // ---- Procedural realistic-ish texture generator ----
  function makePlanetTexture(baseColor, opts){
    opts = opts || {};
    const c = new THREE.Color(baseColor);
    const size = 256;
    const cvs = document.createElement('canvas');
    cvs.width = size; cvs.height = size;
    const ctx = cvs.getContext('2d');
    ctx.fillStyle = '#'+c.getHexString();
    ctx.fillRect(0,0,size,size);
    const bands = opts.bands || 0;
    for(let b=0; b<bands; b++){
      const y = Math.random()*size;
      const h = 6 + Math.random()*18;
      const shade = (Math.random()-0.5)*0.28;
      const bc = c.clone().offsetHSL(0,0,shade);
      ctx.fillStyle = 'rgba('+Math.round(bc.r*255)+','+Math.round(bc.g*255)+','+Math.round(bc.b*255)+','+(0.4+Math.random()*0.3)+')';
      ctx.fillRect(0,y,size,h);
    }
    const specks = opts.specks || 400;
    for(let i=0;i<specks;i++){
      const x = Math.random()*size, y = Math.random()*size;
      const r = 1 + Math.random()*(opts.craterSize||3);
      const shade = (Math.random()-0.5)*0.32;
      const sc = c.clone().offsetHSL(0,0,shade);
      ctx.fillStyle = 'rgba('+Math.round(sc.r*255)+','+Math.round(sc.g*255)+','+Math.round(sc.b*255)+','+(0.28+Math.random()*0.35)+')';
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    }
    if(opts.continents){
      for(let i=0;i<opts.continents;i++){
        const x = Math.random()*size, y = Math.random()*size;
        const r = 12 + Math.random()*28;
        const gc = new THREE.Color(0x2f7d4f);
        ctx.fillStyle = 'rgba('+Math.round(gc.r*255)+','+Math.round(gc.g*255)+','+Math.round(gc.b*255)+',0.55)';
        ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
      }
    }
    if(opts.clouds){
      for(let i=0;i<40;i++){
        const x = Math.random()*size, y = Math.random()*size;
        const r = 8 + Math.random()*22;
        const grad = ctx.createRadialGradient(x,y,0,x,y,r);
        grad.addColorStop(0,'rgba(255,255,255,0.3)');
        grad.addColorStop(1,'rgba(255,255,255,0)');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
      }
    }
    if(opts.iceCaps){
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.ellipse(size/2, 8, size/2, 12, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(size/2, size-8, size/2, 12, 0, 0, Math.PI*2); ctx.fill();
    }
    const tex = new THREE.CanvasTexture(cvs);
    tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.ClampToEdgeWrapping;
    return tex;
  }

  const sunTex = makePlanetTexture(0xffcc55, {specks:250, craterSize:6, bands:8});
  const sun = new THREE.Mesh(new THREE.SphereGeometry(12,32,32), new THREE.MeshBasicMaterial({map:sunTex}));
  scene.add(sun);
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(15,32,32), new THREE.MeshBasicMaterial({color:0xffaa33, transparent:true, opacity:0.25})));

  const planetData = [
    {name:"Merkür", color:0xb1adad, size:1.6, dist:22, speed:4.15, tex:{specks:600,craterSize:2.5},
      f1:"Güneşe en yakın gezegendir.", f2:"Bir yılı sadece 88 gün sürer.", f3:"Atmosferi neredeyse yoktur.",
      temp:"🔥 Gündüz ~430°C / ❄️ Gece ~-180°C"},
    {name:"Venüs", color:0xe6c27a, size:2.4, dist:32, speed:1.62, tex:{bands:10,specks:100},
      f1:"Güneş sisteminin en sıcak gezegenidir.", f2:"Kalın bulutlarla kaplıdır.", f3:"Kendi ekseninde ters yönde döner.",
      temp:"🔥 Ortalama ~465°C (sürekli sıcak)"},
    {name:"Dünya", color:0x3a7bd5, size:2.6, dist:44, speed:1, tex:{specks:250,craterSize:6,clouds:true,continents:9,iceCaps:true},
      f1:"Yaşamın bilinen tek evi!", f2:"Yüzeyinin %70'i su ile kaplıdır.", f3:"Bir uydusu vardır: Ay.",
      temp:"🌡️ Ortalama ~15°C"},
    {name:"Mars", color:0xc1440e, size:2.0, dist:58, speed:0.53, tex:{specks:450,craterSize:4,iceCaps:true},
      f1:"'Kızıl Gezegen' olarak bilinir.", f2:"Yüzeyi demir oksitten (pas) dolayı kırmızıdır.", f3:"En büyük yanardağa sahiptir: Olympus Mons.",
      temp:"❄️ Ortalama ~-65°C"},
    {name:"Jüpiter", color:0xd8ac7a, size:7.5, dist:85, speed:0.084, tex:{bands:18,specks:80},
      f1:"En büyük gezegendir.", f2:"Ünlü Büyük Kırmızı Leke dev bir fırtınadır.", f3:"79'dan fazla uydusu vardır.",
      temp:"❄️ Bulut üstü ~-110°C"},
    {name:"Satürn", color:0xead6a1, size:6.5, dist:115, speed:0.034, ring:true, tex:{bands:16,specks:60},
      f1:"Muhteşem halkalarıyla tanınır.", f2:"Halkaları buz ve kayadan oluşur.", f3:"Suda yüzebilecek kadar hafiftir!",
      temp:"❄️ Ortalama ~-140°C"},
    {name:"Uranüs", color:0x9fe0e6, size:4.2, dist:145, speed:0.012, tex:{bands:6,specks:40},
      f1:"Yan yatarak döner.", f2:"Rengini metan gazına borçludur.", f3:"Buz devi olarak sınıflandırılır.",
      temp:"❄️ Ortalama ~-195°C"},
    {name:"Neptün", color:0x3d5ce0, size:4.0, dist:170, speed:0.006, tex:{bands:10,specks:60,clouds:true},
      f1:"Güneşe en uzak gezegendir.", f2:"En güçlü rüzgarlara sahiptir.", f3:"Bir yılı 165 Dünya yılı sürer.",
      temp:"❄️ Ortalama ~-200°C (en soğuk)"}
  ];

  const planets = [];
  const clickable = [];

  planetData.forEach(p=>{
    const orbitPts = [];
    for(let i=0;i<=128;i++){
      const a = (i/128)*Math.PI*2;
      orbitPts.push(new THREE.Vector3(Math.cos(a)*p.dist, 0, Math.sin(a)*p.dist));
    }
    const orbitGeo = new THREE.BufferGeometry().setFromPoints(orbitPts);
    scene.add(new THREE.Line(orbitGeo, new THREE.LineBasicMaterial({color:0x445088, transparent:true, opacity:0.4})));

    const tex = makePlanetTexture(p.color, p.tex);
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(p.size, 32, 32),
      new THREE.MeshStandardMaterial({map:tex, roughness:0.85, metalness:0.05})
    );
    mesh.userData = p;
    scene.add(mesh);
    clickable.push(mesh);

    if(p.ring){
      const ringTex = makePlanetTexture(0xd8c79a, {bands:20, specks:0});
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(p.size*1.4, p.size*2.3, 48),
        new THREE.MeshBasicMaterial({map:ringTex, side:THREE.DoubleSide, transparent:true, opacity:0.85})
      );
      ring.rotation.x = Math.PI/2 - 0.4;
      mesh.add(ring);
    }
    planets.push({mesh, angle:Math.random()*Math.PI*2, dist:p.dist, speed:p.speed});
  });

  // ---- Asteroid belt (between Mars ~58 and Jupiter ~85) ----
  const beltGroup = new THREE.Group();
  scene.add(beltGroup);
  const asteroidGeo = new THREE.DodecahedronGeometry(0.5, 0);
  const asteroidMat = new THREE.MeshStandardMaterial({color:0x8a8378, roughness:1});
  const asteroidCount = 260;
  const asteroidMesh = new THREE.InstancedMesh(asteroidGeo, asteroidMat, asteroidCount);
  const dummy = new THREE.Object3D();
  for(let i=0;i<asteroidCount;i++){
    const a = Math.random()*Math.PI*2;
    const r = 66 + Math.random()*14;
    const y = (Math.random()-0.5)*3;
    dummy.position.set(Math.cos(a)*r, y, Math.sin(a)*r);
    const s = 0.4 + Math.random()*1.1;
    dummy.scale.set(s,s,s);
    dummy.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
    dummy.updateMatrix();
    asteroidMesh.setMatrixAt(i, dummy.matrix);
  }
  beltGroup.add(asteroidMesh);

  const legend = document.getElementById('legend');
  planetData.forEach((p)=>{
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = p.name;
    chip.onclick = ()=>showInfo(p);
    legend.appendChild(chip);
  });

  function showInfo(p){
    document.getElementById('info-name').textContent = p.name;
    document.getElementById('info-fact1').textContent = "• " + p.f1;
    document.getElementById('info-fact2').textContent = "• " + p.f2;
    document.getElementById('info-fact3').textContent = "• " + p.f3;
    document.getElementById('info-temp').textContent = p.temp;
    document.getElementById('info').style.display = 'block';
  }

  // ---- Camera controls ----
  let isDown=false, lastX=0, lastY=0;
  let camTheta = 0.9, camPhi = 1.1, camDist = 210;
  function updateCamera(){
    camPhi = Math.max(0.15, Math.min(Math.PI-0.15, camPhi));
    camDist = Math.max(12, Math.min(700, camDist));
    camera.position.x = camDist * Math.sin(camPhi) * Math.cos(camTheta);
    camera.position.y = camDist * Math.cos(camPhi);
    camera.position.z = camDist * Math.sin(camPhi) * Math.sin(camTheta);
    camera.lookAt(0,0,0);
  }
  updateCamera();

  const dom = renderer.domElement;
  dom.addEventListener('pointerdown', e=>{isDown=true; lastX=e.clientX; lastY=e.clientY;});
  window.addEventListener('pointerup', ()=>isDown=false);
  window.addEventListener('pointermove', e=>{
    if(!isDown) return;
    camTheta -= (e.clientX-lastX)*0.005;
    camPhi -= (e.clientY-lastY)*0.005;
    lastX=e.clientX; lastY=e.clientY;
    updateCamera();
  });
  dom.addEventListener('wheel', e=>{
    camDist += e.deltaY*0.25;
    updateCamera();
  }, {passive:true});

  // Pinch-to-zoom for touch devices
  let pinchDist = null;
  dom.addEventListener('touchmove', e=>{
    if(e.touches.length===2){
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.sqrt(dx*dx+dy*dy);
      if(pinchDist!==null){
        camDist -= (dist - pinchDist)*0.4;
        updateCamera();
      }
      pinchDist = dist;
    }
  }, {passive:true});
  dom.addEventListener('touchend', e=>{ if(e.touches.length<2) pinchDist=null; });

  document.getElementById('zoom-in').addEventListener('click', ()=>{camDist -= 25; updateCamera();});
  document.getElementById('zoom-out').addEventListener('click', ()=>{camDist += 25; updateCamera();});

  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  dom.addEventListener('click', e=>{
    const dx = Math.abs(e.clientX-lastX), dy = Math.abs(e.clientY-lastY);
    if(dx>5||dy>5) return;
    mouse.x = (e.clientX/window.innerWidth)*2-1;
    mouse.y = -(e.clientY/window.innerHeight)*2+1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(clickable);
    if(hits.length) showInfo(hits[0].object.userData);
  });

  const speedSlider = document.getElementById('speed');
  window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  function animate(){
    requestAnimationFrame(animate);
    const speed = parseFloat(speedSlider.value);
    sun.rotation.y -= 0.002;
    planets.forEach(p=>{
      p.angle -= 0.01 * p.speed * speed;
      p.mesh.position.x = Math.cos(p.angle)*p.dist;
      p.mesh.position.z = Math.sin(p.angle)*p.dist;
      p.mesh.rotation.y -= 0.02;
    });
    beltGroup.rotation.y -= 0.0006 * speed;
    renderer.render(scene, camera);
  }
  animate();

  // ---- Timeline ----
  const satEvents = [
    {y:1944, t:"V-2 Roketi", d:"İkinci Dünya Savaşı'nda test edilen V-2, uzayın sınırına ulaşan ilk insan yapımı nesne oldu."},
    {y:1957, t:"Sputnik 1", d:"SSCB'nin fırlattığı ilk yapay Dünya uydusu. Uzay Çağı başladı."},
    {y:1957, t:"Sputnik 2", d:"Laika adlı köpeği taşıyan, yörüngeye canlı gönderen ilk uydu."},
    {y:1958, t:"Explorer 1", d:"ABD'nin fırlattığı ilk yapay uydu."},
    {y:1958, t:"NASA kuruldu", d:"Amerika'nın uzay ajansı resmen kuruldu."},
    {y:1961, t:"Vostok 1", d:"Yuri Gagarin, uzaya çıkan ilk insan oldu."},
    {y:1962, t:"Telstar 1", d:"İlk aktif iletişim uydusu; canlı TV yayınını mümkün kıldı."},
    {y:1969, t:"Apollo 11", d:"İnsanlık ilk kez Ay'a ayak bastı."},
    {y:1971, t:"Salyut 1", d:"Dünyanın ilk uzay istasyonu yörüngeye oturtuldu."},
    {y:1975, t:"Apollo-Soyuz", d:"ABD ve SSCB'nin ortak uzay görevi."},
    {y:1977, t:"Voyager 1 ve 2", d:"Dış gezegenleri incelemek için fırlatıldı."},
    {y:1981, t:"STS-1 (Uzay Mekiği)", d:"NASA'nın ilk tekrar kullanılabilir mekiği uçtu."},
    {y:1990, t:"Hubble Teleskobu", d:"Yörüngeye yerleştirilen ünlü teleskop."},
    {y:1998, t:"Uluslararası Uzay İstasyonu", d:"İlk modülü fırlatıldı."},
    {y:2003, t:"Shenzhou 5", d:"Çin, insanlı ilk uzay görevini gerçekleştirdi."},
    {y:2008, t:"SpaceX Falcon 1", d:"Özel bir şirketin yörüngeye ulaşan ilk roketi."},
    {y:2012, t:"Curiosity", d:"Mars gezgin robotu keşfe başladı."},
    {y:2019, t:"Starlink başladı", d:"SpaceX internet uydu ağını fırlatmaya başladı."},
    {y:2020, t:"Crew Dragon", d:"SpaceX, ISS'ye astronot taşıyan ilk özel şirket oldu."},
    {y:2021, t:"James Webb Teleskobu", d:"Hubble'ın halefi dev teleskop fırlatıldı."},
    {y:2023, t:"Chandrayaan-3", d:"Hindistan, Ay'ın güney kutbuna iniş yaptı."},
    {y:2026, t:"Günümüz", d:"Binlerce uydu Dünya yörüngesinde dönüyor."}
  ];
  const tlRange = document.getElementById('tl-range');
  const tlYear = document.getElementById('tl-year');
  const tlCard = document.getElementById('tl-card');
  function nearestEvent(year){
    let best=satEvents[0], bd=Infinity;
    satEvents.forEach(ev=>{const d=Math.abs(ev.y-year); if(d<bd){bd=d; best=ev;}});
    return best;
  }
  function updateTimeline(){
    const year = parseInt(tlRange.value,10);
    tlYear.textContent = year;
    const ev = nearestEvent(year);
    tlCard.innerHTML = "<b>"+ev.y+" — "+ev.t+"</b><br>"+ev.d;
  }
  tlRange.addEventListener('input', updateTimeline);
  updateTimeline();

  const timelineEl = document.getElementById('timeline');
  const tlReopen = document.getElementById('tl-reopen');
  document.getElementById('tl-close').addEventListener('click', ()=>{
    timelineEl.style.display='none'; tlCard.style.display='none'; tlReopen.style.display='block';
  });
  tlReopen.addEventListener('click', ()=>{
    timelineEl.style.display='flex'; tlCard.style.display='block'; tlReopen.style.display='none';
  });
  tlCard.style.display = 'block';

  // ---- History button ----
  const historyFacts = [
    "Biliyor muydunuz? İlk uzaya çıkan nesne, İkinci Dünya Savaşı'nda test edilen bir V-2 roketiydi.",
    "Biliyor muydunuz? 1945–1991 yılları arasında Sovyetler Birliği ile Amerika Birleşik Devletleri arasında 'Uzay Yarışı' adında büyük bir rekabet yaşandı."
  ];
  let historyIndex = 0;
  const historyBtn = document.getElementById('history-btn');
  const historyCard = document.getElementById('history-card');
  const historyText = document.getElementById('history-text');
  historyBtn.addEventListener('click', ()=>{ historyIndex=0; historyText.textContent=historyFacts[0]; historyCard.style.display='block'; });
  document.getElementById('history-next').addEventListener('click', ()=>{
    historyIndex = (historyIndex+1)%historyFacts.length;
    historyText.textContent = historyFacts[historyIndex];
  });
})();
</script>
</body>
</html>

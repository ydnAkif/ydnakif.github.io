<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>3D Güneş Sistemi - Büyük Meteorlar ve Asteroit Kuşağı</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #ui {
            position: absolute; top: 10px; left: 10px; color: white;
            background: rgba(0,0,0,0.85); padding: 15px; border-radius: 8px; z-index: 100;
            width: 200px;
        }
        button, input { margin: 4px 0; cursor: pointer; width: 100%; }
        .nav-btn { background: #00ffcc; color: #000; border: none; padding: 6px; border-radius: 4px; font-weight: bold; }
        .nav-btn:hover { background: #00cca3; }
        
        #info {
            position: absolute; bottom: 20px; right: 20px; color: white;
            background: rgba(0,0,0,0.9); padding: 20px; border-radius: 10px; display: none; width: 340px; z-index: 100;
            border: 2px solid #ffaa00; box-shadow: 0 0 20px rgba(255, 170, 0, 0.5);
        }
        #info h2 { margin-top: 0; color: #ffaa00; font-size: 18px; }
        .layer-btn {
            display: block; width: 100%; background: #222; color: #00ffcc; border: 1px solid #00ffcc;
            padding: 8px; margin: 6px 0; border-radius: 5px; cursor: pointer; text-align: left; font-weight: bold; font-size: 13px;
        }
        .layer-btn:hover { background: #00ffcc; color: #000; }
        #layerDetail { background: rgba(255,255,255,0.1); padding: 10px; border-radius: 5px; margin-top: 10px; font-size: 13px; min-height: 45px; }
        .close-btn { background: #ff4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-top: 12px; width: 100%; font-weight: bold; }
    </style>
</head>
<body>
    <div id="ui">
        <h3>Kontroller</h3>
        <button id="toggleBtn" style="background:#444; color:white; border:none; padding:6px; border-radius:4px;">Durdur / Başlat</button>
        <label style="font-size:12px;">Hız: <input type="range" id="speedRange" min="0" max="3" step="0.1" value="1"></label>
        <hr style="border-color:#444;">
        <p style="font-size:11px; margin:2px 0;"><b>Gezegene Git & Kesit Aç:</b></p>
        <button class="nav-btn" onclick="focusOnBody('Genel')">Geniş Açı (Genel)</button>
        <button class="nav-btn" onclick="focusOnBody('Güneş')">Güneş</button>
        <button class="nav-btn" onclick="focusOnBody('Merkür')">Merkür</button>
        <button class="nav-btn" onclick="focusOnBody('Venüs')">Venüs</button>
        <button class="nav-btn" onclick="focusOnBody('Dünya')">Dünya</button>
        <button class="nav-btn" onclick="focusOnBody('Ay')">Ay</button>
        <button class="nav-btn" onclick="focusOnBody('Mars')">Mars</button>
        <button class="nav-btn" onclick="focusOnBody('Jüpiter')">Jüpiter</button>
        <button class="nav-btn" onclick="focusOnBody('Satürn')">Satürn</button>
        <button class="nav-btn" onclick="focusOnBody('Uranüs')">Uranüs</button>
        <button class="nav-btn" onclick="focusOnBody('Neptün')">Neptün</button>
    </div>

    <!-- Sağ alttaki detay paneli -->
    <div id="info">
        <h2 id="objName"></h2>
        <p id="objMeta"></p>
        <p style="font-size: 13px; margin-bottom: 5px;"><b>Katmanları İncele:</b></p>
        <div id="layerButtons"></div>
        <div id="layerDetail">Bir katmana tıkla.</div>
        <button class="close-btn" onclick="resetView()">Kesiti Kapat</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene = new THREE.Scene();
        let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);

        let renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        let controls = new THREE.OrbitControls(camera, renderer.domElement);
        camera.position.set(0, 80, 140);
        controls.update();

        let ambientLight = new THREE.AmbientLight(0x555555);
        scene.add(ambientLight);
        let sunLight = new THREE.PointLight(0xffffff, 2, 600);
        scene.add(sunLight);

        // --- Dairesel Yıldızlar ---
        function createStarTexture() {
            let canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            let ctx = canvas.getContext('2d');
            let gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.3, 'rgba(255,255,255,0.8)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        let starsGeo = new THREE.BufferGeometry();
        let starPos = [];
        for (let i = 0; i < 2000; i++) {
            starPos.push((Math.random() - 0.5) * 900, (Math.random() - 0.5) * 900, (Math.random() - 0.5) * 900);
        }
        starsGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
        let starsMat = new THREE.PointsMaterial({ 
            color: 0xffffff, 
            size: 2.5, 
            map: createStarTexture(), 
            transparent: true, 
            blending: THREE.AdditiveBlending,
            depthWrite: false 
        });
        scene.add(new THREE.Points(starsGeo, starsMat));

        function createTextSprite(message, scaleFactor = 1) {
            let canvas = document.createElement('canvas');
            let ctx = canvas.getContext('2d');
            ctx.font = 'Bold 24px Arial';
            let metrics = ctx.measureText(message);
            canvas.width = metrics.width + 20; canvas.height = 40;
            ctx.font = 'Bold 24px Arial'; ctx.fillStyle = 'white'; ctx.textAlign = 'center';
            ctx.fillText(message, canvas.width / 2, 30);
            let texture = new THREE.CanvasTexture(canvas);
            let sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true }));
            sprite.scale.set(4 * scaleFactor, 2 * scaleFactor, 1);
            return sprite;
        }

        let celestialBodies = [];
        let activeBody = null;
        let targetFocus = null;

        // --- GÜNEŞ ---
        let sunGroup = new THREE.Group();
        scene.add(sunGroup);

        let sunData = {
            name: "Güneş", diameter: "1,392,700 km", sunDist: "Merkez",
            layers: [
                { name: "Çekirdek", radius: 1.8, color: 0xffffff, info: "Nükleer füzyonun merkezi, 15 milyon derece." },
                { name: "Işıma Katmanı", radius: 3.3, color: 0xffcc00, info: "Enerjinin ışınlarla yayıldığı katman." },
                { name: "Taşınım Katmanı", radius: 4.8, color: 0xff6600, info: "Isınan gazların yükseldiği katman." },
                { name: "Fotosfer", radius: 6.0, color: 0xcc3300, info: "Güneş'in görünen dış yüzeyi." }
            ]
        };

        let normalSunGeo = new THREE.SphereGeometry(6, 32, 32);
        let normalSunMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
        let normalSunMesh = new THREE.Mesh(normalSunGeo, normalSunMat);
        sunGroup.add(normalSunMesh);

        let layeredSunGroup = new THREE.Group();
        layeredSunGroup.visible = false;
        sunGroup.add(layeredSunGroup);

        sunData.layers.forEach(l => {
            let geo = new THREE.SphereGeometry(l.radius, 32, 32, 0, 4.7, 0, Math.PI);
            let mat = new THREE.MeshStandardMaterial({ color: l.color, side: THREE.DoubleSide, roughness: 0.4 });
            layeredSunGroup.add(new THREE.Mesh(geo, mat));
        });

        let sunSprite = createTextSprite("Güneş");
        sunSprite.position.set(0, 8, 0);
        sunGroup.add(sunSprite);

        celestialBodies.push({ name: "Güneş", group: sunGroup, normalMesh: normalSunMesh, layeredGroup: layeredSunGroup, data: sunData, size: 6 });

        // --- GEZEGENLER ---
        const planetDatas = [
            {
                name: "Merkür", size: 0.8, distance: 12, speed: 0.04, rotSpeed: 0.08, color: 0x888888, diameter: "4,879 km", sunDist: "58 mil. km",
                layers: [{ name: "Metal Çekirdek", radius: 0.3, color: 0xffffff, info: "Demir merkez." }, { name: "Manto", radius: 0.55, color: 0xaaaaaa, info: "Silikat tabaka." }, { name: "Kabuk", radius: 0.8, color: 0x555555, info: "Kraterli dış yüzey." }]
            },
            {
                name: "Venüs", size: 1.2, distance: 18, speed: 0.015, rotSpeed: -0.06, color: 0xe3bb76, diameter: "12,104 km", sunDist: "108 mil. km",
                layers: [{ name: "Çekirdek", radius: 0.4, color: 0xffffff, info: "Demir ve kaya." }, { name: "Manto", radius: 0.8, color: 0xd4a373, info: "Sıcak iç kaya." }, { name: "Atmosfer", radius: 1.2, color: 0xe3bb76, info: "Sülfürik asit bulutları." }]
            },
            {
                name: "Dünya", size: 1.3, distance: 25, speed: 0.01, rotSpeed: 0.1, color: 0x2233ff, diameter: "12,742 km", sunDist: "150 mil. km",
                layers: [{ name: "İç Çekirdek", radius: 0.3, color: 0xffffff, info: "Katı demir." }, { name: "Dış Çekirdek", radius: 0.55, color: 0xffaa00, info: "Sıvı metal." }, { name: "Manto", radius: 0.95, color: 0xff4400, info: "Magma tabakası." }, { name: "Kabuk & Su", radius: 1.3, color: 0x2233ff, info: "Okyanuslar ve yaşam." }]
            },
            {
                name: "Mars", size: 1.0, distance: 32, speed: 0.008, rotSpeed: 0.09, color: 0xcc4400, diameter: "6,779 km", sunDist: "228 mil. km",
                layers: [{ name: "Çekirdek", radius: 0.35, color: 0xffffff, info: "Demir ve sülfür." }, { name: "Manto", radius: 0.7, color: 0xaa5522, info: "Kayalık tabaka." }, { name: "Kızıl Kabuk", radius: 1.0, color: 0xcc4400, info: "Pas tozu yüzey." }]
            },
            {
                name: "Jüpiter", size: 2.3, distance: 43, speed: 0.005, rotSpeed: 0.15, color: 0xd4a373, diameter: "139,820 km", sunDist: "778 mil. km",
                layers: [{ name: "Çekirdek", radius: 0.6, color: 0xffffff, info: "Yoğun merkez." }, { name: "Sıvı Hidrojen", radius: 1.5, color: 0xffcc88, info: "Metalik sıvı deniz." }, { name: "Gaz Atmosfer", radius: 2.3, color: 0xd4a373, info: "Fırtınalı dış katman." }]
            },
            {
                name: "Satürn", size: 1.9, distance: 53, speed: 0.003, rotSpeed: 0.13, color: 0xf4e2bb, diameter: "116,460 km", sunDist: "1.4 milyar km",
                layers: [{ name: "Çekirdek", radius: 0.5, color: 0xffffff, info: "Ağır elementler." }, { name: "Gaz Manto", radius: 1.2, color: 0xd4b886, info: "Hidrojen tabakası." }, { name: "Halkalı Atmosfer", radius: 1.9, color: 0xf4e2bb, info: "Buz halkalı dış katman." }]
            },
            {
                name: "Uranüs", size: 1.6, distance: 63, speed: 0.002, rotSpeed: -0.07, color: 0x73c2fb, diameter: "50,724 km", sunDist: "2.9 milyar km",
                layers: [{ name: "Kayalık Çekirdek", radius: 0.4, color: 0xffffff, info: "Kaya ve metal merkez." }, { name: "Buzlu Manto", radius: 1.0, color: 0x4169e1, info: "Su, amonyak ve metan buzu." }, { name: "Buz Devi Atmosfer", radius: 1.6, color: 0x73c2fb, info: "Helyum ve hidrojen dış katman." }]
            },
            {
                name: "Neptün", size: 1.5, distance: 72, speed: 0.0015, rotSpeed: 0.08, color: 0x3b82f6, diameter: "49,244 km", sunDist: "4.5 milyar km",
                layers: [{ name: "Kayalık Çekirdek", radius: 0.4, color: 0xffffff, info: "Demir-nikel ve silikat çekirdek." }, { name: "Buzlu Manto", radius: 0.95, color: 0x1d4ed8, info: "Zengin su-amonyak mantosu." }, { name: "Fırtınalı Atmosfer", radius: 1.5, color: 0x3b82f6, info: "Aktif rüzgarlar ve bulutlar." }]
            }
        ];

        let planetObjects = [];
        let earthGroupRef = null;

        planetDatas.forEach(data => {
            let orbitGeo = new THREE.RingGeometry(data.distance - 0.08, data.distance + 0.08, 128);
            let orbitMat = new THREE.MeshBasicMaterial({ color: 0x555555, side: THREE.DoubleSide, transparent: true, opacity: 0.7 });
            let orbitLine = new THREE.Mesh(orbitGeo, orbitMat);
            orbitLine.rotation.x = Math.PI / 2;
            scene.add(orbitLine);

            let group = new THREE.Group();
            scene.add(group);

            if (data.name === "Dünya") {
                earthGroupRef = group;
            }

            let geo = new THREE.SphereGeometry(data.size, 32, 32);
            let mat = new THREE.MeshStandardMaterial({ color: data.color });
            let normalMesh = new THREE.Mesh(geo, mat);
            group.add(normalMesh);

            let layeredGroup = new THREE.Group();
            layeredGroup.visible = false;
            group.add(layeredGroup);

            data.layers.forEach(l => {
                let layerGeo = new THREE.SphereGeometry(l.radius, 32, 32, 0, 4.7, 0, Math.PI);
                let layerMat = new THREE.MeshStandardMaterial({ color: l.color, side: THREE.DoubleSide, roughness: 0.4 });
                layeredGroup.add(new THREE.Mesh(layerGeo, layerMat));
            });

            if (data.name === "Satürn") {
                let ringGeo = new THREE.RingGeometry(data.size + 0.5, data.size + 1.8, 32);
                let ringMat = new THREE.MeshStandardMaterial({ color: 0xd4b886, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
                let ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2;
                normalMesh.add(ring);
            }

            let sprite = createTextSprite(data.name);
            sprite.position.set(0, data.size + 0.9, 0);
            group.add(sprite);

            celestialBodies.push({ name: data.name, group: group, normalMesh: normalMesh, layeredGroup: layeredGroup, data: data, size: data.size });
            planetObjects.push({ bodyGroup: group, distance: data.distance, speed: data.speed, rotSpeed: data.rotSpeed, angle: Math.random() * Math.PI * 2, normalMesh: normalMesh, layeredGroup: layeredGroup });
        });

        // --- ASTEROİT KUŞAĞI VE BÜYÜK METEORLAR ---
        let asteroidCount = 1000;
        let asteroidGeo = new THREE.BufferGeometry();
        let asteroidPos = [];
        for (let i = 0; i < asteroidCount; i++) {
            let angle = Math.random() * Math.PI * 2;
            let dist = 36 + Math.random() * 4.5;
            let x = Math.cos(angle) * dist;
            let z = Math.sin(angle) * dist;
            let y = (Math.random() - 0.5) * 1.5;
            asteroidPos.push(x, y, z);
        }
        asteroidGeo.setAttribute('position', new THREE.Float32BufferAttribute(asteroidPos, 3));
        let asteroidMat = new THREE.PointsMaterial({ color: 0x888888, size: 0.4 });
        let asteroidBelt = new THREE.Points(asteroidGeo, asteroidMat);
        scene.add(asteroidBelt);

        // Kuşak içinde dönen 3 boyutlu büyük meteor kayaları (Ceres/Vesta tarzı)
        let meteorsGroup = new	THREE.Group();
        scene.add(meteorsGroup);
        let meteorDataList = [
            { dist: 38, size: 0.9, speed: 0.006, angle: 1.0 },
            { dist: 37, size: 0.7, speed: 0.007, angle: 3.5 },
            { dist: 39.5, size: 1.1, speed: 0.005, angle: 5.0 }
        ];
        let meteorMeshes = [];
        meteorDataList.forEach(m => {
            let geo = new THREE.DodecahedronGeometry(m.size, 1); // Pürüzlü kaya görünümü için
            let mat = new THREE.MeshStandardMaterial({ color: 0x777777, roughness: 0.9 });
            let mesh = new THREE.Mesh(geo, mat);
            meteorsGroup.add(mesh);
            meteorMeshes.push({ mesh: mesh, dist: m.dist, speed: m.speed, angle: m.angle });
        });

        // --- AY ---
        let moonOrbitGeo = new THREE.RingGeometry(2.45, 2.55, 64);
        let moonOrbitMat = new THREE.MeshBasicMaterial({ color: 0x444444, side: THREE.DoubleSide, transparent: true, opacity: 0.5 });
        let moonOrbitLine = new THREE.Mesh(moonOrbitGeo, moonOrbitMat);
        moonOrbitLine.rotation.x = Math.PI / 2;
        scene.add(moonOrbitLine);

        let moonGroup = new THREE.Group();
        scene.add(moonGroup);

        let moonData = {
            name: "Ay", diameter: "3,474 km", sunDist: "Dünya'nın Çevresi",
            layers: [
                { name: "Çekirdek", radius: 0.12, color: 0xffffff, info: "Demir zengini küçük iç merkez." },
                { name: "Manto", radius: 0.25, color: 0x888888, info: "Magnezyum ve demir açısından zengin kayalık iç tabaka." },
                { name: "Kabuk", radius: 0.35, color: 0xcccccc, info: "Kraterler ve volkanik kalıntılarla dolu en dış yüzey tabakası." }
            ]
        };

        let normalMoonGeo = new THREE.SphereGeometry(0.35, 16, 16);
        let normalMoonMat = new THREE.MeshStandardMaterial({ color: 0xcccccc });
        let normalMoonMesh = new THREE.Mesh(normalMoonGeo, normalMoonMat);
        moonGroup.add(normalMoonMesh);

        let layeredMoonGroup = new THREE.Group();
        layeredMoonGroup.visible = false;
        moonGroup.add(layeredMoonGroup);

        moonData.layers.forEach(l => {
            let geo = new THREE.SphereGeometry(l.radius, 32, 32, 0, 4.7, 0, Math.PI);
            let mat = new THREE.MeshStandardMaterial({ color: l.color, side: THREE.DoubleSide, roughness: 0.4 });
            layeredMoonGroup.add(new THREE.Mesh(geo, mat));
        });

        let moonSprite = createTextSprite("Ay", 0.5);
        moonSprite.position.set(0, 0.6, 0);
        moonGroup.add(moonSprite);

        celestialBodies.push({ name: "Ay", group: moonGroup, normalMesh: normalMoonMesh, layeredGroup: layeredMoonGroup, data: moonData, size: 0.35 });

        let moonAngle = 0;
        let moonDistance = 2.5;

        let isRunning = true;
        let speedMultiplier = 1;
        document.getElementById('toggleBtn').onclick = () => { isRunning = !isRunning; };
        document.getElementById('speedRange').oninput = (e) => { speedMultiplier = parseFloat(e.target.value); };

        window.focusOnBody = function(name) {
            if (name === 'Genel') {
                targetFocus = null;
                controls.target.set(0, 0, 0);
                camera.position.set(0, 80, 140);
                resetView();
                return;
            }
            let targetBody = celestialBodies.find(b => b.name === name);
            if (targetBody) {
                targetFocus = targetBody.group;
                controls.target.copy(targetFocus.position);
                let offset = targetBody.size * 4;
                camera.position.set(targetFocus.position.x + offset, targetFocus.position.y + offset * 0.5, targetFocus.position.z + offset);
                openLayerPanel(targetBody);
            }
        }

        function openLayerPanel(body) {
            if (activeBody && activeBody !== body) {
                activeBody.normalMesh.visible = true;
                activeBody.layeredGroup.visible = false;
            }

            activeBody = body;
            activeBody.normalMesh.visible = false;
            activeBody.layeredGroup.visible = true;

            document.getElementById('objName').innerText = activeBody.data.name + " Katmanları";
            document.getElementById('objMeta').innerHTML = `<b>Çap:</b> ${activeBody.data.diameter} | <b>Uzaklık:</b> ${activeBody.data.sunDist}`;
            
            let btnContainer = document.getElementById('layerButtons');
            btnContainer.innerHTML = "";
            document.getElementById('layerDetail').innerText = "İncelemek istediğin katmana tıkla.";

            activeBody.data.layers.forEach(l => {
                let btn = document.createElement('button');
                btn.className = "layer-btn";
                btn.innerText = l.name;
                btn.onclick = () => {
                    document.getElementById('layerDetail').innerHTML = `<b>${l.name}:</b> ${l.info}`;
                };
                btnContainer.appendChild(btn);
            });

            document.getElementById('info').style.display = 'block';
        }

        window.resetView = function() {
            if (activeBody) {
                activeBody.normalMesh.visible = true;
                activeBody.layeredGroup.visible = false;
                activeBody = null;
            }
            document.getElementById('info').style.display = 'none';
        }

        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            if (event.clientX < 220 && event.clientY < 380) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);

            let meshes = celestialBodies.map(b => b.normalMesh);
            let intersects = raycaster.intersectObjects(meshes);

            if (intersects.length > 0) {
                let hitMesh = intersects[0].object;
                let clickedBody = celestialBodies.find(b => b.normalMesh === hitMesh);
                if (clickedBody) {
                    focusOnBody(clickedBody.name);
                }
            }
        });

        function animate() {
            requestAnimationFrame(animate);

            if (isRunning) {
                sunGroup.rotation.y += 0.005 * speedMultiplier;
                layeredSunGroup.rotation.y += 0.002 * speedMultiplier;

                planetObjects.forEach(p => {
                    p.angle += p.speed * speedMultiplier * 0.1;
                    p.bodyGroup.position.x = Math.cos(p.angle) * p.distance;
                    p.bodyGroup.position.z = Math.sin(p.angle) * p.distance;
                    
                    p.normalMesh.rotation.y += p.rotSpeed * speedMultiplier;
                    p.layeredGroup.rotation.y += p.rotSpeed * speedMultiplier;
                });

                asteroidBelt.rotation.y += 0.001 * speedMultiplier;

                // Büyük meteorların yörüngede dönmesi ve kendi eksenlerinde takla atması
                meteorMeshes.forEach(m => {
                    m.angle += m.speed * speedMultiplier * 0.1;
                    m.mesh.position.x = Math.cos(m.angle) * m.dist;
                    m.mesh.position.z = Math.sin(m.angle) * m.dist;
                    m.mesh.rotation.x += 0.02;
                    m.mesh.rotation.y += 0.03;
                });

                if (earthGroupRef) {
                    moonAngle += 0.012 * speedMultiplier;
                    moonGroup.position.x = earthGroupRef.position.x + Math.cos(moonAngle) * moonDistance;
                    moonGroup.position.z = earthGroupRef.position.z + Math.sin(moonAngle) * moonDistance;
                    moonGroup.position.y = earthGroupRef.position.y;
                    
                    moonOrbitLine.position.copy(earthGroupRef.position);

                    normalMoonMesh.rotation.y += 0.01;
                    layeredMoonGroup.rotation.y += 0.01;
                }
            }

            if (targetFocus) {
                controls.target.copy(targetFocus.position);
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Güneş Sistemi</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;width:100%;height:100%;background:#000;font-family:Arial,sans-serif}
#baslik{position:fixed;top:15px;left:50%;transform:translateX(-50%);color:white;font-size:24px;font-weight:bold;z-index:10;text-align:center}
#bilgi{display:none;position:fixed;top:70px;left:15px;width:240px;padding:15px;background:rgba(0,0,0,.88);color:white;border:2px solid white;border-radius:12px;z-index:100}
#gezegenAdi{font-size:22px;font-weight:bold;margin-bottom:10px}
#kontroller{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);z-index:20;background:rgba(0,0,0,.75);padding:10px 15px;border-radius:12px;color:white;text-align:center}
button{padding:8px 14px;margin:3px;border:none;border-radius:8px;cursor:pointer}
#ipucu{position:fixed;top:50px;left:50%;transform:translateX(-50%);color:#ccc;z-index:10;font-size:13px}
</style>
</head>
<body>
<div id="baslik">🌌 3D Güneş Sistemi</div>
<div id="ipucu">Gezegenlere dokunarak bilgi al • Parmağınla döndür • Yakınlaştır</div>
<div id="bilgi">
<div id="gezegenAdi"></div>
<div>📏 Çap: <span id="cap"></span></div>
<div>☀️ Güneş'e uzaklık: <span id="uzaklik"></span></div>
<div>🔄 Dolanma süresi: <span id="dolanim"></span></div>
<div>🌙 Uydu sayısı: <span id="uydu"></span></div>
</div>
<div id="kontroller">
<button onclick="calistir()">▶️ Başlat</button>
<button onclick="durdur()">⏸ Durdur</button><br>
Hız: <input id="hiz" type="range" min="0" max="3" step="0.1" value="1">
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,.1,1000);
camera.position.set(0,55,100);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);
renderer.domElement.style.touchAction="none";
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.05;controls.minDistance=25;controls.maxDistance=180;

scene.add(new THREE.AmbientLight(0xffffff,.5));
scene.add(new THREE.PointLight(0xffffff,2,500));

const starGeometry=new THREE.BufferGeometry(),starPositions=[];
for(let i=0;i<2500;i++)starPositions.push((Math.random()-.5)*500,(Math.random()-.5)*500,(Math.random()-.5)*500);
starGeometry.setAttribute("position",new THREE.Float32BufferAttribute(starPositions,3));
scene.add(new THREE.Points(starGeometry,new THREE.PointsMaterial({color:0xffffff,size:.7})));

const sun=new THREE.Mesh(new THREE.SphereGeometry(7,32,32),new THREE.MeshBasicMaterial({color:0xffcc33}));
scene.add(sun);

const planetData=[
{name:"Merkür",diameter:"4.879 km",distance:"57,9 milyon km",period:"88 gün",moons:"0",radius:1.4,orbit:11,speed:4.2,color:0xaaaaaa},
{name:"Venüs",diameter:"12.104 km",distance:"108,2 milyon km",period:"225 gün",moons:"0",radius:2,orbit:17,speed:3.2,color:0xd8a24a},
{name:"Dünya",diameter:"12.742 km",distance:"149,6 milyon km",period:"365 gün",moons:"1",radius:2.2,orbit:23,speed:2.6,color:0x2277dd},
{name:"Mars",diameter:"6.779 km",distance:"227,9 milyon km",period:"687 gün",moons:"2",radius:1.8,orbit:29,speed:2.1,color:0xdd5533},
{name:"Jüpiter",diameter:"139.820 km",distance:"778,5 milyon km",period:"11,86 yıl",moons:"95",radius:5.2,orbit:39,speed:1.35,color:0xd8a46a},
{name:"Satürn",diameter:"116.460 km",distance:"1,43 milyar km",period:"29,45 yıl",moons:"274",radius:4.5,orbit:50,speed:1,color:0xe0c080},
{name:"Uranüs",diameter:"50.724 km",distance:"2,87 milyar km",period:"84 yıl",moons:"28",radius:3.2,orbit:61,speed:.72,color:0x77ccdd},
{name:"Neptün",diameter:"49.244 km",distance:"4,50 milyar km",period:"164,8 yıl",moons:"16",radius:3.1,orbit:72,speed:.55,color:0x3355cc}
];
const planets=[],planetGroups=[];
planetData.forEach(d=>{
const points=[];
for(let i=0;i<128;i++){const a=i/128*Math.PI*2;points.push(new THREE.Vector3(Math.cos(a)*d.orbit,0,Math.sin(a)*d.orbit))}
scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(points),new THREE.LineBasicMaterial({color:0x555555})));
});
planetData.forEach(d=>{
const group=new THREE.Group();
const planet=new THREE.Mesh(new THREE.SphereGeometry(d.radius,32,32),new THREE.MeshStandardMaterial({color:d.color}));
planet.userData=d;group.add(planet);d.angle=Math.random()*Math.PI*2;scene.add(group);
planets.push(planet);planetGroups.push(group);
if(d.name==="Satürn"){
const ring=new THREE.Mesh(new THREE.RingGeometry(6,9,64),new THREE.MeshBasicMaterial({color:0xc9b27c,side:THREE.DoubleSide}));
ring.rotation.x=Math.PI/2;planet.add(ring);
}
if(d.name==="Dünya"){
const moon=new THREE.Mesh(new THREE.SphereGeometry(.6,20,20),new THREE.MeshStandardMaterial({color:0xaaaaaa}));
moon.position.x=4;planet.add(moon);d.moon=moon;d.moonAngle=0;
}
});

const asteroidGroup=new THREE.Group();
for(let i=0;i<280;i++){
const angle=Math.random()*Math.PI*2,radius=31+Math.random()*5;
const asteroid=new THREE.Mesh(new THREE.SphereGeometry(.12+Math.random()*.18,6,6),new THREE.MeshBasicMaterial({color:0x888888}));
asteroid.position.set(Math.cos(angle)*radius,(Math.random()-.5)*2,Math.sin(angle)*radius);
asteroid.userData.angle=angle;asteroid.userData.radius=radius;asteroidGroup.add(asteroid);
}
scene.add(asteroidGroup);

const raycaster=new THREE.Raycaster(),mouse=new THREE.Vector2();
let downX=0,downY=0,hareketEtti=false;
renderer.domElement.addEventListener("pointerdown",e=>{downX=e.clientX;downY=e.clientY;hareketEtti=false});
renderer.domElement.addEventListener("pointermove",e=>{if(Math.hypot(e.clientX-downX,e.clientY-downY)>10)hareketEtti=true});
renderer.domElement.addEventListener("pointerup",e=>{
if(hareketEtti)return;
const rect=renderer.domElement.getBoundingClientRect();
mouse.x=((e.clientX-rect.left)/rect.width)*2-1;
mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;
raycaster.setFromCamera(mouse,camera);
const hits=raycaster.intersectObjects(planets,false);
if(hits.length){
const d=hits[0].object.userData;
document.getElementById("gezegenAdi").textContent="🪐 "+d.name;
document.getElementById("cap").textContent=d.diameter;
document.getElementById("uzaklik").textContent=d.distance;
document.getElementById("dolanim").textContent=d.period;
document.getElementById("uydu").textContent=d.moons;
document.getElementById("bilgi").style.display="block";
}});
let oynuyor=true;
function calistir(){oynuyor=true} function durdur(){oynuyor=false}
const clock=new THREE.Clock();
function animate(){
requestAnimationFrame(animate);
const delta=clock.getDelta(),hiz=Number(document.getElementById("hiz").value);
if(oynuyor){
planetData.forEach((d,i)=>{
d.angle-=delta*.25*d.speed*hiz;
planetGroups[i].position.x=Math.cos(d.angle)*d.orbit;
planetGroups[i].position.z=Math.sin(d.angle)*d.orbit;
if(d.moon){d.moonAngle-=delta*2*hiz;d.moon.position.x=Math.cos(d.moonAngle)*4;d.moon.position.z=Math.sin(d.moonAngle)*4}
});
asteroidGroup.children.forEach(a=>{
a.userData.angle-=delta*.15*hiz;
a.position.x=Math.cos(a.userData.angle)*a.userData.radius;
a.position.z=Math.sin(a.userData.angle)*a.userData.radius;
});
sun.rotation.y+=delta*.2;
}
controls.update();renderer.render(scene,camera);
}
animate();
window.addEventListener("resize",()=>{
camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
